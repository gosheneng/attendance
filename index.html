['주민등록번호는 동의가 아니라 법령에 근거하여 처리합니다. 회사는 소득세 원천징수 및 4대보험(국민연금·건강보험·고용보험·산재보험) 신고 등 법령상 의무 이행에 필요한 범위에서만 주민등록번호를 처리하며, 암호화하여 보관하고 관리자만 열람할 수 있도록 제한합니다.','Số đăng ký cư trú (số đăng ký người nước ngoài) được xử lý theo quy định pháp luật, không dựa trên sự đồng ý. Công ty chỉ dùng trong phạm vi cần thiết để khấu trừ thuế thu nhập và khai báo 4 loại bảo hiểm (hưu trí, y tế, việc làm, tai nạn lao động); số này được mã hóa và chỉ quản lý mới xem được.','The registration number is processed under law, not consent. The company uses it only as needed for income tax withholding and the four social insurances (pension, health, employment, industrial accident); it is stored encrypted and only administrators can view it.'],

const I18PS=I18P.slice().sort((a,b)=>b[0].length-a[0].length);
function trPhr(s){let o=s;I18PS.forEach(([k,vi,en])=>{if(o.indexOf(k)>=0)o=o.split(k).join(LANG==='vi'?vi:en);});const ex=I18M[o.trim()];return ex?ex[LANG]:o;}
function trCore(c){if(!c||!/[가-힣]/.test(c))return c;const ex=I18M[c];if(ex)return ex[LANG];
  for(const [re,fn] of I18R){const m=re.exec(c);if(m)return fn(m);}
  return trPhr(c);}

function tokSet(t,keep){TOKEN=t||'';try{localStorage.removeItem(TK);sessionStorage.removeItem(TK);if(t)(keep?localStorage:sessionStorage).setItem(TK,t);}catch(e){}}
/* 속도: 서버가 바뀐 항목만 보내면 나머지는 직전 것을 그대로 씀 */
var ST_H=null,ST_K={};
function stMerge(st){var h=st.__h;if(!h)return;delete st.__h;var nh={};
  Object.keys(h).forEach(function(k){if(k in st){ST_K[k]=JSON.stringify(st[k]);nh[k]=h[k];}else if(ST_K[k]!=null){st[k]=JSON.parse(ST_K[k]);nh[k]=h[k];}});
  ST_H=st.__part?Object.assign({},ST_H||{},nh):nh;}   /* 일부만 온 경우: 나머지 지문은 그대로 */
/* 출근 몰림 대비: 출퇴근은 같은 요청번호로 최대 3번 자동 재시도 (서버가 중복 처리를 막음) */
function call(op,p){
  if(op!=='check')return call1(op,p);
  p=p||{};if(!p.rid)p.rid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  var tries=0;
  var go=function(){return call1(op,p).catch(function(e){var m=String(e&&e.message||e);
    var retry=!e.relogin&&tries<5&&(e.busy||/사용자가 많아|응답이 늦습니다|인터넷 연결|서버 연결 오류|응답을 읽지/.test(m));
    if(!retry)throw e;tries++;busyMsg('사람이 많아 잠시 기다리는 중… ('+tries+'/5)');
    return new Promise(function(r){setTimeout(r,1500+Math.random()*2500);}).then(go);});};
  return go().finally(function(){busyMsg('');});
}
function busyMsg(t){if(typeof CK_ON!=='undefined'&&CK_ON&&t){ckBar('⏳ '+t);return;}var b=document.getElementById('busy');if(!b)return;var d=b.querySelector('.bmsg');if(!d){d=document.createElement('div');d.className='bmsg';d.style.cssText='font-size:12px;color:#666;margin-top:6px';b.firstChild.appendChild(d);}d.textContent=t;}
/* 구글 서버가 가끔(약 10회 중 1번) 응답 없이 멈춤 → 짧게 기다렸다가 같은 요청번호(rid)로 다시 보냄. 서버가 같은 번호는 한 번만 처리 */
var READ_OPS={boot:1,pay_seen:1,ext_month:1,qrInfo:1,records:1,roster_permitGet:1},LONG_OPS={calList:1,roster_permitUp:1,qual_ocr:1,health_ocr:1,my_health_ocr:1,pay_parse:1,health_reqFile:1,comp_fileUp:1,comp_get:1,form_up:1,form_get:1,buy_tpl:1,car_fileUp:1,car_fileGet:1,qual_fileGet:1};
function call1(op,p){if(LONG_OPS[op])return call0(op,p,'',op==='calList'?60000:120000);
  const rid=READ_OPS[op]?'':Date.now().toString(36)+Math.random().toString(36).slice(2,8),to=op==='check'?25000:READ_OPS[op]?12000:20000;let n=0;
  let nb=0;
  const go=()=>call0(op,p,rid,to).catch(e=>{const m=String(e&&e.message||e);if(e&&e.relogin)throw e;
    if(e&&e.busy){if(op==='check'||nb>=4)throw e;nb++;busyMsg('사람이 많아 잠시 기다리는 중… ('+nb+'/4)');return new Promise(r=>setTimeout(r,1500+Math.random()*2500)).then(go);}
    if(n<2&&/응답이 늦습니다|인터넷 연결|서버 연결 오류|응답을 읽지/.test(m)){n++;if(op!=='check')busyMsg('서버 응답이 늦어 다시 보내는 중… ('+n+'/2)');return new Promise(r=>setTimeout(r,500)).then(go);}throw e;});
  return go().finally(()=>{if(op!=='check')busyMsg('');});}
function call0(op,p,rid,toMs){
  if(BOOT.api){ /* 외부 호스팅 화면: 구글 로그인 쿠키 없이 서버 호출 (계정 여러 개·브라우저 무관) */
    const ac=(typeof AbortController!=='undefined')?new AbortController():null;const tm=setTimeout(()=>{if(ac)ac.abort();},toMs||30000);
    return fetch(BOOT.api,{method:'POST',credentials:'omit',redirect:'follow',cache:'no-store',signal:ac?ac.signal:undefined,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({t:TOKEN,op:op,p:p||{},h:ST_H,rid:rid||''})})
      .finally(()=>clearTimeout(tm))
      .then(r=>{if(!r.ok)throw new Error('서버 연결 오류 ('+r.status+')');return r.text();})
      .then(tx=>{let r;try{r=JSON.parse(tx);}catch(e){throw new Error('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도해 주세요.');}
        if(r&&r.dupBig){return call0('boot',{},'',12000).then(b=>{if(b.state)applyState(b.state);return {};});}if(r&&r.error){const e=new Error(r.error);e.relogin=!!r.relogin;e.busy=!!r.busy;throw e;}if(r&&r.state)stMerge(r.state);return r||{};},
        e=>{if(e&&e.name==='AbortError')throw new Error('서버 응답이 늦습니다. 잠시 후 다시 눌러 주세요.');throw (e&&e.message&&e.message.indexOf('서버')===0)?e:new Error('인터넷 연결을 확인해 주세요.\n('+((e&&(e.name+': '+e.message))||e)+')');});
  }
  return new Promise((res,rej)=>{google.script.run.withSuccessHandler(r=>{if(r&&r.error){const e=new Error(r.error);e.relogin=!!r.relogin;rej(e);}else res(r||{});}).withFailureHandler(e=>rej(new Error((e&&e.message)||String(e)))).api(TOKEN,op,p||{});});}
var busyN=0;
function busy(on){busyN+=on?1:-1;let b=document.getElementById('busy');if(!b){b=document.createElement('div');b.id='busy';b.style.cssText='position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:80;display:none;align-items:center;justify-content:center';b.innerHTML='<div style="background:#fff;border:1px solid #e1e5eb;border-radius:12px;padding:16px 22px;text-align:center"><div class="spin"></div>처리 중…</div>';document.body.appendChild(b);}b.style.display=busyN>0?'flex':'none';}
function applyState(st){
  if(st&&st.__part){Object.keys(st).forEach(function(k){if(k!=='__part'&&k!=='me'&&k!=='perms'&&k!=='today')S[k]=st[k]||[];});return;}   /* 바뀐 부분만 반영 */
  if(st.forms)S.forms=st.forms;else if(!st.__part)S.forms=S.forms||[];S.leaves=st.leaves||[];S.leaveCal=st.leaveCal||[];S.gisung=st.gisung||[];S.safety=st.safety||[];S.workers=st.workers;S.projects=st.projects;S.spots=st.spots;S.records=st.records;S.log=st.log||[];S.settings=st.settings;S.recFrom=st.recFrom;S.rosters=st.rosters||[];S.cars=st.cars||[];S.posts=st.posts||[];S.notices=st.notices||[];S.payslips=st.payslips||[];S.prework=st.prework||[];S.compdocs=st.compdocs||[];S.buys=st.buys||[];S.taxreqs=st.taxreqs||[];
  ses.uid=st.me.id;ses.setup=null;ses.setupW=null;
}
function failMsg(e){
  if(e&&e.relogin){tokSet('');ses.uid=null;closeModal();render();toast('다시 로그인해 주세요.');return;}
  alertBox('처리하지 못했습니다',String(e&&e.message||e).split('\n'));
}
/* 서버 요청 → 상태 반영 → 화면 갱신 */
async function run(op,p,okMsg,keepModal){
  busy(true);
  try{const r=await call(op,p);if(r.state)applyState(r.state);if(!keepModal)closeModal();render();const m=r.msg||okMsg;if(m)toast(m);return r;}
  catch(e){failMsg(e);return null;}
  finally{busy(false);}
}

var GPS_LAST=null,GPS_W=null;
function gpsWarm(){if(!navigator.geolocation||GPS_W!=null)return;try{GPS_W=navigator.geolocation.watchPosition(p=>{GPS_LAST={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),t:Date.now()};},()=>{},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});setTimeout(()=>{try{navigator.geolocation.clearWatch(GPS_W);}catch(e){}GPS_W=null;},180000);}catch(e){}}
getPos=function(){if(GPS_LAST&&Date.now()-GPS_LAST.t<20000&&GPS_LAST.acc!=null&&GPS_LAST.acc<=150)return Promise.resolve({lat:GPS_LAST.lat,lng:GPS_LAST.lng,acc:GPS_LAST.acc});   /* 미리 잡아 둔 최신 위치(20초 이내)면 바로 사용 */
  return getPos0();};
function getPos0(){return new Promise(res=>{
  if(!navigator.geolocation){res({lat:null,lng:null,acc:null});return;}
  let done=false;const t=setTimeout(()=>{if(!done){done=true;res({lat:null,lng:null,acc:null});}},12000);
  try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(t);res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)});},
    ()=>{if(done)return;done=true;clearTimeout(t);res({lat:null,lng:null,acc:null});},{enableHighAccuracy:true,timeout:10000,maximumAge:0});}
  catch(e){clearTimeout(t);res({lat:null,lng:null,acc:null});}
});}

/* ----- 관리자: 출근 기록 ----- */
commitDraft=async function(newStatus){
  const r=draft;
  if(!r.workerId){toast('근로자를 선택하세요.');return;}
  const v=validate(r,true);
  if(newStatus!=='rejected'&&v.errors.length){toast('빨간색 항목을 먼저 수정하세요.');return;}
  if(newStatus==='rejected'&&!(r.rejectReason||'').trim()){toast('반려 사유를 입력하세요.');return;}
  const res=await run('saveRecord',{rec:{workerId:r.workerId,date:r.date,checkIn:r.checkIn?{time:r.checkIn.time,date:r.checkIn.date}:null,checkOut:r.checkOut?{time:r.checkOut.time,date:r.checkOut.date}:null,entries:r.entries,rejectReason:r.rejectReason||''},origId:draftOrig||'',newStatus:newStatus||null},null,true);
  if(res){closeModal();ui.sel.delete(draftOrig);render();}
};
bulkApprove=async function(){
  const ids=[...ui.sel];if(!ids.length)return;
  if(!(await confirmBox(`선택한 ${ids.length}건을 승인할까요?`,'승인')))return;
  const r=await run('bulkApprove',{ids});if(!r)return;ui.sel.clear();render();
  if(r.skip&&r.skip.length)alertBox(`${r.n}건 승인 · ${r.skip.length}건 제외 (입력 오류)`,r.skip);else toast(`${r.n}건 승인 완료`);
};
aDelete=async function(){
  const o=S.records.find(x=>x.id===draftOrig);if(!o)return;
  if(!(await confirmBox(`<b>${esc(W(o.workerId).name)} · ${fmtDay(o.date)}</b> 기록을 삭제할까요?\n\n삭제하면 복구할 수 없으며, 변경 이력에 삭제 사실과 내용이 남습니다.`,'삭제'))){renderAdminModal();return;}
  await run('deleteRecord',{id:o.id},'삭제했습니다.');ui.sel.delete(o.id);
};
/* 지난 기간 기록 불러오기 (월간 출근부·승인 관리) */
var loadingFrom={};
function ensureFrom(from){
  if(!from||!S.recFrom||from>=S.recFrom||loadingFrom[from])return false;
  loadingFrom[from]=1;
  call('records',{from,to:S.recFrom}).then(r=>{const have=new Set(S.records.map(x=>x.id));r.records.forEach(x=>{if(!have.has(x.id))S.records.push(x);});S.recFrom=from;delete loadingFrom[from];render();}).catch(e=>{delete loadingFrom[from];failMsg(e);});
  return true;
}
var _aMonth=aMonth,_aAppr=aAppr;
aMonth=function(){if(ensureFrom(ui.month+'-01'))return '<div class="card"><div class="spin"></div><p class="mute" style="text-align:center">지난 기록을 불러오는 중…</p></div>';return _aMonth();};
aAppr=function(){if(ensureFrom(ui.f.from))return '<div class="card"><div class="spin"></div><p class="mute" style="text-align:center">지난 기록을 불러오는 중…</p></div>';return _aAppr();};

};

/* ----- 관리자: 공사 ----- */
aProjSave=function(id){const g=k=>document.getElementById(k).value.trim();run('saveProject',{id,data:{code:g('fp_code'),contractor:g('fp_ctr'),contractStart:g('fp_start'),client:g('fp_client'),plant:g('fp_plant'),name:g('fp_name'),amount:g('fp_amount'),mgrName:g('fp_mgr'),mgrPhone:g('fp_mgrph'),noSafety:document.getElementById('fp_nosafe').checked}},null,true).then(r=>{if(r)closeModal(),render();});};
aProjToggle=function(id){run('projectToggle',{id});};
aProjDone=async function(id,on){const p=P(id);
  if(on){const pend=S.records.filter(r=>(r.status==='pending'||r.status==='draft')&&r.entries.some(e=>e.projectId===id)).length;
    if(!(await confirmBox(`<b>${esc(p.name)}</b> 공사를 완료 처리할까요?\n\n완료하면 근로자 드롭다운에서 사라지고, 지금까지의 기록은 그대로 보존됩니다.${pend?`\n\n※ 이 공사가 포함된 미승인 기록이 ${pend}건 있습니다. 승인 관리에서 확인하세요.`:''}`,'완료 처리')))return;}
  run('projectDone',{id,on});};
aProjDel=async function(id){const p=P(id);const has=(S.gisung||[]).some(g=>g.projectId===id&&(g.prev!==''||(g.m||[]).some(v=>v!==''&&v!=null)))||(S.safety||[]).some(x=>x.projectId===id&&(x.budget!==''||x.carry!==''||(x.m||[]).some(v=>v!==''&&v!=null)));if(!(await confirmBox(`${esc(p.name)} 공사를 삭제할까요?${has?'<br><b style="color:var(--bad)">기성준공·안전관리비 대장에 입력된 금액도 함께 지워지며 되돌릴 수 없습니다.</b>':''}`,'삭제')))return;run('deleteProject',{id});};

aSpotSave=function(id){const g=k=>document.getElementById(k).value.trim();run('saveSpot',{id,data:{name:g('fs_name'),addr:g('fs_addr'),lat:g('fs_lat'),lng:g('fs_lng'),radius:g('fs_rad')}},null,true).then(r=>{if(r)closeModal(),render();});};

  try{await call('signup',d);ses.signup=false;render();alertBox('가입 신청이 접수되었습니다',['관리자가 승인하면 연락처와 비밀번호로 로그인할 수 있습니다.']);}

/* ----- 파일 저장: 인쇄용은 새 창, CSV는 구글 드라이브에 저장 ----- */
saveFile=async function(filename,data){
  if(filename.endsWith('.html')){
    let w=null;try{w=window.open('','_blank');}catch(e){}
    if(w){w.document.open();w.document.write(data);w.document.close();toast('새 창에서 열었습니다. 인쇄(Ctrl+P)하세요.');return;}
  }
  busy(true);
  try{const r=await call('exportFile',{name:filename,data});
    openModal(`<div class="mbox" style="max-width:460px"><h3>파일을 만들었습니다</h3><p class="mute">구글 드라이브 "전자출근부_내보내기" 폴더에 저장했습니다.</p><div class="row"><a class="btn pri" href="${esc(r.download)}" target="_blank" rel="noopener">내려받기</a><a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">드라이브에서 열기</a><span class="sp"></span><button class="btn" onclick="closeModal()">닫기</button></div></div>`);
  }catch(e){failMsg(e);}finally{busy(false);}
};
}
