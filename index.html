<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고센이엔지 전자 출근부</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e1e5eb;--pri:#1f4e8c;--pri2:#2f6fbf;--ok:#1f8a4c;--warn:#b86e00;--bad:#c23b3b;--chip:#eef2f7}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.demo-banner{background:#fff4d6;color:#6d4a00;font-size:13px;padding:6px 16px;border-bottom:1px solid #f0dca0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:none;color:var(--pri2);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.top{background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top .brand{font-weight:700;font-size:16px}
.top .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.sp{flex:1}
.wrap{max-width:1440px;margin:0 auto;padding:16px}
.wrap.narrow{max-width:560px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.big{width:100%;padding:22px;font-size:21px;font-weight:700;border-radius:14px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;background:#fff;border-radius:10px 10px 0 0}
.tab{padding:11px 14px;border:none;background:none;font:inherit;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--pri);border-color:var(--pri);font-weight:700}
.tab .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{background:#f7f9fb;font-weight:500;color:var(--mute);white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.nw th,.nw td{white-space:nowrap;vertical-align:middle;padding:7px 5px;font-size:13.5px}
.nw .chip{font-size:11.5px;padding:1px 6px}
.nw td .btn{margin:1px 0}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--chip);white-space:nowrap;margin:1px 2px 1px 0}
.st-draft{background:#eef0f3;color:#55606e}.st-pend{background:#e6effb;color:var(--pri2)}.st-ok{background:#e3f4ea;color:var(--ok)}.st-bad{background:#fbe7e7;color:var(--bad)}
.c-in{background:#e3f4ea;color:var(--ok)}.c-out{background:#fff0dc;color:var(--warn)}.c-man{background:#eef0f3;color:#55606e}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd6df;border-radius:8px;width:100%;background:#fff;color:var(--ink)}
input:disabled,select:disabled,textarea:disabled{background:#f3f5f8}
input[type=checkbox]{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2fixed{grid-template-columns:1fr 1fr!important}
label.f{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
label.f>span{display:block;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fafbfc}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:28px 10px}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:14px;max-width:820px;width:100%;padding:18px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1c2430;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60;max-width:90vw}
#toast.on{opacity:1}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi .k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .k b{font-size:26px;display:block}
.kpi .k span{color:var(--mute);font-size:13px}
.month{font-size:12px}
.month th,.month td{padding:4px 3px;text-align:center;border:1px solid var(--line);white-space:nowrap}
.month td.nm{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
.month th.nm{position:sticky;left:0;z-index:2}
.cell-ot{background:#fff1dc}.cell-lv{background:#eaf6ee;color:var(--ok);font-weight:700}.cell-pend{color:var(--mute);font-style:italic;background:#f4f7fb}
.sun{color:var(--bad)}.sat{color:var(--pri2)}
.warnbox{background:#fff6e8;border:1px solid #f2c98a;color:#6e4500;padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
.badbox{background:#fdeeee;border:1px solid #f0b8b8;color:#8a2020;padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
.infobox{background:#eaf2fc;border:1px solid #bcd3f0;color:#1f4570;padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
.mute{color:var(--mute);font-size:13px}
.hist{font-size:13px;border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
.spin{width:36px;height:36px;border:4px solid #dfe6ef;border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.demo-acc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-acc button{text-align:left;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;font:inherit;cursor:pointer}
.demo-acc button small{display:block;color:var(--mute);font-size:12px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.consent{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;max-height:340px;overflow:auto}
.consent table td,.consent table th{font-size:13px}
.plan li{margin-bottom:6px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.demo-acc{grid-template-columns:1fr}.wrap{padding:10px}}
</style>
</head>
<body>
<div id="app"><div id="boot-msg" style="max-width:420px;margin:60px auto;text-align:center;color:#55606e;font-size:15px"><div class="spin"></div>전자 출근부를 불러오는 중…</div></div>
<script>
/* 화면 오류가 나면 백지 대신 오류 내용을 보여 줌 (원인 확인용) */
window.__showErr=function(msg){var a=document.getElementById('app');if(!a)return;var d=document.createElement('div');d.style.cssText='max-width:520px;margin:20px auto;padding:14px;border:1px solid #f0b8b8;background:#fdeeee;color:#8a2020;border-radius:10px;font-size:14px;word-break:break-all';d.textContent='화면 오류: '+msg+' — 이 화면을 캡처해서 관리자에게 보내 주세요.';a.insertBefore(d,a.firstChild);};
window.addEventListener('error',function(e){window.__showErr((e.message||'알 수 없는 오류')+(e.lineno?' (줄 '+e.lineno+')':''));});
setTimeout(function(){if(document.getElementById('boot-msg'))window.__showErr('화면을 불러오지 못했습니다. 새로고침해 보시고, 계속되면 Index 파일 붙여넣기가 끝까지 되었는지 확인하세요.');},12000);
</script>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>

function span(e){const s=toMin(e.start),en=toMin(e.end);if(s==null||en==null)return null;let x=en;if(x<=s)x+=1440;return[s,x];}
const crosses=e=>{const s=toMin(e.start),en=toMin(e.end);return s!=null&&en!=null&&en<=s;};
const entryMin=e=>{const sp=span(e);return sp?sp[1]-sp[0]:0;};
const totalMin=r=>(r.entries||[]).reduce((a,e)=>a+entryMin(e),0);
function absMin(r,c){if(!c||!c.time)return null;return toMin(c.time)+(c.date&&c.date!==r.date?1440:0);}
function stayMin(r){const a=absMin(r,r.checkIn),b=absMin(r,r.checkOut);return(a!=null&&b!=null)?b-a:null;}
function nearest(lat,lng){let best=null;S.projects.filter(p=>p.active&&p.lat>33&&p.lng>124).forEach(p=>{const d=haversine(lat,lng,p.lat,p.lng);if(!best||d<best.d)best={p,d};});return best;}
function locChip(c){
  if(!c)return '<span class="chip">미기록</span>';
  if(c.via==='qr'){const nm='QR';if(c.lat==null)return `<span class="chip c-out">${nm} · GPS없음</span>`;return c.inside?`<span class="chip c-in">${nm} · 위치일치 ${fmtDist(c.dist)}</span>`:`<span class="chip c-out">${nm} · 위치불일치 ${fmtDist(c.dist)}</span>`;}
  if(c.method==='manual'||c.method==='admin'||c.lat==null)return `<span class="chip c-man">${c.method==='admin'?'관리자 입력':'수기(위치없음)'}</span>`;
  return c.inside?`<span class="chip c-in">현장 내 ${fmtDist(c.dist)}</span>`:`<span class="chip c-out">현장 밖 ${fmtDist(c.dist)}</span>`;
}

}
function validate(r,isAdmin){
  const errors=[],warns=[];const es=r.entries||[];
  if(!es.length)errors.push('작업 내역을 1건 이상 입력하세요.');
  es.forEach((e,i)=>{
    const n=`작업 ${i+1}`;
    if(!e.projectId)errors.push(`${n}: 공사를 선택하세요.`);
    if(!e.start||!e.end)errors.push(`${n}: 시작·종료 시각을 입력하세요.`);
    if(!(e.desc||'').trim()||(e.desc||'').trim().length<2)errors.push(`${n}: 작업내용을 입력하세요.`);
    if(entryMin(e)>16*60)warns.push(`${n}: 한 작업이 16시간을 넘습니다. 시각을 확인하세요.`);
    if(crosses(e))warns.push(`${n}: 자정을 넘기는 작업(익일 ${e.end} 종료)으로 계산됩니다.`);
  });
  const sp=es.map((e,i)=>({i,s:span(e)})).filter(x=>x.s).sort((a,b)=>a.s[0]-b.s[0]);
  for(let k=1;k<sp.length;k++){if(sp[k].s[0]<sp[k-1].s[1])errors.push(`작업 ${sp[k-1].i+1}과 작업 ${sp[k].i+1}의 시간이 겹칩니다.`);}
  if(!r.checkIn)(isAdmin?warns:errors).push('출근 기록이 없습니다.');
  if(!r.checkOut)(isAdmin?warns:errors).push(isAdmin?'퇴근 기록이 없습니다.':'퇴근 기록 후 승인 요청할 수 있습니다.');
  const ci=absMin(r,r.checkIn),co=absMin(r,r.checkOut);
  if(ci!=null&&co!=null&&sp.length){
    const first=sp[0].s[0],last=Math.max(...sp.map(x=>x.s[1]));
    if(first<ci-30||last>co+30)warns.push('출퇴근 기록 시간을 30분 이상 벗어난 작업이 있습니다.');
    if(totalMin(r)>co-ci)warns.push('등록한 근무시간이 출퇴근 체류시간보다 깁니다.');
  }
  if(r.checkIn&&r.checkIn.lat!=null&&!r.checkIn.inside)warns.push(r.checkIn.via==='qr'?'QR은 촬영했으나 GPS 위치가 QR 장소와 다릅니다 (QR 사진 악용 여부 확인).':'출근 위치가 등록된 현장 반경 밖입니다.');
  if(r.checkIn&&r.checkIn.via==='qr'&&r.checkIn.lat==null)warns.push('QR 출근 시 GPS 위치를 확인하지 못했습니다.');
  if(!isAdmin&&r.manual&&!(r.manualReason||'').trim())errors.push('사후 신청 사유를 입력하세요.');
  return{errors,warns};
}

function confirmBox(msg,okLabel){return new Promise(res=>{modalResolve=res;openModal(`<div class="mbox" style="max-width:460px"><div style="white-space:pre-line">${msg}</div><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" onclick="mRes(false)">취소</button><button class="btn pri" onclick="mRes(true)">${okLabel||'확인'}</button></div></div>`);});}
function mRes(v){const f=modalResolve;modalResolve=null;closeModal();f&&f(v);}
function alertBox(title,lines){openModal(`<div class="mbox" style="max-width:480px"><h3>${title}</h3>${lines&&lines.length?'<ul>'+lines.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>':''}<div class="row" style="justify-content:flex-end"><button class="btn pri" onclick="closeModal()">확인</button></div></div>`);}
let tt=null;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);}
function tabs(list,cur,fn){return `<div class="tabs">${list.map(([k,l,c])=>`<button class="tab ${k===cur?'on':''}" onclick="${fn}('${k}')">${l}${c?`<span class="cnt">${c}</span>`:''}</button>`).join('')}</div>`;}

/* ---------- GPS (실제 → 실패 시 데모 위치 선택) ---------- */
function getPos(spot){return new Promise(res=>{
  let done=false;const fb=()=>{if(done)return;done=true;simPos(spot).then(res);};
  if(!navigator.geolocation){fb();return;}
  const tmr=setTimeout(fb,7000);
  try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(tmr);res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),method:'gps'});},()=>{clearTimeout(tmr);fb();},{enableHighAccuracy:true,timeout:6000,maximumAge:0});}catch(e){clearTimeout(tmr);fb();}
});}
let simResolve=null;
let simTargets=[];
function simPos(spot){return new Promise(res=>{simResolve=res;
  simTargets=spot?[spot]:S.projects.filter(p=>p.active);
  openModal(`<div class="mbox" style="max-width:480px"><h3>📍 위치 선택 (데모 전용)</h3>
  <div class="infobox">이 미리보기 화면은 보안상 휴대폰 GPS를 쓸 수 없어 위치를 직접 고릅니다.<br>실제 운영 시스템에서는 버튼을 누르는 순간 휴대폰 GPS 좌표가 자동 기록됩니다.</div>
  ${simTargets.map((p,i)=>`<button class="btn" style="width:100%;margin-bottom:6px;text-align:left" onclick="simPick(${i})">${spot?'QR 장소에 실제로 있음':'현장 안'} — ${esc(p.name)}</button>`).join('')}
  <button class="btn bad" style="width:100%;margin-bottom:6px;text-align:left" onclick="simPick(-1)">${spot?'다른 곳에 있음 — QR 사진을 찍어 가서 쓴 경우':'현장 밖 — 등록된 현장에서 떨어진 곳'}</button>
  ${spot?'<button class="btn" style="width:100%;margin-bottom:6px;text-align:left" onclick="simPick(-2)">GPS 꺼짐·권한 거부</button>':''}
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="simPick(null)">취소</button></div></div>`);
});}
function simPick(i){const f=simResolve;simResolve=null;closeModal();if(i===null){f(null);return;}
  if(i===-2){f({lat:null,lng:null,acc:null,method:'nogps'});return;}
  const act=simTargets;let lat,lng;
  if(i<0){const p=act[0]||{lat:36.95,lng:126.7};lat=p.lat+0.035;lng=p.lng+0.02;}else{lat=act[i].lat+(Math.random()-0.5)*0.002;lng=act[i].lng+(Math.random()-0.5)*0.002;}
  f({lat,lng,acc:15,method:'sim'});}

/* ---------- 파일 저장 ---------- */
async function saveFile(filename,data){
  let dl=null;
  try{if(typeof claude!=='undefined'&&claude.use)dl=await claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename,data});toast('파일을 저장했습니다: '+filename);return;}catch(e){if(e&&e.code==='declined'){toast('저장을 취소했습니다');return;}}}
  if(typeof claude==='undefined'){try{const u=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.csv')?'text/csv':'text/html'}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('파일을 저장했습니다');return;}catch(e){}}
  openModal(`<div class="mbox"><h3>파일 저장을 사용할 수 없는 화면입니다</h3><p class="mute">아래 내용을 복사해 메모장에 붙여넣고 ${esc(filename)} 으로 저장하세요.</p><textarea id="cpy" rows="12">${esc(data)}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('cpy').value).then(()=>toast('복사했습니다'),()=>toast('복사 실패 — 직접 선택해 복사하세요'))">복사</button><button class="btn pri" onclick="closeModal()">닫기</button></div></div>`);
}

function render(){
  const app=document.getElementById('app');
  let h=LIVE?'':`<div class="demo-banner"><b>시제품(데모)</b> · 데이터는 이 브라우저에만 임시 저장됩니다 · <button class="linkbtn" onclick="resetDemo()">데모 데이터 초기화</button></div>`;
  if(qr&&qr.bad){app.innerHTML=h+`<div class="wrap narrow"><div class="card" style="margin-top:20px"><h2>사용할 수 없는 QR 코드입니다</h2><div class="badbox">재발급되었거나 사용 중지된 QR 코드입니다. 휴게쉼터에 새로 붙은 QR을 촬영하거나 관리자에게 문의하세요.</div><button class="btn" onclick="qr=null;history.replaceState(null,'',location.pathname+location.search);render()">처음 화면으로</button></div></div>`;return;}
  if(!ses.uid&&ses.signup){app.innerHTML=h+vSignup();return;}
  if(!ses.uid&&ses.setup){app.innerHTML=h+vSetup(ses.setupW||W(ses.setup));return;}
  if(!ses.uid){app.innerHTML=h+vLogin();return;}
  const me=W(ses.uid);
  if(!me.privacy){app.innerHTML=h+vPrivacy(me);return;}
  if(!me.consent){app.innerHTML=h+vConsent(me);return;}
  if(qr&&qr.spot){app.innerHTML=h+vQR(me);return;}
  app.innerHTML=h+((me.role==='admin'&&!ui.asWorker)?vAdmin(me):vWorker(me));
}

function quickLogin(id){const w=W(id);document.getElementById('lg_phone').value=w.phone.replace(/\D/g,'');document.getElementById('lg_pw').value=w.pw||'';doLogin();}
function doLogin(){
  const ph=(document.getElementById('lg_phone').value||'').replace(/\D/g,''),pw=document.getElementById('lg_pw').value||'';
  const w=S.workers.find(x=>x.phone.replace(/\D/g,'')===ph);
  if(!w){toast('등록되지 않은 연락처입니다. 처음이면 아래 [가입 신청]을 눌러 주세요.');return;}
  if(w.status==='가입대기'){alertBox('가입 승인 대기 중입니다',['관리자가 승인하면 로그인할 수 있습니다.']);return;}
  if(w.status==='가입반려'){alertBox('가입 신청이 반려되었습니다',[(w.rejectReason?'사유: '+w.rejectReason:'관리자에게 문의하세요.'),'정보를 고쳐 다시 신청하려면 [가입 신청]을 눌러 주세요.']);return;}
  if(w.status==='퇴사'){alertBox('퇴사 처리된 계정입니다',['로그인할 수 없습니다. 과거 기록은 회사에 보존되어 있으며, 확인이 필요하면 관리자에게 문의하세요.']);return;}
  if(!w.pw){const kp=document.getElementById('lg_keep');ses.keep=!!(kp&&kp.checked);ses.setup=w.id;render();return;}
  if(w.pw!==pw){toast('비밀번호가 일치하지 않습니다.');return;}
  const kp=document.getElementById('lg_keep');keepSet(kp&&kp.checked?w.id:'');
  ses.uid=w.id;ui.wTab='today';ui.aTab='dash';ui.asWorker=false;render();
}

function vQR(me){
  const s=qr.spot,td=today(),r=recOf(me.id,td),y=daysAgo(1),yr=recOf(me.id,y);
  const yOpen=(!r||!r.checkIn)&&yr&&yr.checkIn&&!yr.checkOut&&editable(yr);

  <div class="mute">${esc(me.name)} 님 · ${esc(affLabel(me))}</div><div style="font-size:34px;font-weight:700;margin:10px 0" id="clock">${hm(new Date())}</div><div class="mute">${fmtDay(td)}</div>`;

  else if(!r||!r.checkIn)h+=`<button class="btn pri big" style="margin-top:14px" onclick="doCheck('in')">출근하기</button>`;

}

async function doCheck(kind,dateArg){

  const pos=await getPos(spot);closeModal();if(!pos)return;
  const now=new Date();let c;

      alertBox(`${lb}할 수 없습니다`,hasG?[`지금 위치가 QR 장소(${spot.name})에서 ${fmtDist(d)} 떨어져 있습니다.`,`QR 장소 반경 ${spot.radius}m 안에서만 ${lb}할 수 있습니다.`,'쉼터에 와서 다시 시도하세요. 이 시도는 관리자에게 기록됩니다.']:['휴대폰 위치(GPS)를 확인하지 못했습니다.','휴대폰 설정에서 위치를 켜고, 브라우저의 위치 권한을 "허용"으로 바꾼 뒤 QR을 다시 촬영하세요.']);

const entStr=e=>`${pname(e.projectId)} ${e.start}~${e.end} ${e.desc}`;
function diffText(o,n){const d=[];
  if(o.date!==n.date)d.push(`근무일 ${o.date} → ${n.date}`);
  const ti=c=>c?c.time:'없음';
  if(ti(o.checkIn)!==ti(n.checkIn))d.push(`출근 ${ti(o.checkIn)} → ${ti(n.checkIn)}`);
  if(ti(o.checkOut)!==ti(n.checkOut))d.push(`퇴근 ${ti(o.checkOut)} → ${ti(n.checkOut)}`);
  const a=o.entries.map(entStr).join('\n'),b=n.entries.map(entStr).join('\n');
  if(a!==b)d.push(`작업내역 변경 (${o.entries.length}건 → ${n.entries.length}건, ${fmtH(totalMin(o))} → ${fmtH(totalMin(n))})\n[변경 전]\n${a||'-'}\n[변경 후]\n${b||'-'}`);
  return d.join('\n');}
function commitDraft(newStatus){
  const r=draft;
  if(!r.workerId){toast('근로자를 선택하세요.');return;}
  if(S.records.find(x=>x.workerId===r.workerId&&x.date===r.date&&x.id!==draftOrig)){toast('해당 근로자의 같은 날짜 기록이 이미 있습니다. 기존 기록을 수정하세요.');return;}
  const v=validate(r,true);
  if(newStatus!=='rejected'&&v.errors.length){toast('빨간색 항목을 먼저 수정하세요.');return;}
  if(newStatus==='rejected'&&!(r.rejectReason||'').trim()){toast('반려 사유를 입력하세요.');return;}
  const by=ses.uid,now=stamp(),wn=W(r.workerId).name;
  if(!draftOrig){r.id=uid();r.history=[{at:now,by,action:'관리자 직접 등록',detail:''}];r.submittedAt=now;S.records.push(r);logG(by,'등록',`${wn} ${r.date} 기록 직접 등록 (${fmtH(totalMin(r))})`);}
  else{const idx=S.records.findIndex(x=>x.id===draftOrig);const o=S.records[idx];const d=diffText(o,r);
    if(d){r.history.push({at:now,by,action:'관리자 수정',detail:d});logG(by,'수정',`${wn} ${o.date} — ${d.split('\n')[0]}`);}
    S.records[idx]=r;}
  if(newStatus){r.status=newStatus;r.decidedBy=by;r.decidedAt=now;if(newStatus==='approved')r.rejectReason='';
    r.history.push({at:now,by,action:STATUS[newStatus],detail:newStatus==='rejected'?r.rejectReason:''});logG(by,STATUS[newStatus],`${wn} ${r.date}${newStatus==='rejected'?' — '+r.rejectReason:''}`);}
  ui.sel.delete(r.id);save();closeModal();render();toast(newStatus?`${STATUS[newStatus]} 처리했습니다.`:'변경 내용을 저장했습니다.');
}

function monthData(){
  const[y,m]=ui.month.split('-').map(Number);const nd=new Date(y,m,0).getDate();
  const ms=ui.month+'-01',me=ui.month+'-'+pad(nd);
  const recs=S.records.filter(r=>r.date.startsWith(ui.month)&&(r.status==='approved'||(ui.inclPend&&r.status==='pending'))&&(!ui.mAff||W(r.workerId).aff===ui.mAff));
  const ws=S.workers.filter(w=>(!ui.mAff||w.aff===ui.mAff)&&(recs.some(r=>r.workerId===w.id)||(w.role!=='admin'&&w.join<=me&&(!w.leave||w.leave>=ms))))
    .sort((a,b)=>a.aff.localeCompare(b.aff)||a.name.localeCompare(b.name));
  const days=[];for(let d=1;d<=nd;d++)days.push(ui.month+'-'+pad(d));
  const rows=ws.map(w=>{let tot=0,cnt=0,ot=0,lvd=0;const cells=days.map(ds=>{const r=recs.find(x=>x.workerId===w.id&&x.date===ds);const l=leaveOn(w.id,ds);const wd=dow(ds)!==0&&dow(ds)!==6;if(l&&wd)lvd+=l.kind==='반차'?0.5:1;if(!r)return l&&wd?{leave:l.kind}:null;const mn=totalMin(r);tot+=mn;if(mn>0)cnt++;ot+=Math.max(0,mn-480);return{mn,pend:r.status==='pending',half:l&&l.kind==='반차'};});return{w,cells,tot,cnt,ot,lvd};});
  const proj={};recs.forEach(r=>r.entries.forEach(e=>{const k=e.projectId||'_';proj[k]=proj[k]||{mn:0,ws:new Set(),days:new Set(),reg:0,day:0};proj[k].mn+=entryMin(e);proj[k].ws.add(r.workerId);proj[k].days.add(r.date);if(W(r.workerId).type==='일용직')proj[k].day+=entryMin(e);else proj[k].reg+=entryMin(e);}));
  return{y,m,nd,days,rows,recs,proj};
}

function aSignReject(id){const w=W(id);openModal(`<div class="mbox" style="max-width:460px"><h3>${esc(w.name)} 가입 반려</h3><label class="f"><span>반려 사유 (신청자가 로그인할 때 표시)</span><textarea id="sr_r" rows="3"></textarea></label><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">취소</button><button class="btn bad" onclick="aSignRejectDo('${id}')">반려</button></div></div>`);}

  if(!ws.length)h+=`<tr><td colspan="12" class="mute">해당하는 근로자가 없습니다.</td></tr>`;
  ws.forEach(w=>{h+=`<tr><td>${esc(affLabel(w))}</td><td>${w.type}</td><td>${w.join}</td><td><b>${esc(w.name)}</b></td><td>${rrnShow(w.rrn)}</td><td>${esc(w.phone)}</td><td style="text-align:right">${rateShow(w.rate)}</td><td>${w.leave||'-'}</td><td><span class="chip ${w.status==='재직'?'st-ok':'st-bad'}">${w.status}</span>${w.status==='재직'&&!w.pw?'<span class="chip c-out">첫 로그인 전</span>':''}</td><td style="white-space:nowrap">${w.privacy?`<span class="chip st-ok" title="개인정보 동의 ${esc(w.privacy)}">개인 ✓</span>`:'<span class="chip c-out" title="개인정보 미동의">개인 ✗</span>'}${w.consent?`<span class="chip st-ok" title="위치정보 동의 ${esc(w.consent)}">위치 ✓</span>`:'<span class="chip c-out" title="위치정보 미동의">위치 ✗</span>'}</td><td style="white-space:nowrap">${w.role==='admin'?'관리자':'근로자'}</td><td style="white-space:nowrap"><button class="btn sm" onclick="aWorkerForm('${w.id}')">수정</button> ${w.status==='재직'?(w.id!==ses.uid?`<button class="btn sm bad" onclick="aLeave('${w.id}')">퇴사</button>`:''):(w.status==='퇴사'?`<button class="btn sm" onclick="aRejoin('${w.id}')">재입사</button>`:w.status==='가입반려'?`<button class="btn sm ok" onclick="aSignForm('${w.id}')">승인</button>`:'')} ${w.id!==ses.uid?`<button class="btn sm" onclick="aPin('${w.id}')">비번 초기화</button>`:''}</td></tr>`;});
  return h+`</table></div><p class="mute">퇴사자는 삭제하지 않고 로그인만 막습니다. 근로계약 관련 서류는 근로기준법상 보존 의무(3년)가 있어 출근 기록을 그대로 보존합니다.</p></div>`;

function aWorkerSave(id){
  const g=k=>document.getElementById(k).value.trim();
  const name=g('fw_name'),phoneRaw=g('fw_phone'),aff=g('fw_aff'),partner=g('fw_partner'),type=g('fw_type'),join=g('fw_join'),role=g('fw_role'),rrnIn=g('fw_rrn').replace(/\s/g,''),rateIn=g('fw_rate').replace(/[,\s원]/g,'');
  const digits=phoneRaw.replace(/\D/g,'');
  if(!name){toast('이름을 입력하세요.');return;}
  if(!/^01\d{8,9}$/.test(digits)){toast('휴대폰 번호를 정확히 입력하세요.');return;}
  if(S.workers.some(x=>x.id!==id&&x.phone.replace(/\D/g,'')===digits)){toast('이미 등록된 휴대폰 번호입니다.');return;}
  if(aff==='협력업체'&&!partner){toast('협력업체명을 입력하세요.');return;}
  if(!join){toast('입사일을 입력하세요.');return;}
  const rm=/^(\d{6})-?([1-8])(\d{6})?$/.exec(rrnIn);if(!rm){toast('주민등록번호를 "앞 6자리-뒷자리 첫 1자리" 또는 전체 13자리로 입력하세요.');return;}
  if(rateIn&&!/^\d+$/.test(rateIn)){toast('1공수 단가는 숫자로 입력하세요.');return;}
  const rrn=rm[1]+'-'+rm[2]+(rm[3]||''),rate=rateIn===''?'':Number(rateIn);
  const phone=digits.length===11?`${digits.slice(0,3)}-${digits.slice(3,7)}-${digits.slice(7)}`:`${digits.slice(0,3)}-${digits.slice(3,6)}-${digits.slice(6)}`;
  if(id){const w=W(id);const ch=[];[['name','이름',name],['phone','휴대폰',phone],['aff','소속',aff],['partner','협력업체',aff==='협력업체'?partner:''],['type','근로형태',type],['join','입사일',join],['rrn','주민등록번호',rrn],['rate','1공수 단가',rate],['role','권한',role]].forEach(([k,l,v])=>{if(String(w[k]??'')!==String(v)){ch.push(k==='rrn'?'주민등록번호 변경':(k==='rate'?`${l}: ${rateShow(w[k])} → ${rateShow(v)}`:`${l}: ${w[k]||'-'} → ${v||'-'}`));w[k]=v;}});
    if(ch.length)logG(ses.uid,'근로자 수정',`${w.name} — ${ch.join(', ')}`);toast('저장했습니다.');}
  else{
    const w={id:uid(),name,phone,pw:'',aff,partner:aff==='협력업체'?partner:'',type,join,leave:'',status:'재직',role,consent:null,rrn,rate};
    S.workers.push(w);logG(ses.uid,"입사 등록",`${name} (${affLabel(w)}, ${type}, 입사 ${join})`);toast('등록했습니다. 근로자가 연락처로 처음 로그인할 때 비밀번호를 직접 정합니다.');}
  save();closeModal();render();
}

  openModal(`<div class="mbox" style="max-width:460px"><h3>${esc(w.name)} 퇴사 처리</h3><label class="f"><span>퇴사일</span><input type="date" id="lv_date" value="${today()}"></label>
  <div class="infobox">퇴사 처리하면 로그인만 차단되고 출근 기록은 그대로 보존됩니다. 재입사 시 다시 활성화할 수 있습니다.</div>${pend?`<div class="warnbox">처리되지 않은 기록(작성중·승인대기)이 ${pend}건 있습니다. 승인 관리에서 먼저 정리하세요.</div>`:''}

function qrSvg(text,cell){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag(cell||6,2);}catch(e){return '<div class="badbox">QR 생성 실패</div>';}}

/* ---------- 연차 관리 ---------- */
const LV_KINDS=['연차','반차','병가','기타'];
const LV_ADMIN_KINDS=['연차','반차','병가','기타','기존사용(이관)','발생조정'];
const LSTATUS={pending:'승인대기',approved:'승인',rejected:'반려',cancelled:'취소'};
const LSTCLS={pending:'st-pend',approved:'st-ok',rejected:'st-bad',cancelled:'st-draft'};
const lvChip=s=>`<span class="chip ${LSTCLS[s]}">${LSTATUS[s]}</span>`;
function ymdAdd(ds,y,m,d){const[a,b,c]=ds.split('-').map(Number);const t=new Date(Date.UTC(a+(y||0),b-1+(m||0),c+(d||0)));return t.toISOString().slice(0,10);}
function weekdays(s,e){if(!s||!e||e<s)return 0;let n=0,d=s;while(d<=e){const w=new Date(d+'T12:00:00Z').getUTCDay();if(w!==0&&w!==6)n++;d=ymdAdd(d,0,0,1);}return n;}
/** 입사일 기준 현재 연차 기간·발생일수 (근로기준법 제60조: 1년 미만 매월 1일(최대 11일), 1년 이상 15일, 3년 이상 2년마다 1일 가산, 최대 25일) */
function leavePeriod(w,asOf){
  if(!w||!w.join)return null;
  let n=0;while(ymdAdd(w.join,n+1)<=asOf)n++;
  const start=ymdAdd(w.join,n),end=ymdAdd(w.join,n+1);
  let accr;
  if(n===0){let m=0;while(m<11&&ymdAdd(w.join,0,m+1)<=asOf)m++;accr=m;}
  else accr=Math.min(25,15+Math.floor((n-1)/2));
  return{n,start,end,base:accr};
}
function leaveSum(w,asOf,list){
  const p=leavePeriod(w,asOf);if(!p)return null;
  const mine=(list||[]).filter(l=>l.workerId===w.id&&l.start>=p.start&&l.start<p.end);
  const sum=f=>mine.filter(f).reduce((a,l)=>a+Number(l.days||0),0);
  const adj=sum(l=>l.status==='approved'&&l.kind==='발생조정');
  const used=sum(l=>l.status==='approved'&&l.kind!=='발생조정');
  const pend=sum(l=>l.status==='pending');
  return Object.assign(p,{adj,accr:p.base+adj,used,pend,remain:p.base+adj-used,list:mine});
}
const asOfW=w=>(w.status==='퇴사'&&w.leave&&w.leave<today())?w.leave:today();
const fmtD=v=>{v=Math.round(Number(v||0)*10)/10;return (v%1===0?String(v):v.toFixed(1));};
function lvLabel(l){return l.kind==='반차'?l.start+' (반차)':(l.start===l.end?l.start:l.start+' ~ '+l.end);}
/* 날짜에 걸린 승인 휴가 (월간 출근부 표시용) */
function leaveOn(wid,ds){return (S.leaves||[]).find(l=>l.workerId===wid&&l.status==='approved'&&l.kind!=='발생조정'&&l.kind!=='기존사용(이관)'&&l.start<=ds&&(l.end||l.start)>=ds);}
const lvShort=k=>({연차:'연',반차:'반',병가:'병',기타:'기'}[k]||'휴');

/* 검증 (시제품·운영판 공통 규칙) */
function lvCheck(p,admin){
  const kinds=admin?LV_ADMIN_KINDS:LV_KINDS;
  if(kinds.indexOf(p.kind)<0)return '사용 구분을 선택하세요.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(p.start||''))return '사용 시작일을 입력하세요.';
  if(p.kind==='반차'){p.end=p.start;p.days=0.5;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(p.end||''))p.end=p.start;
  if(p.end<p.start)return '종료일이 시작일보다 빠릅니다.';
  const d=Number(p.days);
  if(!isFinite(d)||Math.round(d*2)!==d*2)return '사용일수는 0.5일 단위 숫자로 입력하세요.';
  if(p.kind==='발생조정'){if(d===0)return '조정일수를 입력하세요 (가산은 +, 차감은 −).';}
  else{if(d<=0)return '사용일수를 확인하세요.';
    const cal=Math.round((new Date(p.end+'T12:00:00Z')-new Date(p.start+'T12:00:00Z'))/864e5)+1;
    if(p.kind!=='기존사용(이관)'&&d>cal)return '사용일수가 기간(달력 '+cal+'일)보다 많습니다.';}
  return null;
}
function lvOverlap(list,wid,s,e,exceptId){return (list||[]).find(l=>l.workerId===wid&&l.id!==exceptId&&(l.status==='pending'||l.status==='approved')&&LV_KINDS.indexOf(l.kind)>=0&&l.start<=e&&(l.end||l.start)>=s);}

/* 시제품용 처리 — 운영판에서는 lvDo가 서버 호출로 바뀝니다 */
const LV={
  apply(p){const me=W(ses.uid);const er=lvCheck(p,false);if(er)return er;
    if(p.start<ymdAdd(today(),0,0,-30))return '30일 이전 날짜는 관리자에게 등록을 요청하세요.';
    const o=lvOverlap(S.leaves,me.id,p.start,p.end);if(o)return '이미 신청된 휴가와 날짜가 겹칩니다 ('+lvLabel(o)+').';
    S.leaves.push({id:uid(),workerId:me.id,kind:p.kind,start:p.start,end:p.end,days:Number(p.days),reason:String(p.reason||''),status:'pending',createdAt:stamp(),decidedBy:'',decidedAt:'',rejectReason:'',history:[{at:stamp(),by:me.id,action:'신청',detail:''}]});
    logG(me.id,'연차 신청',`${me.name} ${p.kind} ${lvLabel(p)} (${fmtD(p.days)}일)`);return null;},
  cancel(p){const l=S.leaves.find(x=>x.id===p.id&&x.workerId===ses.uid);if(!l||l.status!=='pending')return '승인 대기 중인 신청만 취소할 수 있습니다.';
    l.status='cancelled';l.history.push({at:stamp(),by:ses.uid,action:'취소',detail:''});logG(ses.uid,'연차 취소',`${W(ses.uid).name} ${l.kind} ${lvLabel(l)}`);return null;},
  decide(p){const l=S.leaves.find(x=>x.id===p.id);if(!l||l.status!=='pending')return '승인 대기 중인 신청이 아닙니다.';
    if(p.status==='rejected'&&!(p.reason||'').trim())return '반려 사유를 입력하세요.';
    l.status=p.status;l.decidedBy=ses.uid;l.decidedAt=stamp();l.rejectReason=p.status==='rejected'?p.reason:'';
    l.history.push({at:stamp(),by:ses.uid,action:LSTATUS[p.status],detail:l.rejectReason});
    logG(ses.uid,'연차 '+LSTATUS[p.status],`${W(l.workerId).name} ${l.kind} ${lvLabel(l)}${l.rejectReason?' — '+l.rejectReason:''}`);return null;},
  save(p){const d=p.data;if(!W(d.workerId).id)return '근로자를 선택하세요.';const er=lvCheck(d,true);if(er)return er;
    if(LV_KINDS.indexOf(d.kind)>=0){const o=lvOverlap(S.leaves,d.workerId,d.start,d.end,p.id);if(o)return '같은 날짜에 이미 휴가가 있습니다 ('+lvLabel(o)+').';}
    if(p.id){const l=S.leaves.find(x=>x.id===p.id);if(!l)return '기록을 찾을 수 없습니다.';const before=`${l.kind} ${lvLabel(l)} ${fmtD(l.days)}일`;
      Object.assign(l,{workerId:d.workerId,kind:d.kind,start:d.start,end:d.end,days:Number(d.days),reason:d.reason||''});
      l.history.push({at:stamp(),by:ses.uid,action:'관리자 수정',detail:before+' → '+`${l.kind} ${lvLabel(l)} ${fmtD(l.days)}일`});logG(ses.uid,'연차 수정',`${W(l.workerId).name} ${before} → ${l.kind} ${lvLabel(l)} ${fmtD(l.days)}일`);}
    else{S.leaves.push({id:uid(),workerId:d.workerId,kind:d.kind,start:d.start,end:d.end,days:Number(d.days),reason:d.reason||'',status:'approved',createdAt:stamp(),decidedBy:ses.uid,decidedAt:stamp(),rejectReason:'',history:[{at:stamp(),by:ses.uid,action:'관리자 등록',detail:''}]});
      logG(ses.uid,'연차 등록',`${W(d.workerId).name} ${d.kind} ${lvLabel(d)} ${fmtD(d.days)}일`);}
    return null;},
  del(p){const l=S.leaves.find(x=>x.id===p.id);if(!l)return '기록을 찾을 수 없습니다.';S.leaves=S.leaves.filter(x=>x.id!==p.id);logG(ses.uid,'연차 삭제',`${W(l.workerId).name} ${l.kind} ${lvLabel(l)} ${fmtD(l.days)}일 (${LSTATUS[l.status]})`);return null;},
  import(p){let n=0;(p.rows||[]).forEach(r=>{if(S.leaves.some(l=>l.workerId===r.workerId&&l.start===r.start&&l.kind===r.kind&&l.status!=='cancelled'))return;
      S.leaves.push({id:uid(),workerId:r.workerId,kind:r.kind,start:r.start,end:r.end,days:Number(r.days),reason:r.reason||'',status:'approved',createdAt:stamp(),decidedBy:ses.uid,decidedAt:stamp(),rejectReason:'',history:[{at:stamp(),by:ses.uid,action:'구글폼 이관',detail:''}]});n++;});
    logG(ses.uid,'연차 이관',`구글 폼 기록 ${n}건 가져오기`);return{n};}
};
async function lvDo(op,p,okMsg){const r=LV[op](p);if(typeof r==='string'){alertBox('처리하지 못했습니다',[r]);return null;}save();closeModal();render();if(okMsg)toast(okMsg);return r||{};}

/* ----- 근로자: 연차 탭 ----- */
function vMyLeave(me){
  const L=leaveSum(me,today(),S.leaves);
  let h='';
  if(!L)return '<div class="card"><p class="mute">입사일이 등록되지 않아 연차를 계산할 수 없습니다. 관리자에게 문의하세요.</p></div>';
  h+=`<div class="kpi"><div class="k"><span>잔여 연차</span><b style="color:var(--pri)">${fmtD(L.remain)}일</b></div><div class="k"><span>발생</span><b>${fmtD(L.accr)}일</b></div><div class="k"><span>사용</span><b>${fmtD(L.used)}일</b></div><div class="k"><span>승인 대기</span><b>${fmtD(L.pend)}일</b></div></div>
  <p class="mute" style="margin-top:-6px">연차 기간 ${L.start} ~ ${ymdAdd(L.end,0,0,-1)} · ${L.n===0?'입사 1년 미만 (1개월 개근마다 1일 발생, 최대 11일)':'근속 '+L.n+'년차'}${L.adj?` · 조정 ${L.adj>0?'+':''}${fmtD(L.adj)}일 포함`:''}</p>`;
  const t=today();
  h+=`<div class="card"><h3>연차 사용 신청</h3>
  <div class="grid2"><label class="f"><span>사용 구분</span><select id="lv_kind" onchange="lvCalc()">${LV_KINDS.map(k=>`<option>${k}</option>`).join('')}</select></label>
  <label class="f"><span>사용일수 (자동 계산, 수정 가능)</span><input id="lv_days" inputmode="decimal" value="${weekdays(t,t)}"></label>
  <label class="f"><span>사용 시작일</span><input id="lv_s" type="date" value="${t}" onchange="lvCalc()"></label>
  <label class="f" id="lv_ew"><span>사용 종료일</span><input id="lv_e" type="date" value="${t}" onchange="lvCalc()"></label></div>
  <label class="f"><span>휴가 사유 (선택)</span><input id="lv_reason" maxlength="200"></label>
  <p class="mute" style="margin-top:0">사용일수는 토·일을 빼고 계산합니다. 공휴일이 끼어 있으면 직접 고쳐 주세요. 반차는 0.5일이며, 병가·기타도 연차에서 차감됩니다.</p>
  <div class="row"><span class="sp"></span><button class="btn pri" onclick="lvApply()">신청하기</button></div></div>`;
  const mine=(S.leaves||[]).filter(l=>l.workerId===me.id).sort((a,b)=>b.start.localeCompare(a.start));
  h+=`<div class="card"><h3>내 연차 신청 내역</h3><div class="tbl-wrap"><table class="nw"><tr><th>사용일</th><th>구분</th><th>일수</th><th>상태</th><th></th></tr>`;
  if(!mine.length)h+=`<tr><td colspan="5" class="mute">신청 내역이 없습니다.</td></tr>`;
  mine.forEach(l=>{h+=`<tr><td>${esc(lvLabel(l))}</td><td>${esc(l.kind)}</td><td>${fmtD(l.days)}일</td><td>${lvChip(l.status)}${l.status==='rejected'&&l.rejectReason?`<div class="mute" style="white-space:normal">사유: ${esc(l.rejectReason)}</div>`:''}</td><td>${l.status==='pending'?`<button class="btn sm" onclick="lvCancel('${l.id}')">취소</button>`:''}</td></tr>`;});
  return h+'</table></div></div>';
}
function lvCalc(){const k=document.getElementById('lv_kind').value,s=document.getElementById('lv_s'),e=document.getElementById('lv_e'),d=document.getElementById('lv_days'),ew=document.getElementById('lv_ew');
  if(k==='반차'){e.value=s.value;ew.style.display='none';d.value='0.5';d.disabled=true;}
  else{ew.style.display='';d.disabled=false;if(e.value<s.value)e.value=s.value;d.value=String(weekdays(s.value,e.value));}}
async function lvApply(){
  const g=k=>document.getElementById(k).value.trim();
  const p={kind:g('lv_kind'),start:g('lv_s'),end:g('lv_e'),days:g('lv_days'),reason:g('lv_reason')};
  const er=lvCheck(p,false);if(er){toast(er);return;}
  const me=W(ses.uid),L=leaveSum(me,today(),S.leaves);
  if(L&&Number(p.days)>L.remain-L.pend&&!(await confirmBox(`신청 일수(${fmtD(p.days)}일)가 남은 연차(${fmtD(L.remain-L.pend)}일, 승인 대기 제외)보다 많습니다.\n그래도 신청할까요?`,'신청')))return;
  lvDo('apply',p,'연차를 신청했습니다. 관리자 승인 후 확정됩니다.');
}
async function lvCancel(id){if(!(await confirmBox('이 연차 신청을 취소할까요?','신청 취소')))return;lvDo('cancel',{id},'취소했습니다.');}

/* ----- 관리자: 연차 관리 탭 ----- */
function aLeaveTab(){
  ui.lf=ui.lf||{status:'재직',aff:'',q:''};const f=ui.lf,q=(f.q||'').trim();
  const pend=(S.leaves||[]).filter(l=>l.status==='pending').sort((a,b)=>a.start.localeCompare(b.start));
  let h=`<div class="card"><div class="row"><h3 style="margin:0">승인 대기 신청 (${pend.length}건)</h3><span class="sp"></span><button class="btn" onclick="aLvImport()">구글 폼 기록 가져오기</button><button class="btn" onclick="expLeaveCsv()">연차대장 CSV</button><button class="btn pri" onclick="aLvForm('')">+ 연차 직접 등록</button></div>`;
  if(!pend.length)h+=`<p class="mute">승인 대기 중인 연차 신청이 없습니다.</p>`;
  else{h+=`<div class="tbl-wrap" style="margin-top:8px"><table class="nw"><tr><th>신청일시</th><th>이름</th><th>소속</th><th>구분</th><th>사용일</th><th>일수</th><th>사유</th><th>잔여(신청 전)</th><th>처리</th></tr>`;
    pend.forEach(l=>{const w=W(l.workerId),L=leaveSum(w,asOfW(w),S.leaves);h+=`<tr><td>${esc(l.createdAt)}</td><td><b>${esc(w.name)}</b></td><td>${esc(affLabel(w))}</td><td>${esc(l.kind)}</td><td>${esc(lvLabel(l))}</td><td>${fmtD(l.days)}일</td><td style="white-space:normal;min-width:120px">${esc(l.reason)||'-'}</td><td>${L?fmtD(L.remain)+'일':'-'}${L&&Number(l.days)>L.remain?' <span class="chip c-out">초과</span>':''}</td><td><button class="btn sm ok" onclick="aLvDecide('${l.id}','approved')">승인</button> <button class="btn sm bad" onclick="aLvReject('${l.id}')">반려</button></td></tr>`;});
    h+='</table></div>';}
  h+='</div>';
  const ws=S.workers.filter(w=>(!f.status||w.status===f.status)&&(!f.aff||w.aff===f.aff)&&(!q||w.name.includes(q)||(w.phone||'').includes(q)));
  h+=`<div class="card"><div class="row"><h3 style="margin:0">연차대장 (입사일 기준)</h3><span class="sp"></span>
  <select style="width:auto" onchange="ui.lf.status=this.value;render()">${[['재직','재직자'],['퇴사','퇴사자'],['','전체']].map(([v,l])=>`<option value="${v}" ${f.status===v?'selected':''}>${l}</option>`).join('')}</select>
  <select style="width:auto" onchange="ui.lf.aff=this.value;render()"><option value="">전체 소속</option>${['고센이엔지','씨유이엔지','협력업체'].map(a=>`<option ${f.aff===a?'selected':''}>${a}</option>`).join('')}</select>
  <input style="width:160px" placeholder="이름·전화 검색" value="${esc(f.q)}" onchange="ui.lf.q=this.value;render()"></div>
  <div class="tbl-wrap" style="margin-top:10px"><table class="nw"><tr><th>소속</th><th>형태</th><th>이름</th><th>입사일</th><th>근속</th><th>연차 기간</th><th style="text-align:right">발생</th><th style="text-align:right">사용</th><th style="text-align:right">승인대기</th><th style="text-align:right">잔여</th><th></th></tr>`;
  if(!ws.length)h+=`<tr><td colspan="11" class="mute">해당하는 근로자가 없습니다.</td></tr>`;
  ws.forEach(w=>{const L=leaveSum(w,asOfW(w),S.leaves);if(!L){h+=`<tr><td>${esc(affLabel(w))}</td><td>${w.type}</td><td><b>${esc(w.name)}</b></td><td colspan="8" class="mute">입사일 없음</td></tr>`;return;}
    h+=`<tr><td>${esc(affLabel(w))}</td><td>${w.type}</td><td><b>${esc(w.name)}</b></td><td>${w.join}</td><td>${L.n===0?'1년 미만':L.n+'년'}</td><td>${L.start} ~ ${ymdAdd(L.end,0,0,-1)}</td><td style="text-align:right">${fmtD(L.accr)}${L.adj?`<span class="mute"> (조정 ${L.adj>0?'+':''}${fmtD(L.adj)})</span>`:''}</td><td style="text-align:right">${fmtD(L.used)}</td><td style="text-align:right">${L.pend?fmtD(L.pend):'-'}</td><td style="text-align:right"><b style="color:${L.remain<0?'var(--bad)':'var(--pri)'}">${fmtD(L.remain)}</b></td><td><button class="btn sm" onclick="aLvHist('${w.id}')">내역</button></td></tr>`;});
  h+=`</table></div><p class="mute">발생일수는 근로기준법 기준으로 자동 계산합니다 (1년 미만: 1개월 개근마다 1일·최대 11일 / 1년 이상: 15일 / 3년 이상: 2년마다 1일 가산·최대 25일). 결근 등으로 개근·출근율(80%)을 채우지 못한 경우는 "발생조정"으로 직접 맞춰 주세요. 공휴일은 자동으로 빼지 않습니다.</p></div>`;
  return h;
}
function aLvHist(wid){const w=W(wid);const ls=(S.leaves||[]).filter(l=>l.workerId===wid).sort((a,b)=>b.start.localeCompare(a.start));

function parseDateK(v){v=String(v||'').trim();let m;

    const s=parseDateK(g(ci.s)),e=parseDateK(g(ci.e))||s;let days=parseFloat(String(g(ci.days)).replace(/[^\d.]/g,''));
    if(!isFinite(days)||days<=0)days=kind==='반차'?0.5:weekdays(s,e);

    else if(S.leaves.some(l=>l.workerId===ws[0].id&&l.start===s&&l.kind===kind&&l.status!=='cancelled')){ok=false;note='이미 있음';}
    return{ok,note,name,workerId:ws.length===1?ws[0].id:'',kind,start:s,end:e<s?s:e,days:kind==='반차'?0.5:days,reason:g(ci.r),st};});
  const okN=lvImp.filter(x=>x.ok).length;
  box.innerHTML=`<div class="tbl-wrap" style="margin-top:10px;max-height:300px;overflow:auto"><table class="nw"><tr><th>가져오기</th><th>이름</th><th>구분</th><th>사용일</th><th>일수</th><th>결재상태</th><th>비고</th></tr>${lvImp.map(x=>`<tr><td>${x.ok?'<span class="chip st-ok">가져옴</span>':'<span class="chip c-out">제외</span>'}</td><td>${esc(x.name)}</td><td>${esc(x.kind)}</td><td>${esc(x.start===x.end?x.start:x.start+' ~ '+x.end)}</td><td>${fmtD(x.days)}</td><td>${esc(x.st)||'-'}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div>

<h3>운영 전 확인 필요</h3><ul class="plan"><li>위치정보 수집·이용 동의서 문안 및 보유기간 — 노무사·법률 검토</li><li>협력업체 인원의 급여·계약서를 우리 회사 시스템에서 발급할지 여부 (고용 주체 구분)</li><li>씨유이엔지 인원의 사업장 구분 (별도 사업자)</li></ul></div>`;}

<script>
/* =========================================================
   운영판(구글 Apps Script) 전용 — 서버와 연동하는 부분
   시제품의 같은 이름 함수를 서버 호출 방식으로 바꿉니다.
   ========================================================= */
if(LIVE){
let TOKEN='';
const TK='goshen_tok';
function tokGet(){try{return localStorage.getItem(TK)||sessionStorage.getItem(TK)||'';}catch(e){return TOKEN;}}
function tokSet(t,keep){TOKEN=t||'';try{localStorage.removeItem(TK);sessionStorage.removeItem(TK);if(t)(keep?localStorage:sessionStorage).setItem(TK,t);}catch(e){}}
function call(op,p){
  if(BOOT.api){ /* 외부 호스팅 화면: 구글 로그인 쿠키 없이 서버 호출 (계정 여러 개·브라우저 무관) */
    return fetch(BOOT.api,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({t:TOKEN,op:op,p:p||{}})})
      .then(r=>{if(!r.ok)throw new Error('서버 연결 오류 ('+r.status+')');return r.text();})
      .then(tx=>{let r;try{r=JSON.parse(tx);}catch(e){throw new Error('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도해 주세요.');}
        if(r&&r.error){const e=new Error(r.error);e.relogin=!!r.relogin;throw e;}return r||{};},
        e=>{throw (e&&e.message&&e.message.indexOf('서버')===0)?e:new Error('인터넷 연결을 확인해 주세요.');});
  }
  return new Promise((res,rej)=>{google.script.run.withSuccessHandler(r=>{if(r&&r.error){const e=new Error(r.error);e.relogin=!!r.relogin;rej(e);}else res(r||{});}).withFailureHandler(e=>rej(new Error((e&&e.message)||String(e)))).api(TOKEN,op,p||{});});}
let busyN=0;
function busy(on){busyN+=on?1:-1;let b=document.getElementById('busy');if(!b){b=document.createElement('div');b.id='busy';b.style.cssText='position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:80;display:none;align-items:center;justify-content:center';b.innerHTML='<div style="background:#fff;border:1px solid #e1e5eb;border-radius:12px;padding:16px 22px;text-align:center"><div class="spin"></div>처리 중…</div>';document.body.appendChild(b);}b.style.display=busyN>0?'flex':'none';}
function applyState(st){
  S.leaves=st.leaves||[];S.workers=st.workers;S.projects=st.projects;S.spots=st.spots;S.records=st.records;S.log=st.log||[];S.settings=st.settings;S.recFrom=st.recFrom;
  ses.uid=st.me.id;ses.setup=null;ses.setupW=null;
}
function failMsg(e){
  if(e&&e.relogin){tokSet('');ses.uid=null;closeModal();render();toast('다시 로그인해 주세요.');return;}
  alertBox('처리하지 못했습니다',String(e&&e.message||e).split('\n'));
}
/* 서버 요청 → 상태 반영 → 화면 갱신 */
async function run(op,p,okMsg,keepModal){
  busy(true);
  try{const r=await call(op,p);if(r.state)applyState(r.state);if(!keepModal)closeModal();render();const m=r.msg||okMsg;if(m)toast(m);return r;}
  catch(e){failMsg(e);return null;}
  finally{busy(false);}
}

/* ----- 시작 ----- */
window.liveInit=async function(){
  render();
  if(BOOT.qr){try{const r=await call('qrInfo',{qr:BOOT.qr});qr=r.bad?{bad:true}:{spot:r.spot,raw:BOOT.qr};}catch(e){}}
  TOKEN=tokGet();
  if(TOKEN){busy(true);try{const r=await call('boot',{});applyState(r.state);}catch(e){tokSet('');}finally{busy(false);}}
  render();
};
setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=hm(new Date());},15000);

/* ----- 로그인 / 최초 등록 / 동의 ----- */
doLogin=async function(){

  const kp=document.getElementById('lg_keep');const keep=!!(kp&&kp.checked);
  if(!phone.replace(/\D/g,'')){toast('연락처를 입력하세요.');return;}
  busy(true);
  try{const r=await call('login',{phone,pw,keep});
    if(r.setup){ses.keep=keep;ses.setup='x';ses.setupW={name:r.name,phone:r.phone};render();return;}
    tokSet(r.token,keep);applyState(r.state);ui.wTab='today';ui.aTab='dash';ui.asWorker=false;render();
  }catch(e){failMsg(e);}finally{busy(false);}
};
doSetup=async function(){
  if(!(document.getElementById('pv_1').checked&&document.getElementById('pv_2').checked)){toast('개인정보 필수 항목에 먼저 동의해 주세요.');return;}

  if(pw.length<4||pw.length>20){toast('비밀번호는 4~20자로 정해 주세요.');return;}
  if(pw!==pw2){toast('비밀번호 확인이 일치하지 않습니다.');return;}
  busy(true);
  try{const r=await call('setup',{phone:ses.setupW.phone,rrn:r1+'-'+r2,pw,privacy:true,keep:ses.keep});tokSet(r.token,ses.keep);applyState(r.state);ui.wTab='today';render();toast('등록이 완료되었습니다.');}
  catch(e){failMsg(e);}finally{busy(false);}
};
doPrivacy=function(){if(!(document.getElementById('pv_1').checked&&document.getElementById('pv_2').checked)){toast('필수 항목에 동의해 주세요.');return;}run('privacy');};
doConsent=function(){if(!document.getElementById('cs_ok').checked){toast('동의 체크 후 진행할 수 있습니다.');return;}run('consent');};

/* ----- 위치: 실제 GPS만 사용 ----- */
getPos=function(){return new Promise(res=>{
  if(!navigator.geolocation){res({lat:null,lng:null,acc:null});return;}
  let done=false;const t=setTimeout(()=>{if(!done){done=true;res({lat:null,lng:null,acc:null});}},12000);
  try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(t);res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)});},
    ()=>{if(done)return;done=true;clearTimeout(t);res({lat:null,lng:null,acc:null});},{enableHighAccuracy:true,timeout:10000,maximumAge:0});}
  catch(e){clearTimeout(t);res({lat:null,lng:null,acc:null});}
});};

/* ----- 출근 / 퇴근 (서버가 시각·QR·반경 판정) ----- */
doCheck=async function(kind,dateArg){
  const raw=qr&&qr.raw?qr.raw:'';
  if(!raw&&S.settings.qrOnly){alertBox('QR 코드로 출퇴근하세요',['휴게쉼터에 붙어 있는 QR 코드를 휴대폰 카메라로 촬영하면 출퇴근 화면이 열립니다.']);return;}
  openModal(`<div class="mbox" style="max-width:320px;text-align:center"><div class="spin"></div>위치 확인 중…</div>`);
  const pos=await getPos();closeModal();
  busy(true);let r;
  try{r=await call('check',{kind,date:dateArg||'',qr:raw,lat:pos.lat,lng:pos.lng,acc:pos.acc});}
  catch(e){busy(false);failMsg(e);return;}
  busy(false);
  const lb=kind==='in'?'출근':'퇴근';
  if(r.refused){render();alertBox(`${lb}할 수 없습니다`,r.hasG?[`지금 위치가 QR 장소(${r.spotName})에서 ${fmtDist(r.dist)} 떨어져 있습니다.`,`QR 장소 반경 ${r.radius}m 안에서만 ${lb}할 수 있습니다.`,'쉼터에 와서 다시 시도하세요. 이 시도는 관리자에게 기록됩니다.']:['휴대폰 위치(GPS)를 확인하지 못했습니다.','휴대폰 설정에서 위치를 켜고, 브라우저의 위치 권한을 "허용"으로 바꾼 뒤 QR을 다시 촬영하세요.']);return;}
  applyState(r.state);qr=null;ui.wTab='today';render();
  const c=r.result.c;
  if(c.via==='qr'&&c.lat==null)alertBox(`${lb} ${c.time} 기록 완료 — GPS 확인 불가`,['QR 촬영은 기록되었으나 휴대폰 위치를 확인하지 못했습니다.']);
  else if(!c.inside)alertBox(`${lb} ${c.time} 기록 완료 — 위치 확인 필요`,[`${c.via==='qr'?'QR 장소':'가장 가까운 현장'}에서 ${fmtDist(c.dist)} 떨어진 위치입니다.`,'관리자 화면에 표시됩니다.']);
  else toast(`${lb} ${c.time} 기록 완료 · ${r.result.spotName||r.result.nearName||''}`);
};

/* ----- 작업 내역 · 사후 입력 (자동 저장) ----- */
let syncT=null,syncDate=null,syncP=Promise.resolve();
function scheduleSync(){syncDate=curDate();clearTimeout(syncT);syncT=setTimeout(flushSync,700);}
function flushSync(){
  clearTimeout(syncT);syncT=null;const date=syncDate;if(!date)return syncP;
  const r=recOf(ses.uid,date);if(!r)return syncP;
  const p={date,entries:r.entries};
  if(date<today()){p.manualIn=r.checkIn&&r.checkIn.lat!=null?undefined:(r.checkIn?r.checkIn.time:'');p.manualOut=r.checkOut&&r.checkOut.lat!=null?undefined:(r.checkOut?r.checkOut.time:'');p.manualReason=r.manualReason||'';}
  syncP=syncP.then(()=>call('saveDraft',p).then(x=>{const i=S.records.findIndex(y=>y.workerId===ses.uid&&y.date===date);if(i>=0&&x.record){S.records[i].id=x.record.id;}}).catch(e=>failMsg(e)));
  return syncP;
}
ensureRec=function(wid,date,manual){let r=recOf(wid,date);if(!r){r={id:'',workerId:wid,date,checkIn:null,checkOut:null,entries:[],status:'draft',rejectReason:'',submittedAt:'',decidedBy:'',decidedAt:'',manual:!!manual,manualReason:'',history:[]};S.records.push(r);}return r;};
const _entRerender=entRerender;
entRerender=function(ns){if(ns==='a'){renderAdminModal();return;}render();scheduleSync();};
setManual=function(kind,v){
  const r=ensureRec(ses.uid,curDate(),true);if(!editable(r))return;
  if(kind==='reason'){r.manualReason=v;r.manual=true;}
  else{const key=kind==='in'?'checkIn':'checkOut';r.manual=true;r[key]=v?{date:r.date,time:v,lat:null,lng:null,method:'manual'}:null;fixOutDate(r);}
  if(kind!=='reason'&&r.checkIn&&r.checkOut&&!r.entries.length)r.entries.push({id:uid(),projectId:'',start:r.checkIn.time,end:r.checkOut.time,desc:''});
  render();scheduleSync();
};
submitRec=async function(){
  const r=myRec();if(!r)return;const v=validate(r,false);
  if(v.errors.length){alertBox('승인 요청 전에 확인해 주세요',v.errors);return;}
  if(v.warns.length&&!(await confirmBox('<b>확인이 필요한 사항</b>\n· '+v.warns.map(esc).join('\n· ')+'\n\n그래도 승인 요청할까요?','승인 요청')))return;
  syncDate=r.date;busy(true);await flushSync();busy(false);
  await run('submit',{date:r.date},'승인 요청했습니다. 관리자 확인 후 확정됩니다.');
};

/* ----- 관리자: 출근 기록 ----- */
commitDraft=async function(newStatus){
  const r=draft;
  if(!r.workerId){toast('근로자를 선택하세요.');return;}
  const v=validate(r,true);
  if(newStatus!=='rejected'&&v.errors.length){toast('빨간색 항목을 먼저 수정하세요.');return;}
  if(newStatus==='rejected'&&!(r.rejectReason||'').trim()){toast('반려 사유를 입력하세요.');return;}
  const res=await run('saveRecord',{rec:{workerId:r.workerId,date:r.date,checkIn:r.checkIn?{time:r.checkIn.time,date:r.checkIn.date}:null,checkOut:r.checkOut?{time:r.checkOut.time,date:r.checkOut.date}:null,entries:r.entries,rejectReason:r.rejectReason||''},origId:draftOrig||'',newStatus:newStatus||null},null,true);
  if(res){closeModal();ui.sel.delete(draftOrig);render();}
};
bulkApprove=async function(){
  const ids=[...ui.sel];if(!ids.length)return;
  if(!(await confirmBox(`선택한 ${ids.length}건을 승인할까요?`,'승인')))return;
  const r=await run('bulkApprove',{ids});if(!r)return;ui.sel.clear();render();
  if(r.skip&&r.skip.length)alertBox(`${r.n}건 승인 · ${r.skip.length}건 제외 (입력 오류)`,r.skip);else toast(`${r.n}건 승인 완료`);
};
aDelete=async function(){
  const o=S.records.find(x=>x.id===draftOrig);if(!o)return;
  if(!(await confirmBox(`<b>${esc(W(o.workerId).name)} · ${fmtDay(o.date)}</b> 기록을 삭제할까요?\n\n삭제하면 복구할 수 없으며, 변경 이력에 삭제 사실과 내용이 남습니다.`,'삭제'))){renderAdminModal();return;}
  await run('deleteRecord',{id:o.id},'삭제했습니다.');ui.sel.delete(o.id);
};
/* 지난 기간 기록 불러오기 (월간 출근부·승인 관리) */
const loadingFrom={};
function ensureFrom(from){
  if(!from||!S.recFrom||from>=S.recFrom||loadingFrom[from])return false;
  loadingFrom[from]=1;
  call('records',{from,to:S.recFrom}).then(r=>{const have=new Set(S.records.map(x=>x.id));r.records.forEach(x=>{if(!have.has(x.id))S.records.push(x);});S.recFrom=from;delete loadingFrom[from];render();}).catch(e=>{delete loadingFrom[from];failMsg(e);});
  return true;
}
const _aMonth=aMonth,_aAppr=aAppr;
aMonth=function(){if(ensureFrom(ui.month+'-01'))return '<div class="card"><div class="spin"></div><p class="mute" style="text-align:center">지난 기록을 불러오는 중…</p></div>';return _aMonth();};
aAppr=function(){if(ensureFrom(ui.f.from))return '<div class="card"><div class="spin"></div><p class="mute" style="text-align:center">지난 기록을 불러오는 중…</p></div>';return _aAppr();};

/* ----- 관리자: 근로자 ----- */
aWorkerSave=function(id){
  const g=k=>document.getElementById(k).value.trim();
  run('saveWorker',{id,data:{name:g('fw_name'),phone:g('fw_phone'),aff:g('fw_aff'),partner:g('fw_partner'),type:g('fw_type'),join:g('fw_join'),role:g('fw_role'),rrn:g('fw_rrn'),rate:g('fw_rate')}},null,true).then(r=>{if(r)closeModal(),render();});
};
aLeaveDo=function(id){const d=document.getElementById('lv_date').value;if(!d){toast('퇴사일을 입력하세요.');return;}run('leave',{id,date:d});};
aRejoinDo=function(id){const d=document.getElementById('rj_date').value;if(!d)return;run('rejoin',{id,date:d});};
aPin=async function(id){const w=W(id);if(!(await confirmBox(`<b>${esc(w.name)}</b>의 비밀번호를 초기화할까요?\n\n다음 로그인 때 주민등록번호로 본인 확인 후 새 비밀번호를 직접 정하게 됩니다.`,'초기화')))return;run('resetPw',{id});};

/* ----- 관리자: 공사 ----- */
aProjSave=function(id){const g=k=>document.getElementById(k).value.trim();run('saveProject',{id,data:{code:g('fp_code'),client:g('fp_client'),plant:g('fp_plant'),name:g('fp_name'),amount:g('fp_amount'),mgrName:g('fp_mgr'),mgrPhone:g('fp_mgrph')}},null,true).then(r=>{if(r)closeModal(),render();});};
aProjToggle=function(id){run('projectToggle',{id});};
aProjDone=async function(id,on){const p=P(id);
  if(on){const pend=S.records.filter(r=>(r.status==='pending'||r.status==='draft')&&r.entries.some(e=>e.projectId===id)).length;
    if(!(await confirmBox(`<b>${esc(p.name)}</b> 공사를 완료 처리할까요?\n\n완료하면 근로자 드롭다운에서 사라지고, 지금까지의 기록은 그대로 보존됩니다.${pend?`\n\n※ 이 공사가 포함된 미승인 기록이 ${pend}건 있습니다. 승인 관리에서 확인하세요.`:''}`,'완료 처리')))return;}
  run('projectDone',{id,on});};
aProjDel=async function(id){const p=P(id);if(!(await confirmBox(`${esc(p.name)} 공사를 삭제할까요?`,'삭제')))return;run('deleteProject',{id});};

/* ----- 관리자: QR 장소 · 설정 ----- */
aSpotSave=function(id){const g=k=>document.getElementById(k).value.trim();run('saveSpot',{id,data:{name:g('fs_name'),addr:g('fs_addr'),lat:g('fs_lat'),lng:g('fs_lng'),radius:g('fs_rad')}},null,true).then(r=>{if(r)closeModal(),render();});};
aSpotToggle=function(id){run('spotToggle',{id});};
aQrRekey=async function(id){const sp=SP(id);if(!(await confirmBox(`<b>${esc(sp.name)}</b> QR을 재발급할까요?\n\n지금 붙어 있는 QR 포스터는 즉시 사용할 수 없게 되므로, 새 포스터를 출력해 교체해야 합니다.`,'재발급')))return;const r=await run('rekey',{id});if(r)aQrShow(id);};
setSetting=function(k,v){run('setSetting',{key:k,value:!!v});};
logG=function(){};   /* 변경 이력은 서버가 기록 */
/* ----- 가입 신청 / 승인 ----- */
doSignup=async function(){const d=signupRead();if(!d)return;busy(true);
  try{await call('signup',d);ses.signup=false;render();alertBox('가입 신청이 접수되었습니다',['관리자가 승인하면 연락처와 비밀번호로 로그인할 수 있습니다.']);}
  catch(e){failMsg(e);}finally{busy(false);}};
aSignApprove=function(id){const d=signForm();run('signupApprove',{id,data:d},null,true).then(r=>{if(r)closeModal(),render();});};
aSignRejectDo=function(id){const r=document.getElementById('sr_r').value.trim();if(!r){toast('반려 사유를 입력하세요.');return;}run('signupReject',{id,reason:r});};
/* ----- 연차 ----- */
lvDo=async function(op,p,okMsg){return await run('leave_'+op,p,okMsg);};

/* ----- 파일 저장: 인쇄용은 새 창, CSV는 구글 드라이브에 저장 ----- */
saveFile=async function(filename,data){
  if(filename.endsWith('.html')){
    let w=null;try{w=window.open('','_blank');}catch(e){}
    if(w){w.document.open();w.document.write(data);w.document.close();toast('새 창에서 열었습니다. 인쇄(Ctrl+P)하세요.');return;}
  }
  busy(true);
  try{const r=await call('exportFile',{name:filename,data});
    openModal(`<div class="mbox" style="max-width:460px"><h3>파일을 만들었습니다</h3><p class="mute">구글 드라이브 "전자출근부_내보내기" 폴더에 저장했습니다.</p><div class="row"><a class="btn pri" href="${esc(r.download)}" target="_blank" rel="noopener">내려받기</a><a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">드라이브에서 열기</a><span class="sp"></span><button class="btn" onclick="closeModal()">닫기</button></div></div>`);
  }catch(e){failMsg(e);}finally{busy(false);}
};
}
