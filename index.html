<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e1e5eb;--pri:#8d2d30;--pri2:#1b786e;--brand-r:#8d2d30;--brand-g:#1b786e;--ok:#1f8a4c;--warn:#b86e00;--bad:#c23b3b;--chip:#eef2f7}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.demo-banner{background:#fff4d6;color:#6d4a00;font-size:13px;padding:6px 16px;border-bottom:1px solid #f0dca0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:none;color:var(--pri2);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.top{background:#fff;color:var(--ink);padding:9px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--brand-r) 0 62%,var(--brand-g) 62% 100%) 1;box-shadow:0 1px 6px rgba(0,0,0,.06)}
@media(max-width:480px){.top{flex-wrap:wrap;row-gap:6px;padding:8px 10px;gap:6px}.top .btn.sm{padding:5px 8px;font-size:12.5px}.top select.lang-top{max-width:118px;font-size:12.5px}}   /* 휴대폰: 위쪽 버튼이 옆으로 넘치지 않게 */
.top .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.top .brand .logo{height:22px}
.top .brand .bt{padding-left:10px;border-left:1px solid var(--line)}
.top .btn{background:#fff;border-color:var(--line);color:var(--ink)}

.loginlogo{display:block;height:auto;width:min(260px,72%);margin:4px auto 14px}
@media(max-width:420px){.top .brand .bt{display:none}}
.sp{flex:1}
.wrap{max-width:1440px;margin:0 auto;padding:16px}
.wrap.narrow{max-width:560px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.big{width:100%;padding:22px;font-size:21px;font-weight:700;border-radius:14px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;background:#fff;border-radius:10px 10px 0 0}
.tab{padding:11px 14px;border:none;background:none;font:inherit;color:#374151;font-weight:500;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--pri);border-color:var(--pri);font-weight:700}
.tab .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{background:#f7f9fb;font-weight:500;color:var(--mute);white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.nw th,.nw td{white-space:nowrap;vertical-align:middle;padding:7px 5px;font-size:13.5px}
.nw .chip{font-size:11.5px;padding:1px 6px}
.nw td .btn{margin:1px 0}
.roster .rline{display:flex;gap:10px;margin-top:5px;font-size:14px}.roster .rline>span:first-child{flex:0 0 78px;color:var(--mute)}.roster .rline.sub>span:first-child{padding-left:14px}
.roster.mine{border-left:4px solid var(--pri2);background:#f5fbfa}.mename{background:#d9efe9;border-radius:4px;padding:0 3px;font-weight:700}
.rboard{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}.rpool{position:sticky;top:64px}.rcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.rcols .card{margin-bottom:0}
@media(max-width:820px){.rboard{grid-template-columns:1fr}.rpool{position:static}}
.rcard.draft{border:2px dashed #e0b25a;background:#fffdf6}.rzl i{display:block;font-style:normal;font-size:10px;color:var(--pri2)}.dchip .qs{margin-left:4px;font-size:10px;color:var(--pri2);font-weight:700}.qchip{background:#e3f2ee;color:#155e55;font-size:11px}
.dchip.ext{background:#fff7e8;border-color:#f0d3a8;cursor:default}.dchip.ext small{margin-left:4px;font-size:10px;color:#9a6a12}.dchip.ext button{border:none;background:none;color:var(--bad);cursor:pointer;padding:0 0 0 4px}
.qtog{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}.qtog button{font-size:11px;padding:1px 6px;border-radius:999px;border:1px solid #d6dbe3;background:#fff;color:#9aa3ad;cursor:pointer}.qtog button.q-ok{background:#1b786e;border-color:#1b786e;color:#fff}.qtog button.q-soon{background:#e8a33d;border-color:#e8a33d;color:#fff}.qtog button.q-expired{background:#c23b3b;border-color:#c23b3b;color:#fff;text-decoration:line-through}
.dchip.also{background:#eef5f3;border-style:dashed;cursor:default}.dchip.also small{margin-left:3px;font-size:10px;color:var(--pri2)}.dchip.also button{border:none;background:none;color:var(--bad);cursor:pointer;padding:0 0 0 3px}.alsobtn{font-size:11px;padding:1px 6px;border:1px dashed var(--pri2);border-radius:999px;background:#fff;color:var(--pri2);cursor:pointer}
.dzone{display:flex;flex-wrap:wrap;gap:5px;min-height:26px}.dchip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:13px;background:#fff;border:1px solid #cfd6df;cursor:grab;user-select:none;-webkit-user-select:none}
.dchip.v{background:#eef5f3;border-color:#bfe0d6}.dchip.warn{border-color:var(--bad);color:var(--bad)}.dchip.sel{outline:2px solid var(--pri);background:#fbeeee}.dchip.dragging{opacity:.4}
.rzone.rz{display:flex;gap:8px;align-items:flex-start;border:1px dashed #d6dbe3;border-radius:8px;padding:6px;margin-top:6px}.rzl{flex:0 0 30px;font-size:12px;color:var(--mute);padding-top:4px}
.rzone.over{background:#e9f6f2;border-color:var(--pri2)}.rzone.target{border-color:var(--pri);background:#fff8f8;cursor:pointer}.rpool.target{cursor:pointer}
.rrole{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.rrole>b{flex:0 0 34px}.rrole select{width:auto;min-width:140px}.rchips{display:flex;flex-wrap:wrap;gap:4px}
.rchip{background:#eef5f3;border:1px solid #cfe6df;font-size:13px}.rchip button{border:none;background:none;color:var(--bad);cursor:pointer;padding:0 0 0 4px;font-size:12px}
.reply{background:#f6f8fa;border-left:3px solid var(--pri2);padding:6px 10px;margin-top:6px;border-radius:4px;font-size:14px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--chip);white-space:nowrap;margin:1px 2px 1px 0}
.st-draft{background:#eef0f3;color:#55606e}.st-pend{background:#e6effb;color:var(--pri2)}.st-ok{background:#e3f4ea;color:var(--ok)}.st-bad{background:#fbe7e7;color:var(--bad)}
.c-in{background:#e3f4ea;color:var(--ok)}.c-out{background:#fff0dc;color:var(--warn)}.c-man{background:#eef0f3;color:#55606e}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd6df;border-radius:8px;width:100%;background:#fff;color:var(--ink)}
input:disabled,select:disabled,textarea:disabled{background:#f3f5f8}
input[type=checkbox]{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2fixed{grid-template-columns:1fr 1fr!important}
.codocs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.codoc{border:1px solid var(--line);border-radius:12px;padding:12px}.codoc.sel{border-color:var(--bad);background:#fff5f5}
label.f{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
label.f>span{display:block;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fafbfc}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:28px 10px}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:14px;max-width:820px;width:100%;padding:18px}

    return `QR 촬영: ${sn} · GPS ${c.inside?'일치':'불일치 (QR 장소에서 '+fmtDist(c.dist)+' 떨어짐)'}${c.inside?' ('+fmtDist(c.dist)+')':''}${c.method==='sim'?' [데모 위치]':''}`;}
  if(c.lat==null)return c.method==='admin'?'관리자 입력':c.method==='manual'?'수기 입력(위치정보 없음)':'위치 없음';
  return '위치 기록 '+c.lat+','+c.lng+(c.nearId?' · 가까운 현장: '+pname(c.nearId)+' ('+fmtDist(c.dist)+')':'');
}
function validate(r,isAdmin){
  const errors=[],warns=[];const es=r.entries||[];
  if(!es.length)errors.push('작업 내역을 1건 이상 입력하세요.');
  es.forEach((e,i)=>{
    const n=`작업 ${i+1}`;
    if(!e.projectId)errors.push(`${n}: 공사를 선택하세요.`);
    if(!(e.desc||'').trim()||(e.desc||'').trim().length<2)errors.push(`${n}: 작업내용을 입력하세요.`);
    const g=entryG(e);if(!g)errors.push(`${n}: 공수를 고르세요.`);else if(Math.round(g*2)!==g*2)errors.push(`${n}: 공수는 0.5 단위로 입력하세요.`);
  });
  if(totalG(r)>5)warns.push(`하루 공수 합계가 5를 넘습니다 (${fmtG(totalG(r))}). 확인하세요.`);
  if(!r.checkIn)(isAdmin?warns:errors).push('출근 기록이 없습니다.');
  if(!r.checkOut)(isAdmin?warns:errors).push(isAdmin?'퇴근 기록이 없습니다.':'퇴근 기록 후 승인 요청할 수 있습니다.');
  if(!isAdmin&&r.manual&&!(r.manualReason||'').trim())errors.push('사후 신청 사유를 입력하세요.');
  return{errors,warns};
}

/* ---------- GPS (실제 → 실패 시 데모 위치 선택) ---------- */
function getPos(spot){return new Promise(res=>{
  let done=false;const fb=()=>{if(done)return;done=true;simPos(spot).then(res);};
  if(!navigator.geolocation){fb();return;}
  const tmr=setTimeout(fb,7000);
  try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(tmr);res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),method:'gps'});},()=>{clearTimeout(tmr);fb();},{enableHighAccuracy:true,timeout:6000,maximumAge:0});}catch(e){clearTimeout(tmr);fb();}
});}
let simResolve=null;
let simTargets=[];
function simPos(spot){return new Promise(res=>{simResolve=res;
  simTargets=spot?[spot]:S.projects.filter(p=>p.active);
  openModal(`<div class="mbox" style="max-width:480px"><h3>📍 위치 선택 (데모 전용)</h3>
  <div class="infobox">이 미리보기 화면은 보안상 휴대폰 GPS를 쓸 수 없어 위치를 직접 고릅니다.<br>실제 운영 시스템에서는 버튼을 누르는 순간 휴대폰 GPS 좌표가 자동 기록됩니다.</div>
  ${simTargets.map((p,i)=>`<button class="btn" style="width:100%;margin-bottom:6px;text-align:left" onclick="simPick(${i})">${spot?'QR 장소에 실제로 있음':'현장 안'} — ${esc(p.name)}</button>`).join('')}
  <button class="btn bad" style="width:100%;margin-bottom:6px;text-align:left" onclick="simPick(-1)">${spot?'다른 곳에 있음 — QR 사진을 찍어 가서 쓴 경우':'현장 밖 — 등록된 현장에서 떨어진 곳'}</button>
  ${spot?'<button class="btn" style="width:100%;margin-bottom:6px;text-align:left" onclick="simPick(-2)">GPS 꺼짐·권한 거부</button>':''}
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="simPick(null)">취소</button></div></div>`);
});}
function simPick(i){const f=simResolve;simResolve=null;closeModal();if(i===null){f(null);return;}
  if(i===-2){f({lat:null,lng:null,acc:null,method:'nogps'});return;}
  const act=simTargets;let lat,lng;
  if(i<0){const p=act[0]||{lat:36.95,lng:126.7};lat=p.lat+0.035;lng=p.lng+0.02;}else{lat=act[i].lat+(Math.random()-0.5)*0.002;lng=act[i].lng+(Math.random()-0.5)*0.002;}
  f({lat,lng,acc:15,method:'sim'});}

async function saveFile(filename,data){
  let dl=null;
  try{if(typeof claude!=='undefined'&&claude.use)dl=await claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename,data});toast('파일을 저장했습니다: '+filename);return;}catch(e){if(e&&e.code==='declined'){toast('저장을 취소했습니다');return;}}}
  if(typeof claude==='undefined'){try{const u=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.csv')?'text/csv':'text/html'}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('파일을 저장했습니다');return;}catch(e){}}
  openModal(`<div class="mbox"><h3>파일 저장을 사용할 수 없는 화면입니다</h3><p class="mute">아래 내용을 복사해 메모장에 붙여넣고 ${esc(filename)} 으로 저장하세요.</p><textarea id="cpy" rows="12">${esc(data)}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('cpy').value).then(()=>toast('복사했습니다'),()=>toast('복사 실패 — 직접 선택해 복사하세요'))">복사</button><button class="btn pri" onclick="closeModal()">닫기</button></div></div>`);
}

/* ---------- 로그인 / 동의 ---------- */
function vLogin(){
  const demo=S.workers.slice().sort((a,b)=>(a.role==='admin'?-1:0)-(b.role==='admin'?-1:0));
  return `<div class="wrap narrow">${qr&&qr.spot?`<div class="infobox" style="margin-top:16px">📍 <b>${esc(qr.spot.name)}</b> QR로 접속했습니다.<br>로그인하면 바로 출퇴근 화면으로 이동합니다. ("로그인 유지"를 체크하면 다음부터는 QR 촬영만으로 바로 열립니다.)</div>`:''}<div class="card" style="margin-top:${qr&&qr.spot?'8':'20'}px"><span class="logo loginlogo" role="img" aria-label="GOSHEN ENG"></span><h2 style="text-align:center;margin-top:0">주식회사 고센이엔지 · 전자시스템</h2>
  <label class="f"><span>연락처 (휴대폰 번호 = 아이디, 숫자만)</span><input id="lg_phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01012345678" oninput="this.value=this.value.replace(/\\D/g,'')"></label>
  <label class="f"><span>비밀번호</span><input id="lg_pw" type="password" maxlength="20" placeholder="처음 로그인이면 비워 두고 로그인을 누르세요" onkeydown="if(event.key==='Enter')doLogin()"></label>
  <label class="row" style="margin-bottom:12px"><input type="checkbox" id="lg_keep" checked> 이 휴대폰에서 로그인 유지 (QR 촬영 시 바로 출퇴근)</label>
  <button type="button" class="btn pri" style="width:100%;padding:12px;touch-action:manipulation" onclick="doLogin()">로그인</button>
  <div class="row" style="margin-top:12px;justify-content:center"><span class="mute">처음 사용하시나요?</span><button class="btn" onclick="ses.signup=true;render()">가입 신청</button></div></div>${inAppBox()}
  ${qr||LIVE?'':`<div class="card"><h3>📷 QR 촬영 체험 (데모)</h3><p class="mute">실제로는 휴게쉼터의 QR을 휴대폰 카메라로 촬영하면 이 화면이 열립니다. 아래에서 촬영할 QR 장소를 고르세요.</p>${qrDemoBtns()}</div>`}
  ${LIVE?'':`<div class="card"><h3>데모 계정으로 바로 들어가기</h3><p class="mute">누르면 해당 계정으로 로그인합니다. (관리자 비밀번호 0000 / 근로자 1234 · <b>최정훈</b>은 최초 로그인 체험용)</p>
  <div class="demo-acc">${demo.map(w=>`<button onclick="quickLogin('${w.id}')"><b>${esc(w.name)}</b> ${w.role==='admin'?'<span class="chip st-pend">관리자</span>':''}${w.status==='퇴사'?'<span class="chip st-bad">퇴사</span>':''}${!w.pw?'<span class="chip c-out">첫 로그인 전</span>':(!w.consent?'<span class="chip">동의 전</span>':'')}<small>${esc(affLabel(w))} · ${w.type} · ${w.phone}</small></button>`).join('')}</div></div>`}</div>`;
}
/* 카카오톡·네이버 등 앱 안 브라우저: 문제 시 기본 브라우저로 열기 */
function inAppName(){const u=navigator.userAgent||'';return /KAKAOTALK/i.test(u)?'카카오톡':/NAVER\(inapp/i.test(u)?'네이버':/Instagram|FBAN|FBAV|Line\//i.test(u)?'앱':'';}
function inAppBox(){const n=inAppName();const ver=`<p class="mute" style="text-align:center;font-size:11px;margin:6px 0 0">화면 버전 ${APP_VER}</p>`;if(!n)return ver;
  const u=location.href,k='kakaotalk://web/openExternal?url='+encodeURIComponent(u);
  return `<div class="infobox" style="margin-top:10px">ℹ️ <b>${n} 안의 브라우저</b>로 열려 있습니다. 로그인 버튼이 반응하지 않으면 <b>기본 브라우저(사파리·크롬)</b>로 열어 주세요.<div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">${n==='카카오톡'?`<a class="btn pri" href="${k}">기본 브라우저로 열기</a>`:''}<button type="button" class="btn" onclick="copyUrl()">주소 복사</button></div></div>`+ver;}
function copyUrl(){const u=location.href;try{navigator.clipboard.writeText(u).then(()=>toast('주소를 복사했습니다. 사파리에 붙여넣으세요.'),()=>prompt('주소를 복사하세요',u));}catch(e){prompt('주소를 복사하세요',u);}}
function quickLogin(id){const w=W(id);document.getElementById('lg_phone').value=w.phone.replace(/\D/g,'');document.getElementById('lg_pw').value=w.pw||'';doLogin();}
function doLogin(){
  const ph=(document.getElementById('lg_phone').value||'').replace(/\D/g,''),pw=document.getElementById('lg_pw').value||'';
  const w=S.workers.find(x=>x.phone.replace(/\D/g,'')===ph);
  if(!w){toast('등록되지 않은 연락처입니다. 처음이면 아래 [가입 신청]을 눌러 주세요.');return;}
  if(w.status==='가입대기'){alertBox('가입 승인 대기 중입니다',['관리자가 승인하면 로그인할 수 있습니다.']);return;}
  if(w.status==='가입반려'){alertBox('가입 신청이 반려되었습니다',[(w.rejectReason?'사유: '+w.rejectReason:'관리자에게 문의하세요.'),'정보를 고쳐 다시 신청하려면 [가입 신청]을 눌러 주세요.']);return;}
  if(w.status==='퇴사'){alertBox('퇴사 처리된 계정입니다',['로그인할 수 없습니다. 과거 기록은 회사에 보존되어 있으며, 확인이 필요하면 관리자에게 문의하세요.']);return;}
  if(!w.pw){const kp=document.getElementById('lg_keep');ses.keep=!!(kp&&kp.checked);ses.setup=w.id;render();return;}
  if(w.pw!==pw){toast('비밀번호가 일치하지 않습니다.');return;}
  const kp=document.getElementById('lg_keep');keepSet(kp&&kp.checked?w.id:'');
  ses.uid=w.id;ui.wTab='today';ui.aTab='dash';ui.asWorker=false;render();
}
function logout(){if(typeof ST_K!=='undefined'){ST_K={};ST_H=null;}closeModal();ses.uid=null;ses.setup=null;keepSet('');render();}
function qrDemoBtns(){const ss=S.spots.filter(s=>s.active);if(!ss.length)return '<p class="mute">등록된 QR 장소가 없습니다.</p>';
  return ss.map(s=>`<button class="btn" style="width:100%;margin-bottom:6px;text-align:left" onclick="qrScan('${s.id}')">📷 ${esc(s.name)} QR 촬영</button>`).join('');}
function qrScan(id){qr={spot:SP(id)};render();window.scrollTo(0,0);}
function openRecs(wid){const from=daysAgo(2);return S.records.filter(r=>r.workerId===wid&&r.date>=from&&r.checkIn&&!r.checkOut&&editable(r)).sort((a,b)=>b.date.localeCompare(a.date));}
const wdBox=(d,lb)=>`<div class="workday">${lb||'근무일'} <b>${fmtDay(d)}</b></div>`;
function vQR(me){
  const s=qr.spot,td=today(),y=daysAgo(1),r=recOf(me.id,td),opens=openRecs(me.id);
  if(ui.qrOut&&!opens.find(o=>o.date===ui.qrOut))ui.qrOut=null;
  const outDate=ui.qrOut||(r&&r.checkIn&&!r.checkOut?td:null);
  let h=`<div class="top"><div class="brand"><span class="logo" role="img" aria-label="GOSHEN ENG"></span><span class="bt">전자시스템</span></div><span class="sp"></span><button class="btn sm" onclick="qr=null;ui.qrOut=null;render()">닫기</button></div><div class="wrap narrow">
  <div class="card" style="margin-top:6px;text-align:center"><div class="mute">📍 QR 촬영 장소</div><h2 style="margin:4px 0">${esc(s.name)}</h2>
  <div class="mute">${esc(me.name)} 님 · ${esc(affLabel(me))}</div><div style="font-size:34px;font-weight:700;margin:10px 0" id="clock">${hm(new Date())}</div><div class="mute">${fmtDay(td)}</div>`;
  if(outDate){
    const or=recOf(me.id,outDate);

function ledYears(){const ys=new Set([Number(today().slice(0,4))]);(S.gisung||[]).concat(S.safety||[]).forEach(r=>ys.add(Number(r.year)));return [...ys].sort((a,b)=>b-a);}
function gCalc(p,g){const A=Number(p&&p.amount)||0,B=Number(g&&g.prev)||0,X=msum(g&&g.m);return {A,B,X,rate:A?(B+X)/A:'',E:A?A-B-X:''};}
function sCalc(s){const D=Number(s&&s.budget)||0,S2=(Number(s&&s.carry)||0)+msum(s&&s.m);return {D,S:S2,rate:D?S2/D:'',E:D?D-S2:''};}
function pCode(p){return p.code||((p.client||'').split('\n')[0])||'-';}
/* 대장 순서 = 공사정보등록 목록 순서, 완료된 공사는 아래 별도 구역 */
const ledIdx=p=>{const i=S.projects.indexOf(p);return i<0?1e9:i;};
const ledSort=(a,b)=>((a.p.done?1:0)-(b.p.done?1:0))||(ledIdx(a.p)-ledIdx(b.p));
function ledSec(p,done,cols){return p.done&&!done.v?(done.v=1,`<tr class="sec click" onclick="ui.ledDoneOpen=!ui.ledDoneOpen;render()"><td colspan="${cols}">${ui.ledDoneOpen?'▼':'▶'} ✔ 완료된 공사 (${done.n}건) — ${ui.ledDoneOpen?'눌러서 접기':'눌러서 펼치기'} <span class="mute">(기성 완료 처리한 공사 · 근로자 공사 목록에서 빠짐)</span></td></tr>`):'';}

function ledCsv(name,head,rows){const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const t='﻿'+[head].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

function ledFreeze(){document.querySelectorAll('table.led').forEach(t=>{const hr=t.rows[0];if(!hr)return;const hc=[...hr.cells],ni=hc.findIndex(c=>c.textContent.trim()==='공사명');if(ni<0)return;
  /* 세로: 머리글 행 고정(기존 CSS) · 가로: 공사명 열만 따라오게 */
  [...t.rows].forEach(r=>{if(r.classList.contains('sec'))return;let col=0;[...r.cells].forEach(c=>{const sp=c.colSpan||1;c.classList.remove('frz','frzL');if(col===ni&&sp===1){c.style.position='sticky';c.style.left='0px';c.classList.add('frz','frzL');}else if(c.style.left){c.style.left='';if(c.tagName!=='TH')c.style.position='';}col+=sp;});});});}
window.addEventListener('resize',()=>{if(typeof ui!=='undefined'&&(ui.aTab==='gisung'||ui.aTab==='safety'))ledFreeze();});
function ledMatch(p,c){const q=(ui.lq||'').trim(),ctr=p.contractor||'고센이엔지';if(ui.lc&&ctr!==ui.lc)return false;if(q&&![p.plant,p.name,p.code,p.client,p.mgrName,ctr].some(v=>String(v||'').includes(q)))return false;

function gList(){const y=ledY();return (S.gisung||[]).filter(g=>Number(g.year)===y).map(g=>({g,p:P(g.projectId)||{name:'(삭제된 공사)'}})).map(x=>Object.assign(x,{c:gCalc(x.p,x.g)})).filter(x=>ledMatch(x.p,x.c)).sort(ledSort);}
function sUsed(x){return x.budget!==''&&x.budget!=null||x.carry!==''&&x.carry!=null||(x.m||[]).some(v=>v!==''&&v!=null);}
function sList(){const y=ledY();return (S.safety||[]).filter(s=>Number(s.year)===y&&!((P(s.projectId)||{}).noSafety&&!sUsed(s))).map(s=>({s,p:P(s.projectId)||{name:'(삭제된 공사)'}})).map(x=>Object.assign(x,{c:sCalc(x.s)})).filter(x=>ledMatch(x.p,x.c)).sort(ledSort);}

    h+=`<tr class="click${p.done?' isdone':''}" onclick="gForm('${g.id}')"><td onclick="event.stopPropagation()" style="white-space:nowrap">${p.done?'<span class="chip st-pend">완료</span>':`<button class="chip ${p.active?'st-ok':'st-draft'}" style="border:none;cursor:pointer" title="눌러서 사용/중지 바꾸기" onclick="aProjToggle('${p.id}')">${p.active?'사용':'중지'}</button>`}</td><td>${esc(p.contractor||'고센이엔지')}</td><td>${esc(pCode(p))}</td><td>${esc(p.client||'')}</td><td>${esc(p.plant||'')}</td><td><b>${esc(p.name)}</b>${ledDoneChip(p)}</td><td>${esc(p.mgrName||'')}</td><td style="text-align:center">${p.permit?'✔':'<span class="mute">–</span>'}</td><td>${esc(p.contractStart||'')}</td><td${over?' style="color:var(--bad);font-weight:600" title="계약 종료일 지남 · 잔금 남음"':''}>${esc(p.contractEnd||'')}</td><td class="num">${won(p.amount)}</td><td style="text-align:center">${p.insSettled?'✔':'<span class="mute">–</span>'}</td><td class="num">${won(g.prev)}</td>${MH.map((_,i)=>`<td class="num">${won((g.m||[])[i])}</td>`).join('')}<td class="num" ${c.rate!==''&&c.rate>=1?'style="color:var(--ok);font-weight:600"':''}>${pctS(c.rate)}</td><td class="num"><b>${won(c.X)}</b></td><td class="num" ${c.E!==''&&c.E<0?'style="color:var(--bad)"':''}>${won(c.E)}</td></tr>`;});
  if(L.length)h+=`<tr class="tot"><td colspan="10"><b>계</b></td><td class="num">${won(tot.A)}</td><td></td><td class="num">${won(tot.B)}</td>${tot.m.map(v=>`<td class="num">${v?won(v):''}</td>`).join('')}<td></td><td class="num"><b>${won(tot.X)}</b></td><td class="num"><b>${won(tot.E)}</b></td></tr>`;
  return h+`</table></div><p class="mute" style="margin-bottom:0">행을 누르면 월별 기성금과 담당자·계약 종료·허가서·보험료 정산을 고칠 수 있습니다. 진행률 = (전년도 기성금 + 당해년도 기성금) ÷ 수주금액, 이월 잔금 = 수주금액 − 누적 기성금. 「사용」을 누르면 사용/중지가 바뀝니다 (중지된 공사는 근로자 공사 선택 목록에서 빠짐).</p></div>`;}

/* 기성준공에서 완료 처리 → 공사정보등록의 같은 공사도 완료 (한 곳에 저장) */
async function gDone(pid,on){const p=P(pid);if(!p)return;
  if(on){const g=(S.gisung||[]).filter(x=>x.projectId===pid).sort((a,b)=>b.year-a.year)[0];const c=g?gCalc(p,g):{E:''};
    const pend=S.records.filter(r=>(r.status==='pending'||r.status==='draft')&&(r.entries||[]).some(e=>e.projectId===pid)).length;
    const warn=(c.E!==''&&c.E>0?`\n\n⚠ 이월 잔금(E)이 <b>${won(c.E)}원</b> 남아 있습니다. 그래도 완료할까요?`:'')+(pend?`\n\n※ 이 공사가 포함된 미승인 출근 기록이 ${pend}건 있습니다.`:'');
    if(!(await confirmBox(`<b>${esc(p.name)}</b>\n\n기성 완료 처리할까요?\n\n• 기성준공 대장: 아래 「완료된 공사」 구역으로 이동\n• 공사 목록: <b>완료</b>로 바뀜 (근로자 드롭다운에서 빠짐)\n• 입력된 기성금·출근 기록은 그대로 보존${warn}`,'완료 처리')))return;}
  else if(!(await confirmBox(`<b>${esc(p.name)}</b>\n\n완료를 취소할까요?\n공사 목록에서도 다시 진행 중으로 바뀌고 근로자 드롭다운에 나타납니다.`,'완료 취소')))return;
  if(LIVE){await gDoneLive(pid,on);return;}
  if(on){p.done=true;p.doneAt=stamp();p.active=false;logG(ses.uid,'공사 완료 (기성준공)',`${p.code?p.code+' ':''}${p.name}`);}
  else{p.done=false;p.doneAt='';p.active=true;logG(ses.uid,'공사 완료 취소 (기성준공)',`${p.code?p.code+' ':''}${p.name}`);}
  save();closeModal();render();toast(on?'완료 처리했습니다.':'완료를 취소했습니다.');}

function rosterCard(r,opt){opt=opt||{};const p=P(r.projectId)||{name:r.projectId?'(삭제된 공사)':'(공사 미정)'};const me=ses.uid,mine=r.members.some(m=>m.wid===me);

  const veh=r.vehicles.length?r.vehicles.map(v=>`<div>${esc(v.dname||'-')} · ${esc(v.model||'')} <b>${esc(v.plate||'')}</b>${v.xv?` <small class="mute">(외부${v.co?'·'+esc(v.co):''})</small>`:''}</div>`).join(''):'<span class="mute">없음</span>';
  return `<div class="card roster${mine?' mine':''}">
  <div class="row" style="gap:8px;flex-wrap:wrap"><b style="font-size:15px">${fmtDay(r.date)}</b><span class="chip">${esc(r.tStart)}~${esc(r.tEnd)}</span>${mine?'<span class="chip st-ok">내 투입</span>':''}<span class="sp"></span>${r.permit?`<button class="btn sm ${mine?'pri':''}" onclick="event.stopPropagation();rPermitView('${r.id}')">📋 안전작업허가서</button>`:''}
  ${opt.admin?`<button class="btn sm" onclick="rForm('${r.id}')">수정</button><button class="btn sm bad" onclick="rDel('${r.id}')">삭제</button>`:''}</div>
  <div class="rline"><span>■ 공사명</span><b>${esc(p.name)}</b></div>
  ${p.client||p.plant?`<div class="rline"><span>발주처·공장</span>${esc([p.client,p.plant].filter(Boolean).join(' · '))}</div>`:''}
  <div class="rline"><span>■ 업체명</span>${esc(r.company||DEF_CO)}</div>
  <div class="rline"><span>■ 작업위치</span>${esc(r.location)||'<span class="mute">-</span>'}</div>
  <div class="rline"><span>■ 투입인원</span><b>${r.members.length}명</b></div>
  ${ROLES.map(ro=>by(ro).length?`<div class="rline sub"><span>${ro}</span>${by(ro).map(nm).join(' ')}</div>`:'').join('')}
  <div class="rline"><span>■ 차량</span><div>${veh}</div></div>
  ${r.note?`<div class="rline"><span>■ 전달내용</span><div style="white-space:pre-wrap">${esc(r.note)}</div></div>`:''}
  ${p.mgrName?mgrLine(p.id,true):''}</div>`;}

  <p class="mute" style="margin:8px 0 0">${fmtDay(d)} · 공사 ${rs.length}건 · ${Object.keys(used).length}명 투입 · 미배치 ${off.length}명. <b>사람·차량을 끌어서</b> 공사의 역할 칸(관리·안전·신호·화기·밀폐·작업)에 놓으세요. 안전·신호·화기·밀폐는 근로자관리에서 자격을 체크한 사람만 들어가고, <b>신호·화기는 「+겸직」으로 한 사람이 함께</b> 맡을 수 있습니다 (휴대폰은 <b>눌러서 고른 뒤 놓을 칸을 누르기</b>). 한 사람은 하루에 한 공사에만 들어가며(<b>관리는 여러 공사 중복 가능</b>), 다른 공사로 옮기면 원래 공사에서 자동으로 빠집니다.</p>

  <h4 style="margin:12px 0 6px">미배치 차량 (${cars.length})</h4><div class="dzone">${cars.map(c=>rChipV({cid:c.id,plate:c.plate,dname:''})).join('')||`<span class="mute" style="font-size:13px">${(S.cars||[]).length?'모두 배치됨':'「차량관리」에서 차량을 등록하세요'}</span>`}</div>
  <p class="mute" style="font-size:12px;margin:10px 0 0">여기로 끌어 놓으면 명단에서 빠집니다.</p></div><div class="rcols">`;
  if(!rs.length)h+=`<div class="card"><p class="mute" style="margin:0">이 날짜의 명단이 없습니다. 「+ 공사 투입 추가」로 공사를 먼저 만들거나 「이전 명단 복사」를 누르세요.</p></div>`;
  rs.forEach(r=>{const p=P(r.projectId)||{name:r.projectId?'(삭제된 공사)':'(공사 미정)'};const dr=r.status==='임시';
    h+=`<div class="card rcard${dr?' draft':''}">${dr?`<div class="row" style="gap:6px;margin:-4px 0 6px"><span class="chip st-pend">임시저장 · 근로자에게 안 보임</span><span class="sp"></span><button class="btn sm ok" onclick="rPublish('${d}','${r.id}')">공개</button></div>`:''}<div class="row" style="gap:6px;align-items:flex-start"><div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="mute" style="font-size:12px">${esc([p.client,p.plant].filter(Boolean).join(' · '))}${r.company&&r.company!==DEF_CO?' · 업체 '+esc(r.company):''}</div></div><button class="btn sm" onclick="rForm('${r.id}')">수정</button><button class="btn sm bad" onclick="rDel('${r.id}')">✕</button></div>
    <div class="mute" style="font-size:12.5px;margin:4px 0 6px">${esc(r.tStart)}~${esc(r.tEnd)}${r.location?' · '+esc(r.location):''} · <b>${r.members.length}명</b></div>
    <div style="margin:0 0 6px">${r.permit?`<button type="button" class="chip st-ok" style="border:0;cursor:pointer" onclick="rPermitView('${r.id}')" title="눌러서 보기">📋 허가서 등록됨 ✓</button>`:`<button type="button" class="chip st-bad" style="border:0;cursor:pointer" onclick="rForm('${r.id}')" title="수정에서 붙여넣기">📋 허가서 없음</button>`}</div>
    ${rolesFor(r,(ui.rOpt||{})[r.id]).map(ro=>`<div class="rzone rz${tgt('m')}${RQ.indexOf(ro)>=0?' qz':''}" data-to="${r.id}" data-role="${ro}" data-acc="m" onclick="rZone(event,'${r.id}','${ro}','m')" title="${RQ.indexOf(ro)>=0?ro+' 자격이 있는 사람만':''}"><span class="rzl">${ro}${RQ.indexOf(ro)>=0?'<i>자격</i>':''}</span><div class="dzone">${r.members.filter(m=>m.also===ro).map(m=>`<span class="dchip also" title="${esc(m.role)}·${esc(ro)} 겸직">${esc(m.name)}<small>겸</small><button type="button" onclick="event.stopPropagation();rAlso('${r.id}','${m.wid}',0)" aria-label="겸직 해제">✕</button></span>`).join('')}${r.members.filter(m=>m.role===ro).map(m=>m.ext?`<span class="dchip ext" title="전자출근부에 없는 외부 인원">${esc(m.name)}<small>외부${m.co?'·'+esc(m.co):''}</small><button type="button" onclick="event.stopPropagation();rExtDel('${r.id}','${m.eid}')" aria-label="빼기">✕</button></span>`:rChipM(m.also?Object.assign({},m,{name:m.name+' ·겸'}):m,r.id)+(ALSO[ro]&&!m.also&&hasQ(W(m.wid),ALSO[ro],r.date)?`<button type="button" class="alsobtn" title="${ALSO[ro]}도 같이 맡기기" onclick="event.stopPropagation();rAlso('${r.id}','${m.wid}',1)">+${ALSO[ro]} 겸직</button>`:'')).join('')}</div></div>`).join('')}
    <div class="rzone rz${tgt('v')}" data-to="${r.id}" data-role="" data-acc="v" onclick="rZone(event,'${r.id}','','v')"><span class="rzl">차량</span><div class="dzone">${r.vehicles.map(v=>v.xv?`<span class="dchip ext" title="차량관리에 없는 외부 차량">🚚 ${esc(v.plate)}${v.dname?' · '+esc(v.dname):''}<small>외부</small><button type="button" onclick="event.stopPropagation();rExtVDel('${r.id}','${v.vid}')" aria-label="빼기">✕</button></span>`:rChipV(v,r.id)).join('')}</div></div>

    ${r.note?`<div style="font-size:12.5px;margin-top:6px;white-space:pre-wrap">📌 ${esc(r.note)}</div>`:''}</div>`;});
  return h+'</div></div>';}
function rTap(ev,k,id,from){ev.stopPropagation();from=from||'';ui.rSel=ui.rSel&&ui.rSel.k===k&&ui.rSel.id===id&&(ui.rSel.from||'')===from?null:{k,id,from};render();}
function rZone(ev,to,role,acc){if(!ui.rSel)return;if(acc!=='any'&&acc!==ui.rSel.k){toast(ui.rSel.k==='m'?'사람은 관리·안전·작업 칸에 놓으세요.':'차량은 차량 칸에 놓으세요.');return;}const s=ui.rSel;ui.rSel=null;rMove(s.k,s.id,to,role||'작업',s.from||'');}
/* 옮기기: 화면 먼저 바꾸고 서버에 저장 (실패하면 되돌림) */
async function rMove(k,id,to,role,from,driver){from=from||'';const d=ui.rDate;if(!LIVE){toast('시제품에서는 저장되지 않습니다.');return;}
  if(k==='v'&&to&&driver===undefined){rDriverPick(id,to,from);return;}
  if(!to&&!from){render();return;}   /* 미배치 → 미배치: 할 일 없음 */
  if(k==='m'&&to&&RQ.indexOf(role)>=0&&!hasQ(W(id),role,d)){toast(W(id).name+' 님은 「'+role+'」 자격이 없거나 만료되었습니다. 근로자관리에서 자격·만료일을 확인하세요.');render();return;}
  const snap=JSON.stringify(S.rosters);
  const keepMgr=k==='m'&&to&&role==='관리';
  rostersOn(d).forEach(x=>{if(k==='m')x.members=x.members.filter(m=>m.wid!==id||(x.id!==to&&x.id!==from&&(keepMgr?m.role==='관리':(!to&&from&&m.role==='관리'))));else x.vehicles=x.vehicles.filter(v=>v.cid!==id);
    if(x.id===to){if(k==='m')x.members.push({wid:id,role,name:W(id).name});else{const c=carOf(id)||{};const drv=driver||'';x.vehicles.push({cid:id,driver:drv,dname:drv?W(drv).name:'',plate:c.plate,model:c.model});}}});
  render();
  try{const r=await window.liveCall('roster_assign',{date:d,kind:k,id,to,role,from,driver:driver||''});if(r&&r.state){window.liveApply(r.state);render();}}
  catch(e){S.rosters=JSON.parse(snap);render();window.liveFail(e);}}
/* 끌어서 놓기 (PC) */
(function(){let drag=null;
  document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.dchip');if(!c)return;drag={k:c.dataset.k,id:c.dataset.id,from:c.dataset.from||''};try{e.dataTransfer.setData('text/plain',drag.k+':'+drag.id);e.dataTransfer.effectAllowed='move';}catch(x){}c.classList.add('dragging');});
  document.addEventListener('dragend',e=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));drag=null;});
  const zoneOf=e=>e.target.closest&&e.target.closest('.rzone');
  const ok=(z)=>drag&&z&&(!z.dataset.acc||z.dataset.acc===drag.k);
  document.addEventListener('dragover',e=>{const z=zoneOf(e);if(!ok(z))return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over');});
  document.addEventListener('dragleave',e=>{const z=zoneOf(e);if(z&&!z.contains(e.relatedTarget))z.classList.remove('over');});
  document.addEventListener('drop',e=>{const z=zoneOf(e);if(!ok(z))return;e.preventDefault();const d=drag;drag=null;z.classList.remove('over');ui.rSel=null;rMove(d.k,d.id,z.dataset.to,z.dataset.role||'작업',d.from);});
})();
let RF=null;
function rForm(id,d){const r=id?(S.rosters||[]).find(x=>x.id===id):null;

  return h+'</table></div></div>';}
function cForm(id){const c=id?carOf(id):{plate:'',model:'',driver:'',inspDate:'',insEnd:'',insCo:'',repair:false,memo:'',active:true,repairLog:[]};

  <label class="row" style="gap:8px;margin:2px 0 8px"><input type="checkbox" id="cf_rep" style="width:auto" ${c.repair?'checked':''}> <b>수리 필요</b> <span class="mute">(투입명단에서 이 차량을 고르면 경고가 나옵니다)</span></label>
  <label class="row" style="gap:8px;margin:0 0 8px"><input type="checkbox" id="cf_act" style="width:auto" ${c.active!==false?'checked':''}> 사용 중 <span class="mute">(매각·폐차하면 해제)</span></label>
  <label class="f"><span>메모</span><textarea id="cf_memo" rows="2">${esc(c.memo||'')}</textarea></label>
  ${id?`<div class="card" style="background:#fafbfc;margin:8px 0"><b>보험증권 파일</b> ${c.insFile?`<span class="mute">${esc(c.insFile.name)} · ${esc((c.insFile.at||'').slice(0,10))}</span> <button class="btn sm" onclick="cFileGet('${id}')">보기</button>`:'<span class="mute">없음</span>'}
    <div style="margin-top:6px"><input type="file" id="cf_file" accept="application/pdf,image/*" style="width:auto"> <button class="btn sm" onclick="cFileUp('${id}')">올리기</button> <span class="mute" style="font-size:12px">PDF·사진, 8MB 이하. 구글 드라이브 「전자출근부_차량서류」 폴더에 보관</span></div></div>
  <div class="card" style="background:#fafbfc;margin:8px 0"><b>수리·점검 기록</b>${(c.repairLog||[]).slice().reverse().map(l=>`<div style="font-size:13px;margin-top:4px"><span class="mute">${esc((l.at||'').slice(0,16))}</span> ${esc(l.text)}</div>`).join('')||'<div class="mute" style="font-size:13px">기록이 없습니다.</div>'}
    <div class="row" style="gap:6px;margin-top:6px;flex-wrap:nowrap"><input id="cf_log" placeholder="예: 브레이크 패드 교체 (○○카센터)"><button class="btn sm" onclick="cLog('${id}')">기록</button></div></div>`:'<p class="mute">저장한 뒤 보험증권 파일과 수리 기록을 넣을 수 있습니다.</p>'}

function cSave(id){const g=k=>document.getElementById(k).value.trim();
  liveOnly('car_save',{id,data:{plate:g('cf_plate'),model:g('cf_model'),driver:g('cf_drv'),inspDate:g('cf_insp'),insEnd:g('cf_ins'),insCo:g('cf_insco'),repair:document.getElementById('cf_rep').checked,active:document.getElementById('cf_act').checked,memo:g('cf_memo')}});}
async function cDel(id){const c=carOf(id);if(!(await confirmBox(`<b>${esc(carLabel(c))}</b> 차량을 삭제할까요?\n기록을 남기려면 삭제 대신 "사용 중"을 해제하세요.`,'삭제')))return;liveOnly('car_del',{id});}
function cLog(id){const t=document.getElementById('cf_log').value.trim();if(!t){toast('내용을 입력하세요.');return;}liveOnly('car_log',{id,text:t},null).then(r=>{if(r)cForm(id);});}
function cFileUp(id){const f=(document.getElementById('cf_file').files||[])[0];if(!f){toast('파일을 고르세요.');return;}if(f.size>8*1024*1024){toast('8MB 이하 파일만 올릴 수 있습니다.');return;}
  const rd=new FileReader();rd.onload=()=>{const b64=String(rd.result).split(',')[1]||'';liveOnly('car_fileUp',{id,name:f.name,mime:f.type,b64},null).then(r=>{if(r)cForm(id);});};rd.readAsDataURL(f);}
async function cFileGet(id){if(!LIVE){toast('시제품에서는 파일이 없습니다.');return;}window.liveBusy(true);
  try{const r=await window.liveCall('car_fileGet',{id});const bin=atob(r.b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:r.mime||'application/octet-stream'}));
    alertBox('보험증권 파일',[]);document.querySelector('#modal .mbox').insertAdjacentHTML('beforeend',`<p><a class="btn pri" href="${url}" target="_blank" rel="noopener" download="${esc(r.name)}">📄 ${esc(r.name)} 열기</a></p>`);}
  catch(e){window.liveFail(e);}finally{window.liveBusy(false);}}

/* 대시보드 메뉴 검색: 메뉴 이름을 입력하면 바로 이동 */
function menuSearchCard(){return `<div class="card" style="padding:12px 16px"><div class="row" style="gap:8px;flex-wrap:wrap"><b style="white-space:nowrap">🔎 메뉴 찾기</b><input id="msq" style="flex:1;min-width:180px" placeholder="예: 연차, 투입, 기성, 카드, 세금계산서" autocomplete="off" oninput="menuSearch(this.value)" onkeydown="if(event.key==='Enter'){const b=document.querySelector('#msr button');if(b)b.click();}"></div><div id="msr" class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px">${menuHits('')}</div></div>`;}
const MENU_KW={forms:'양식 서식 엑셀 PPT 파워포인트 템플릿 다운로드 내려받기',dash:'홈 현황',cal:'일정 달력 캘린더',roster:'투입 명단 배치 허가서',workers:'근로자 직원 인원 자격 이수증',car:'차량 자동차 보험 정비',leave:'연차 휴가 반차',appr:'승인 출근 공수',month:'월간 출근부 엑셀 인쇄',gisung:'기성 준공 공사 등록 수주처 노무비',tax:'세금계산서 발행 요청',safety:'안전관리비',pre:'선작업 미수금 미발주',buy:'발주 지출 결의 카드 법인카드 자재 공사발주',board:'건의 게시판',company:'회사정보 사업자등록증 통장',log:'변경 이력 로그',next:'2단계 안내'};
function menuHits(q){q=String(q||'').trim().toLowerCase();if(!q)return '<span class="mute" style="font-size:13px">메뉴 이름이나 하는 일을 입력하면 바로 갈 수 있는 메뉴가 나옵니다. (Enter = 첫 번째 메뉴로 이동)</span>';const L=(ui._menus||[]).filter(m=>m.k!=='dash'&&(!q||(m.l+' '+m.g+' '+(MENU_KW[m.k]||'')).toLowerCase().indexOf(q)>=0));

const entStr=e=>`${pname(e.projectId)} ${entryG(e)?fmtG(entryG(e))+'공수':''} ${e.desc}`;

  return h+'</table></div></div>';

function aProjSave(id){const g=k=>document.getElementById(k).value.trim();

  const data={code:g('fp_code'),contractStart:g('fp_start'),name,client:g('fp_client'),plant:g('fp_plant'),amount:amt===''?'':Number(amt),mgrName:g('fp_mgr'),mgrPhone:g('fp_mgrph').replace(/\D/g,''),noSafety:document.getElementById('fp_nosafe').checked};if(data.mgrName&&!data.mgrPhone)data.mgrPhone=mgrPhoneC(mgrDirC(),data.mgrName);

  else{S.projects.push(Object.assign({id:uid(),active:true,done:false},data));logG(ses.uid,'공사 등록',`${data.code?data.code+' ':''}${name}`);}
  save();closeModal();render();toast('저장했습니다.');}
async function aProjDone(id,on){const p=P(id);

async function aProjDel(id){const p=P(id);const n=S.records.filter(r=>r.entries.some(e=>e.projectId===id)).length;

function setSetting(k,v){S.settings[k]=v;logG(ses.uid,'설정',k==='qrOnly'?('출퇴근 방식: '+(v?'QR 촬영만 허용':'QR + 앱 버튼 모두 허용')):('QR 장소 밖: '+(v?'출퇴근 불가(차단)':'기록 후 표시만')));save();render();}
function qrSvg(text,cell){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag(cell||6,2);}catch(e){return '<div class="badbox">QR 생성 실패</div>';}}
function aQr(){
  const st=S.settings;

  <label class="f"><span>출퇴근 방식</span><select onchange="setSetting('qrOnly',this.value==='1')"><option value="0" ${st.qrOnly?'':'selected'}>QR 촬영 + 앱 버튼 모두 허용</option><option value="1" ${st.qrOnly?'selected':''}>QR 촬영으로만 출퇴근 (버튼 숨김)</option></select></label>
  <label class="f"><span>QR 장소 밖에서 촬영한 경우</span><select onchange="setSetting('strict',this.value==='1')"><option value="1" ${st.strict?'selected':''}>출퇴근 불가 — 반경 안 + GPS 확인 시에만 기록</option><option value="0" ${st.strict?'':'selected'}>기록은 하고 "위치불일치"로 표시만</option></select></label></div>
  <div class="${st.qrOnly&&st.strict?'infobox':'warnbox'}">현재 규칙: ${st.qrOnly&&st.strict?`<b>등록된 QR 장소 ${S.spots.filter(x=>x.active).length}곳의 반경 안에서 QR을 촬영해야만 출퇴근할 수 있습니다.</b> GPS가 꺼져 있거나 반경 밖이면 기록되지 않고, 시도 내역은 변경 이력에 "출근 거부/퇴근 거부"로 남습니다.`:'다른 장소에서도 출퇴근 기록이 가능한 상태입니다.'}<br>예외: 근로자 "지난 날짜 신청"과 관리자 "기록 직접 추가"는 위치 없이 등록되며, 관리자 승인 대상으로 표시됩니다.</div>
  ${LIVE||st.baseUrl?'':'<div class="warnbox">운영 주소가 아직 없어 QR에 임시 주소가 들어갑니다. 지금 출력한 포스터는 시험용이며, 운영 주소 확정 후 다시 출력해야 합니다.</div>'}
  <p class="mute" style="margin:0">QR 사진을 찍어 가서 다른 곳에서 쓰는 경우에 대비해 GPS를 함께 확인합니다. QR이 외부로 유출됐다면 "QR 재발급"을 누르세요 — 기존 포스터는 즉시 사용할 수 없게 됩니다.</p></div>`;
  const nc=S.spots.filter(x=>x.active&&!x.coordOk);

    h+=`<tr><td>${esc(sp.code)}</td><td><b>${esc(sp.name)}</b><div class="mute">${esc(sp.addr)}</div></td><td style="white-space:nowrap">${sp.coordOk?'':'<span class="chip c-out">좌표 확인 필요</span><br>'}${sp.lat}, ${sp.lng}<br><span class="mute">반경 ${sp.radius}m</span> <a href="${GMAP}${sp.lat},${sp.lng}" target="_blank" rel="noopener">지도</a></td><td>${n}건</td><td><span class="chip ${sp.active?'st-ok':'st-draft'}">${sp.active?'사용':'중지'}</span></td>

  return h+'</table></div></div>';
}

async function aQrRekey(id){const sp=SP(id);if(!(await confirmBox(`<b>${esc(sp.name)}</b> QR을 재발급할까요?\n\n지금 붙어 있는 QR 포스터는 즉시 사용할 수 없게 되므로, 새 포스터를 출력해 교체해야 합니다.`,'재발급')))return;sp.key=rkey();logG(ses.uid,'QR 재발급',`${sp.code} ${sp.name}`);save();render();aQrShow(id);}

function aSpotForm(id){const sp=id?SP(id):{name:'',addr:'',lat:'',lng:'',radius:300};
  openModal(`<div class="mbox" style="max-width:600px"><div class="row"><h2 style="margin:0">${id?'QR 장소 수정':'QR 장소 추가'}</h2><span class="sp"></span><button class="btn sm" onclick="closeModal()">닫기 ✕</button></div>
  <label class="f" style="margin-top:12px"><span>장소명 * (예: 현대제철 당진 ○○공장 휴게쉼터)</span><input id="fs_name" value="${esc(sp.name)}"></label>
  <label class="f"><span>주소·위치 설명</span><input id="fs_addr" value="${esc(sp.addr)}"></label>
  <div class="grid3"><label class="f"><span>위도 *</span><input id="fs_lat" inputmode="decimal" value="${sp.lat}"></label><label class="f"><span>경도 *</span><input id="fs_lng" inputmode="decimal" value="${sp.lng}"></label><label class="f"><span>인정 반경(m)</span><input id="fs_rad" inputmode="numeric" value="${sp.radius}"></label></div>
  <div class="row" style="margin:-4px 0 8px"><button class="btn sm" onclick="spotHere()">📍 현재 위치로 입력 (쉼터에서 누르세요)</button><span class="mute" id="fs_here"></span></div>
  <p class="mute" style="margin-top:0">쉼터 위치에서 GPS 오차를 고려해 최소 100~300m 이상을 권장합니다. 실내·철골 구조물 안은 GPS 오차가 커질 수 있습니다.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" onclick="aSpotSave('${id}')">저장</button></div></div>`);}
function spotHere(){const m=document.getElementById('fs_here');m.textContent='위치 확인 중…';
  if(!navigator.geolocation){m.textContent='이 기기에서는 위치를 사용할 수 없습니다.';return;}
  try{navigator.geolocation.getCurrentPosition(p=>{document.getElementById('fs_lat').value=p.coords.latitude.toFixed(6);document.getElementById('fs_lng').value=p.coords.longitude.toFixed(6);m.textContent=`입력됨 (오차 ±${Math.round(p.coords.accuracy)}m) — 저장을 누르세요`;},()=>{m.textContent='위치를 가져오지 못했습니다. (이 미리보기 화면에서는 GPS 사용 불가 — 실제 운영 화면에서 동작)';},{enableHighAccuracy:true,timeout:8000,maximumAge:0});}catch(e){m.textContent='위치를 가져오지 못했습니다.';}}
function aSpotSave(id){const g=k=>document.getElementById(k).value.trim();const name=g('fs_name'),lat=parseFloat(g('fs_lat')),lng=parseFloat(g('fs_lng')),radius=parseInt(g('fs_rad'))||300;
  if(!name){toast('장소명을 입력하세요.');return;}
  if(!(lat>33&&lat<39)||!(lng>124&&lng<132)){toast('위도·경도를 확인하세요 (국내 좌표 범위).');return;}
  if(id){const o=SP(id);const moved=o.lat!==lat||o.lng!==lng;Object.assign(o,{name,addr:g('fs_addr'),lat,lng,radius});if(moved)o.coordOk=true;logG(ses.uid,'QR 장소 수정',name);}
  else{S.seq.spot=(S.seq.spot||0)+1;const sp={id:uid(),code:'S'+pad(S.seq.spot),name,addr:g('fs_addr'),lat,lng,radius,key:rkey(),active:true,coordOk:true};S.spots.push(sp);logG(ses.uid,'QR 장소 추가',`${sp.code} ${name}`);}
  save();closeModal();render();toast('저장했습니다.');}

/* ---------- 연차 관리 ---------- */
const LV_KINDS=['연차','반차','병가','기타'];
const LV_ADMIN_KINDS=['연차','반차','병가','기타','기존사용(이관)','발생조정'];
const LSTATUS={pending:'승인대기',approved:'승인',rejected:'반려',cancelled:'취소'};
const LSTCLS={pending:'st-pend',approved:'st-ok',rejected:'st-bad',cancelled:'st-draft'};
const lvChip=s=>`<span class="chip ${LSTCLS[s]}">${LSTATUS[s]}</span>`;
function ymdAdd(ds,y,m,d){const[a,b,c]=ds.split('-').map(Number);const t=new Date(Date.UTC(a+(y||0),b-1+(m||0),c+(d||0)));return t.toISOString().slice(0,10);}
function weekdays(s,e){if(!s||!e||e<s)return 0;let n=0,d=s;while(d<=e){const w=new Date(d+'T12:00:00Z').getUTCDay();if(w!==0&&w!==6)n++;d=ymdAdd(d,0,0,1);}return n;}
/** 입사일 기준 현재 연차 기간·발생일수 (근로기준법 제60조: 1년 미만 매월 1일(최대 11일), 1년 이상 15일, 3년 이상 2년마다 1일 가산, 최대 25일) */
function leavePeriod(w,asOf){
  if(!w||!w.join)return null;
  let n=0;while(ymdAdd(w.join,n+1)<=asOf)n++;
  const start=ymdAdd(w.join,n),end=ymdAdd(w.join,n+1);
  let accr;
  if(n===0){let m=0;while(m<11&&ymdAdd(w.join,0,m+1)<=asOf)m++;accr=m;}
  else accr=Math.min(25,15+Math.floor((n-1)/2));
  return{n,start,end,base:accr};
}
function leaveSum(w,asOf,list){
  const p=leavePeriod(w,asOf);if(!p)return null;
  const mine=(list||[]).filter(l=>l.workerId===w.id&&l.start>=p.start&&l.start<p.end);
  const sum=f=>mine.filter(f).reduce((a,l)=>a+Number(l.days||0),0);
  const adj=sum(l=>l.status==='approved'&&l.kind==='발생조정');
  const used=sum(l=>l.status==='approved'&&l.kind!=='발생조정');
  const pend=sum(l=>l.status==='pending');
  return Object.assign(p,{adj,accr:p.base+adj,used,pend,remain:p.base+adj-used,list:mine});
}
const asOfW=w=>(w.status==='퇴사'&&w.leave&&w.leave<today())?w.leave:today();
const fmtD=v=>{v=Math.round(Number(v||0)*10)/10;return (v%1===0?String(v):v.toFixed(1));};
const HALF_DEF={am:'08:00~12:00',pm:'13:00~17:00'},HALF_KO={am:'오전',pm:'오후'};
const halfTxt=l=>HALF_KO[l.half]?HALF_KO[l.half]+' 반차'+(l.hTime?' ('+l.hTime+')':''):'반차';
function lvLabel(l){return l.kind==='반차'?l.start+(HALF_KO[l.half]?' '+halfTxt(l):' (반차)'):(l.start===l.end?l.start:l.start+' ~ '+l.end);}
/* 반차 오전/오후 + 시간 입력칸 (pre: lv 또는 al) */
function halfBox(pre,l){const h=l.half||'am',t=l.hTime||HALF_DEF[h];const[a,b]=t.split('~');
  return `<div id="${pre}_hw" style="display:${l.kind==='반차'?'':'none'}"><div class="grid2"><label class="f"><span>오전 / 오후</span><select id="${pre}_half" onchange="halfPick('${pre}')"><option value="am" ${h==='am'?'selected':''}>오전 반차</option><option value="pm" ${h==='pm'?'selected':''}>오후 반차</option></select></label>
  <label class="f"><span>반차 시간</span><div class="row" style="gap:4px;flex-wrap:nowrap"><input id="${pre}_hs" type="time" value="${a||''}"><span>~</span><input id="${pre}_he" type="time" value="${b||''}"></div></label></div></div>`;}
function halfPick(pre){const h=document.getElementById(pre+'_half').value;const[a,b]=HALF_DEF[h].split('~');document.getElementById(pre+'_hs').value=a;document.getElementById(pre+'_he').value=b;}
function halfVal(pre,kind){if(kind!=='반차')return {half:'',hTime:''};const g=k=>document.getElementById(pre+k).value;return {half:g('_half'),hTime:g('_hs')+'~'+g('_he')};}
/* 날짜에 걸린 승인 휴가 (월간 출근부 표시용) */
function leaveOn(wid,ds){return (S.leaves||[]).find(l=>l.workerId===wid&&l.status==='approved'&&l.kind!=='발생조정'&&l.kind!=='기존사용(이관)'&&l.start<=ds&&(l.end||l.start)>=ds);}
const lvShort=k=>({연차:'연',반차:'반',병가:'병',기타:'기'}[k]||'휴');

/* 검증 (시제품·운영판 공통 규칙) */
function lvCheck(p,admin){
  const kinds=admin?LV_ADMIN_KINDS:LV_KINDS;
  if(kinds.indexOf(p.kind)<0)return '사용 구분을 선택하세요.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(p.start||''))return '사용 시작일을 입력하세요.';
  if(p.kind==='반차'&&!HALF_KO[p.half]&&admin){p.end=p.start;p.days=0.5;p.half='';p.hTime='';}else if(p.kind==='반차'){p.end=p.start;p.days=0.5;if(!HALF_KO[p.half])return '반차는 오전/오후를 선택하세요.';const t=String(p.hTime||HALF_DEF[p.half]),m=t.match(/^(\d{2}):(\d{2})~(\d{2}):(\d{2})$/);if(!m||m[1]+m[2]>=m[3]+m[4])return '반차 시간을 확인하세요 (예: 08:00~12:00).';p.hTime=t;}else{p.half='';p.hTime='';}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(p.end||''))p.end=p.start;
  if(p.end<p.start)return '종료일이 시작일보다 빠릅니다.';
  const d=Number(p.days);
  if(!isFinite(d)||Math.round(d*2)!==d*2)return '사용일수는 0.5일 단위 숫자로 입력하세요.';
  if(p.kind==='발생조정'){if(d===0)return '조정일수를 입력하세요 (가산은 +, 차감은 −).';}
  else{if(d<=0)return '사용일수를 확인하세요.';
    const cal=Math.round((new Date(p.end+'T12:00:00Z')-new Date(p.start+'T12:00:00Z'))/864e5)+1;
    if(p.kind!=='기존사용(이관)'&&d>cal)return '사용일수가 기간(달력 '+cal+'일)보다 많습니다.';}
  return null;
}
function lvOverlap(list,wid,s,e,exceptId,half){return (list||[]).find(l=>l.workerId===wid&&l.id!==exceptId&&(l.status==='pending'||l.status==='approved')&&LV_KINDS.indexOf(l.kind)>=0&&l.start<=e&&(l.end||l.start)>=s&&!(half&&l.kind==='반차'&&l.half&&l.half!==half));}

/* 시제품용 처리 — 운영판에서는 lvDo가 서버 호출로 바뀝니다 */
const LV={
  apply(p){const me=W(ses.uid);const er=lvCheck(p,false);if(er)return er;
    if(p.start<ymdAdd(today(),0,0,-30))return '30일 이전 날짜는 관리자에게 등록을 요청하세요.';
    const o=lvOverlap(S.leaves,me.id,p.start,p.end,'',p.kind==='반차'?p.half:'');if(o)return '이미 신청된 휴가와 날짜가 겹칩니다 ('+lvLabel(o)+').';
    S.leaves.push({id:uid(),workerId:me.id,kind:p.kind,start:p.start,end:p.end,days:Number(p.days),half:p.half||'',hTime:p.hTime||'',reason:String(p.reason||''),status:'pending',createdAt:stamp(),decidedBy:'',decidedAt:'',rejectReason:'',history:[{at:stamp(),by:me.id,action:'신청',detail:''}]});
    logG(me.id,'연차 신청',`${me.name} ${p.kind} ${lvLabel(p)} (${fmtD(p.days)}일)`);return null;},
  cancel(p){const l=S.leaves.find(x=>x.id===p.id&&x.workerId===ses.uid);if(!l||l.status!=='pending')return '승인 대기 중인 신청만 취소할 수 있습니다.';
    l.status='cancelled';l.history.push({at:stamp(),by:ses.uid,action:'취소',detail:''});logG(ses.uid,'연차 취소',`${W(ses.uid).name} ${l.kind} ${lvLabel(l)}`);return null;},
  decide(p){const l=S.leaves.find(x=>x.id===p.id);if(!l||l.status!=='pending')return '승인 대기 중인 신청이 아닙니다.';
    if(p.status==='rejected'&&!(p.reason||'').trim())return '반려 사유를 입력하세요.';
    l.status=p.status;l.decidedBy=ses.uid;l.decidedAt=stamp();l.rejectReason=p.status==='rejected'?p.reason:'';
    l.history.push({at:stamp(),by:ses.uid,action:LSTATUS[p.status],detail:l.rejectReason});
    logG(ses.uid,'연차 '+LSTATUS[p.status],`${W(l.workerId).name} ${l.kind} ${lvLabel(l)}${l.rejectReason?' — '+l.rejectReason:''}`);return null;},
  save(p){const d=p.data;if(!W(d.workerId).id)return '근로자를 선택하세요.';const er=lvCheck(d,true);if(er)return er;
    if(LV_KINDS.indexOf(d.kind)>=0){const o=lvOverlap(S.leaves,d.workerId,d.start,d.end,p.id,d.kind==='반차'?d.half:'');if(o)return '같은 날짜에 이미 휴가가 있습니다 ('+lvLabel(o)+').';}
    if(p.id){const l=S.leaves.find(x=>x.id===p.id);if(!l)return '기록을 찾을 수 없습니다.';const before=`${l.kind} ${lvLabel(l)} ${fmtD(l.days)}일`;
      Object.assign(l,{workerId:d.workerId,kind:d.kind,start:d.start,end:d.end,days:Number(d.days),half:d.half||'',hTime:d.hTime||'',reason:d.reason||''});
      l.history.push({at:stamp(),by:ses.uid,action:'관리자 수정',detail:before+' → '+`${l.kind} ${lvLabel(l)} ${fmtD(l.days)}일`});logG(ses.uid,'연차 수정',`${W(l.workerId).name} ${before} → ${l.kind} ${lvLabel(l)} ${fmtD(l.days)}일`);}
    else{S.leaves.push({id:uid(),workerId:d.workerId,kind:d.kind,start:d.start,end:d.end,days:Number(d.days),half:d.half||'',hTime:d.hTime||'',reason:d.reason||'',status:'approved',createdAt:stamp(),decidedBy:ses.uid,decidedAt:stamp(),rejectReason:'',history:[{at:stamp(),by:ses.uid,action:'관리자 등록',detail:''}]});
      logG(ses.uid,'연차 등록',`${W(d.workerId).name} ${d.kind} ${lvLabel(d)} ${fmtD(d.days)}일`);}
    return null;},
  del(p){const l=S.leaves.find(x=>x.id===p.id);if(!l)return '기록을 찾을 수 없습니다.';S.leaves=S.leaves.filter(x=>x.id!==p.id);logG(ses.uid,'연차 삭제',`${W(l.workerId).name} ${l.kind} ${lvLabel(l)} ${fmtD(l.days)}일 (${LSTATUS[l.status]})`);return null;},
  import(p){let n=0;(p.rows||[]).forEach(r=>{if(S.leaves.some(l=>l.workerId===r.workerId&&l.start===r.start&&l.kind===r.kind&&l.status!=='cancelled'))return;
      S.leaves.push({id:uid(),workerId:r.workerId,kind:r.kind,start:r.start,end:r.end,days:Number(r.days),reason:r.reason||'',status:'approved',createdAt:stamp(),decidedBy:ses.uid,decidedAt:stamp(),rejectReason:'',history:[{at:stamp(),by:ses.uid,action:'구글폼 이관',detail:''}]});n++;});
    logG(ses.uid,'연차 이관',`구글 폼 기록 ${n}건 가져오기`);return{n};}
};
async function lvDo(op,p,okMsg){const r=LV[op](p);if(typeof r==='string'){alertBox('처리하지 못했습니다',[r]);return null;}save();closeModal();render();if(okMsg)toast(okMsg);return r||{};}

/* ----- 근로자: 연차 탭 ----- */
function vMyLeave(me){
  const L=leaveSum(me,today(),S.leaves);
  let h='';
  if(!L)return '<div class="card"><p class="mute">입사일이 등록되지 않아 연차를 계산할 수 없습니다. 관리자에게 문의하세요.</p></div>';
  h+=`<div class="kpi"><div class="k"><span>잔여 연차</span><b style="color:var(--pri)">${fmtD(L.remain)}일</b></div><div class="k"><span>발생</span><b>${fmtD(L.accr)}일</b></div><div class="k"><span>사용</span><b>${fmtD(L.used)}일</b></div><div class="k"><span>승인 대기</span><b>${fmtD(L.pend)}일</b></div></div>
  <p class="mute" style="margin-top:-6px">연차 기간 ${L.start} ~ ${ymdAdd(L.end,0,0,-1)} · ${L.n===0?'입사 1년 미만 (1개월 개근마다 1일 발생, 최대 11일)':'근속 '+L.n+'년차'}${L.adj?` · 조정 ${L.adj>0?'+':''}${fmtD(L.adj)}일 포함`:''}</p>`;
  const t=today();
  h+=`<div class="card"><h3>연차 사용 신청</h3>
  <div class="grid2"><label class="f"><span>사용 구분</span><select id="lv_kind" onchange="lvCalc()">${LV_KINDS.map(k=>`<option value="${k}">${k}</option>`).join('')}</select></label>
  <label class="f"><span>사용일수 (자동 계산, 수정 가능)</span><input id="lv_days" inputmode="decimal" value="${weekdays(t,t)}"></label>
  <label class="f"><span>사용 시작일</span><input id="lv_s" type="date" value="${t}" onchange="lvCalc()"></label>
  <label class="f" id="lv_ew"><span>사용 종료일</span><input id="lv_e" type="date" value="${t}" onchange="lvCalc()"></label></div>
  ${halfBox('lv',{kind:'연차'})}
  <label class="f"><span>휴가 사유 (선택)</span><input id="lv_reason" maxlength="200"></label>
  <p class="mute" style="margin-top:0">사용일수는 토·일을 빼고 계산합니다. 공휴일이 끼어 있으면 직접 고쳐 주세요. 반차는 0.5일이며, 병가·기타도 연차에서 차감됩니다.</p>
  <div class="row"><span class="sp"></span><button class="btn pri" onclick="lvApply()">신청하기</button></div></div>`;
  h+=leaveCalCard();
  const mine=(S.leaves||[]).filter(l=>l.workerId===me.id).sort((a,b)=>b.start.localeCompare(a.start));
  h+=`<div class="card"><h3>내 연차 신청 내역</h3><div class="tbl-wrap"><table class="nw"><tr><th>사용일</th><th>구분</th><th>일수</th><th>상태</th><th></th></tr>`;
  if(!mine.length)h+=`<tr><td colspan="5" class="mute">신청 내역이 없습니다.</td></tr>`;
  mine.forEach(l=>{h+=`<tr><td>${esc(lvLabel(l))}</td><td>${esc(l.kind)}</td><td>${fmtD(l.days)}일</td><td>${lvChip(l.status)}${l.status==='rejected'&&l.rejectReason?`<div class="mute" style="white-space:normal">사유: ${esc(l.rejectReason)}</div>`:''}</td><td>${l.status==='pending'?`<button class="btn sm" onclick="lvCancel('${l.id}')">취소</button>`:''}</td></tr>`;});
  return h+'</table></div></div>';
}
function lvCalc(){const k=document.getElementById('lv_kind').value,s=document.getElementById('lv_s'),e=document.getElementById('lv_e'),d=document.getElementById('lv_days'),ew=document.getElementById('lv_ew');
  document.getElementById('lv_hw').style.display=k==='반차'?'':'none';
  if(k==='반차'){e.value=s.value;ew.style.display='none';d.value='0.5';d.disabled=true;}
  else{ew.style.display='';d.disabled=false;if(e.value<s.value)e.value=s.value;d.value=String(weekdays(s.value,e.value));}}
async function lvApply(){
  const g=k=>document.getElementById(k).value.trim();
  const p=Object.assign({kind:g('lv_kind'),start:g('lv_s'),end:g('lv_e'),days:g('lv_days'),reason:g('lv_reason')},halfVal('lv',g('lv_kind')));
  const er=lvCheck(p,false);if(er){toast(er);return;}
  const me=W(ses.uid),L=leaveSum(me,today(),S.leaves);
  if(L&&Number(p.days)>L.remain-L.pend&&!(await confirmBox(`신청 일수(${fmtD(p.days)}일)가 남은 연차(${fmtD(L.remain-L.pend)}일, 승인 대기 제외)보다 많습니다.\n그래도 신청할까요?`,'신청')))return;
  lvDo('apply',p,'연차를 신청했습니다. 관리자 승인 후 확정됩니다.');
}
async function lvCancel(id){if(!(await confirmBox('이 연차 신청을 취소할까요?','신청 취소')))return;lvDo('cancel',{id},'취소했습니다.');}

function alCalc(){const k=document.getElementById('al_k').value,s=document.getElementById('al_s'),e=document.getElementById('al_e'),d=document.getElementById('al_d');document.getElementById('al_hw').style.display=k==='반차'?'':'none';

let lvImp=[];
function aLvImport(){lvImp=[];openModal(`<div class="mbox"><div class="row"><h2 style="margin:0">구글 폼 연차 기록 가져오기</h2><span class="sp"></span><button class="btn sm" onclick="closeModal()">닫기 ✕</button></div>

  <textarea id="li_t" rows="7" placeholder="타임스탬프	이름	부서명 / 직위	사용 구분	사용일수	사용 시작일	사용 종료일	휴가사유	결재상태"></textarea>

function parseDateK(v){v=String(v||'').trim();let m;
  if((m=/^(\d{4})[-./\s]+(\d{1,2})[-./\s]+(\d{1,2})/.exec(v)))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(v)))return m[3]+'-'+pad(m[1])+'-'+pad(m[2]);return '';}
function lvPreview(){
  const lines=document.getElementById('li_t').value.split(/\r?\n/).filter(x=>x.trim());
  const box=document.getElementById('li_p');if(lines.length<2){box.innerHTML='<div class="warnbox">제목 행과 내용 행을 함께 붙여넣어 주세요.</div>';return;}
  const H=lines[0].split('\t').map(x=>x.trim());const col=(...ks)=>H.findIndex(h=>ks.some(k=>h.replace(/\s/g,'').includes(k)));
  const ci={name:col('이름','성명'),kind:col('사용구분','구분'),days:col('사용일수','일수'),s:col('시작일','시작'),e:col('종료일','종료'),r:col('사유'),st:col('결재상태','결재','상태')};
  if(ci.name<0||ci.s<0){box.innerHTML='<div class="badbox">제목 행에서 "이름"과 "사용 시작일" 칸을 찾지 못했습니다. 제목 행까지 함께 복사했는지 확인하세요.</div>';return;}
  const skipRej=document.getElementById('li_rej').checked;
  lvImp=lines.slice(1).map(L=>{const c=L.split('\t');const g=i=>i>=0?(c[i]||'').trim():'';
    const name=g(ci.name),ws=S.workers.filter(w=>w.name===name);let kind=g(ci.kind)||'연차';kind=LV_KINDS.find(k=>kind.includes(k))||'기타';
    const s=parseDateK(g(ci.s)),e=parseDateK(g(ci.e))||s;let days=parseFloat(String(g(ci.days)).replace(/[^\d.]/g,''));
    if(!isFinite(days)||days<=0)days=kind==='반차'?0.5:weekdays(s,e);
    const st=g(ci.st);let note='',ok=true;
    if(!ws.length){ok=false;note='근로자 없음';}else if(ws.length>1){ok=false;note='동명이인 '+ws.length+'명';}
    else if(!s){ok=false;note='날짜 형식 확인';}else if(skipRej&&st.includes('반려')){ok=false;note='반려 건 제외';}
    else if(S.leaves.some(l=>l.workerId===ws[0].id&&l.start===s&&l.kind===kind&&l.status!=='cancelled')){ok=false;note='이미 있음';}
    return{ok,note,name,workerId:ws.length===1?ws[0].id:'',kind,start:s,end:e<s?s:e,days:kind==='반차'?0.5:days,reason:g(ci.r),st};});
  const okN=lvImp.filter(x=>x.ok).length;
  box.innerHTML=`<div class="tbl-wrap" style="margin-top:10px;max-height:300px;overflow:auto"><table class="nw"><tr><th>가져오기</th><th>이름</th><th>구분</th><th>사용일</th><th>일수</th><th>결재상태</th><th>비고</th></tr>${lvImp.map(x=>`<tr><td>${x.ok?'<span class="chip st-ok">가져옴</span>':'<span class="chip c-out">제외</span>'}</td><td>${esc(x.name)}</td><td>${esc(x.kind)}</td><td>${esc(x.start===x.end?x.start:x.start+' ~ '+x.end)}</td><td>${fmtD(x.days)}</td><td>${esc(x.st)||'-'}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div>
  <div class="row" style="margin-top:10px"><span class="mute">${okN}건을 "승인" 상태로 가져옵니다. 근로자 이름이 출근부에 먼저 등록되어 있어야 합니다.</span><span class="sp"></span><button class="btn pri" ${okN?'':'disabled'} onclick="lvImportDo()">${okN}건 가져오기</button></div>`;}

function expLeaveCsv(){const rows=[['소속','형태','이름','입사일','근속(년)','연차기간 시작','연차기간 끝','발생','조정','사용','승인대기','잔여']];

const I18M={};I18.forEach(([k,vi,en])=>{I18M[k]={vi,en};});
const I18PS=I18P.slice().sort((a,b)=>b[0].length-a[0].length);

  for(const [re,fn] of I18R){const m=re.exec(c);if(m)return fn(m);}
  return trPhr(c);}
function trLine(s){if(!/[가-힣]/.test(s))return s;const lead=s.match(/^\s*/)[0],tail=s.match(/\s*$/)[0];let core=s.trim();
  const b=/^(·|•|-)\s+/.exec(core);const pre=b?b[0]:'';if(pre)core=core.slice(pre.length);
  return lead+pre+trCore(core.replace(/\s+/g,' '))+tail;}

function langSet(l){LANG=l;try{localStorage.setItem(LANG_KEY,l);}catch(e){}document.documentElement.lang=l;render();}

  const wrap=a.querySelector('.wrap');if(wrap){const d=document.createElement('div');d.className='lang-row';d.appendChild(sel);wrap.insertBefore(d,wrap.firstChild);}}

var TK='goshen_tok';
function tokGet(){try{return localStorage.getItem(TK)||sessionStorage.getItem(TK)||'';}catch(e){return TOKEN;}}
function tokSet(t,keep){TOKEN=t||'';try{localStorage.removeItem(TK);sessionStorage.removeItem(TK);if(t)(keep?localStorage:sessionStorage).setItem(TK,t);}catch(e){}}
/* 속도: 서버가 바뀐 항목만 보내면 나머지는 직전 것을 그대로 씀 */
var ST_H=null,ST_K={};
function stMerge(st){var h=st.__h;if(!h)return;delete st.__h;var nh={};
  Object.keys(h).forEach(function(k){if(k in st){ST_K[k]=JSON.stringify(st[k]);nh[k]=h[k];}else if(ST_K[k]!=null){st[k]=JSON.parse(ST_K[k]);nh[k]=h[k];}});
  ST_H=st.__part?Object.assign({},ST_H||{},nh):nh;}   /* 일부만 온 경우: 나머지 지문은 그대로 */
/* 출근 몰림 대비: 출퇴근은 같은 요청번호로 최대 3번 자동 재시도 (서버가 중복 처리를 막음) */
function call(op,p){
  if(op!=='check')return call1(op,p);
  p=p||{};if(!p.rid)p.rid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  var tries=0;
  var go=function(){return call1(op,p).catch(function(e){var m=String(e&&e.message||e);
    var retry=!e.relogin&&tries<5&&(e.busy||/사용자가 많아|응답이 늦습니다|인터넷 연결|서버 연결 오류|응답을 읽지/.test(m));
    if(!retry)throw e;tries++;busyMsg('사람이 많아 잠시 기다리는 중… ('+tries+'/5)');
    return new Promise(function(r){setTimeout(r,1500+Math.random()*2500);}).then(go);});};
  return go().finally(function(){busyMsg('');});
}
function busyMsg(t){if(typeof CK_ON!=='undefined'&&CK_ON&&t){ckBar('⏳ '+t);return;}var b=document.getElementById('busy');if(!b)return;var d=b.querySelector('.bmsg');if(!d){d=document.createElement('div');d.className='bmsg';d.style.cssText='font-size:12px;color:#666;margin-top:6px';b.firstChild.appendChild(d);}d.textContent=t;}
/* 구글 서버가 가끔(약 10회 중 1번) 응답 없이 멈춤 → 짧게 기다렸다가 같은 요청번호(rid)로 다시 보냄. 서버가 같은 번호는 한 번만 처리 */
var READ_OPS={boot:1,qrInfo:1,records:1,roster_permitGet:1},LONG_OPS={calList:1,roster_permitUp:1,qual_ocr:1,comp_fileUp:1,comp_get:1,form_up:1,form_get:1,buy_tpl:1,car_fileUp:1,car_fileGet:1,qual_fileGet:1};
function call1(op,p){if(LONG_OPS[op])return call0(op,p,'',op==='calList'?60000:120000);
  const rid=READ_OPS[op]?'':Date.now().toString(36)+Math.random().toString(36).slice(2,8),to=op==='check'?25000:READ_OPS[op]?12000:20000;let n=0;
  let nb=0;
  const go=()=>call0(op,p,rid,to).catch(e=>{const m=String(e&&e.message||e);if(e&&e.relogin)throw e;
    if(e&&e.busy){if(op==='check'||nb>=4)throw e;nb++;busyMsg('사람이 많아 잠시 기다리는 중… ('+nb+'/4)');return new Promise(r=>setTimeout(r,1500+Math.random()*2500)).then(go);}
    if(n<2&&/응답이 늦습니다|인터넷 연결|서버 연결 오류|응답을 읽지/.test(m)){n++;if(op!=='check')busyMsg('서버 응답이 늦어 다시 보내는 중… ('+n+'/2)');return new Promise(r=>setTimeout(r,500)).then(go);}throw e;});
  return go().finally(()=>{if(op!=='check')busyMsg('');});}
function call0(op,p,rid,toMs){
  if(BOOT.api){ /* 외부 호스팅 화면: 구글 로그인 쿠키 없이 서버 호출 (계정 여러 개·브라우저 무관) */
    const ac=(typeof AbortController!=='undefined')?new AbortController():null;const tm=setTimeout(()=>{if(ac)ac.abort();},toMs||30000);
    return fetch(BOOT.api,{method:'POST',credentials:'omit',redirect:'follow',cache:'no-store',signal:ac?ac.signal:undefined,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({t:TOKEN,op:op,p:p||{},h:ST_H,rid:rid||''})})
      .finally(()=>clearTimeout(tm))
      .then(r=>{if(!r.ok)throw new Error('서버 연결 오류 ('+r.status+')');return r.text();})
      .then(tx=>{let r;try{r=JSON.parse(tx);}catch(e){throw new Error('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도해 주세요.');}
        if(r&&r.dupBig){return call0('boot',{},'',12000).then(b=>{if(b.state)applyState(b.state);return {};});}if(r&&r.error){const e=new Error(r.error);e.relogin=!!r.relogin;e.busy=!!r.busy;throw e;}if(r&&r.state)stMerge(r.state);return r||{};},
        e=>{if(e&&e.name==='AbortError')throw new Error('서버 응답이 늦습니다. 잠시 후 다시 눌러 주세요.');throw (e&&e.message&&e.message.indexOf('서버')===0)?e:new Error('인터넷 연결을 확인해 주세요.\n('+((e&&(e.name+': '+e.message))||e)+')');});
  }
  return new Promise((res,rej)=>{google.script.run.withSuccessHandler(r=>{if(r&&r.error){const e=new Error(r.error);e.relogin=!!r.relogin;rej(e);}else res(r||{});}).withFailureHandler(e=>rej(new Error((e&&e.message)||String(e)))).api(TOKEN,op,p||{});});}
var busyN=0;
function busy(on){busyN+=on?1:-1;let b=document.getElementById('busy');if(!b){b=document.createElement('div');b.id='busy';b.style.cssText='position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:80;display:none;align-items:center;justify-content:center';b.innerHTML='<div style="background:#fff;border:1px solid #e1e5eb;border-radius:12px;padding:16px 22px;text-align:center"><div class="spin"></div>처리 중…</div>';document.body.appendChild(b);}b.style.display=busyN>0?'flex':'none';}
function applyState(st){
  if(st&&st.__part){Object.keys(st).forEach(function(k){if(k!=='__part'&&k!=='me'&&k!=='perms'&&k!=='today')S[k]=st[k]||[];});return;}   /* 바뀐 부분만 반영 */
  if(st.forms)S.forms=st.forms;else if(!st.__part)S.forms=S.forms||[];S.leaves=st.leaves||[];S.leaveCal=st.leaveCal||[];S.gisung=st.gisung||[];S.safety=st.safety||[];S.workers=st.workers;S.projects=st.projects;S.spots=st.spots;S.records=st.records;S.log=st.log||[];S.settings=st.settings;S.recFrom=st.recFrom;S.rosters=st.rosters||[];S.cars=st.cars||[];S.posts=st.posts||[];S.prework=st.prework||[];S.compdocs=st.compdocs||[];S.buys=st.buys||[];S.taxreqs=st.taxreqs||[];
  ses.uid=st.me.id;ses.setup=null;ses.setupW=null;
}
function failMsg(e){
  if(e&&e.relogin){tokSet('');ses.uid=null;closeModal();render();toast('다시 로그인해 주세요.');return;}
  alertBox('처리하지 못했습니다',String(e&&e.message||e).split('\n'));
}
/* 서버 요청 → 상태 반영 → 화면 갱신 */
async function run(op,p,okMsg,keepModal){
  busy(true);
  try{const r=await call(op,p);if(r.state)applyState(r.state);if(!keepModal)closeModal();render();const m=r.msg||okMsg;if(m)toast(m);return r;}
  catch(e){failMsg(e);return null;}
  finally{busy(false);}
}

/* ----- 위치: 실제 GPS만 사용 ----- */
var GPS_LAST=null,GPS_W=null;
function gpsWarm(){if(!navigator.geolocation||GPS_W!=null)return;try{GPS_W=navigator.geolocation.watchPosition(p=>{GPS_LAST={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),t:Date.now()};},()=>{},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});setTimeout(()=>{try{navigator.geolocation.clearWatch(GPS_W);}catch(e){}GPS_W=null;},180000);}catch(e){}}
getPos=function(){if(GPS_LAST&&Date.now()-GPS_LAST.t<20000&&GPS_LAST.acc!=null&&GPS_LAST.acc<=150)return Promise.resolve({lat:GPS_LAST.lat,lng:GPS_LAST.lng,acc:GPS_LAST.acc});   /* 미리 잡아 둔 최신 위치(20초 이내)면 바로 사용 */
  return getPos0();};
function getPos0(){return new Promise(res=>{
  if(!navigator.geolocation){res({lat:null,lng:null,acc:null});return;}
  let done=false;const t=setTimeout(()=>{if(!done){done=true;res({lat:null,lng:null,acc:null});}},12000);
  try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(t);res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)});},
    ()=>{if(done)return;done=true;clearTimeout(t);res({lat:null,lng:null,acc:null});},{enableHighAccuracy:true,timeout:10000,maximumAge:0});}
  catch(e){clearTimeout(t);res({lat:null,lng:null,acc:null});}
});}

/* 출퇴근 진행 표시: 화면을 가리지 않는 위쪽 띠 (누르자마자 반응) */
var CK_ON=false;
function ckBar(t,kind){let b=document.getElementById('ckbar');if(!t){if(b)b.remove();return;}if(!b){b=document.createElement('div');b.id='ckbar';b.style.cssText='position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:90;background:#1f2937;color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:92vw;text-align:center';document.body.appendChild(b);}b.style.background=kind==='ok'?'#15803d':kind==='bad'?'#b91c1c':'#1f2937';b.textContent=t;}
doCheck=async function(kind,dateArg,noConf){

  if(false&&!raw&&S.settings.qrOnly){alertBox('QR 코드로 출퇴근하세요',['휴게쉼터에 붙어 있는 QR 코드를 휴대폰 카메라로 촬영하면 출퇴근 화면이 열립니다.']);return;}
  const lb0=kind==='in'?'출근':'퇴근',tap=hm(new Date());CK_ON=true;

  const rec=recOf(ses.uid,dateArg||today());if(kind==='out'){clearTimeout(syncT);syncT=null;await syncP;}
  try{r=await call('check',{kind,date:dateArg||'',qr:raw,lat:pos.lat,lng:pos.lng,acc:pos.acc,entries:kind==='out'&&rec?rec.entries:undefined,autoEnd:kind==='out',submit:kind==='out'});}
  catch(e){CK_ON=false;ckBar(`⚠ ${lb0} 기록을 보내지 못했습니다 — 다시 눌러 주세요`,'bad');setTimeout(()=>ckBar(''),6000);failMsg(e);return;}

};

/* ----- 작업 내역 · 사후 입력 (자동 저장) ----- */
var syncT=null,syncDate=null,syncP=Promise.resolve();
function scheduleSync(){syncDate=curDate();clearTimeout(syncT);syncT=setTimeout(flushSync,700);}
function flushSync(){
  clearTimeout(syncT);syncT=null;const date=syncDate;if(!date)return syncP;
  const r=recOf(ses.uid,date);if(!r)return syncP;
  const p={date,entries:r.entries};
  if(date<today()||r.manual){p.manualIn=r.checkIn&&r.checkIn.lat!=null?undefined:(r.checkIn?r.checkIn.time:'');p.manualOut=r.checkOut&&r.checkOut.lat!=null?undefined:(r.checkOut?r.checkOut.time:'');if(r.checkOut&&r.checkOut.lat==null)p.manualOutDate=r.checkOut.date||date;p.manualReason=r.manualReason||'';}
  syncP=syncP.then(()=>call('saveDraft',p).then(x=>{const i=S.records.findIndex(y=>y.workerId===ses.uid&&y.date===date);if(i>=0&&x.record){S.records[i].id=x.record.id;if(x.record.checkIn)S.records[i].checkIn=x.record.checkIn;if(x.record.checkOut)S.records[i].checkOut=x.record.checkOut;}}).catch(e=>failMsg(e)));
  return syncP;
}

/* ----- 관리자: 출근 기록 ----- */
commitDraft=async function(newStatus){
  const r=draft;
  if(!r.workerId){toast('근로자를 선택하세요.');return;}
  const v=validate(r,true);
  if(newStatus!=='rejected'&&v.errors.length){toast('빨간색 항목을 먼저 수정하세요.');return;}
  if(newStatus==='rejected'&&!(r.rejectReason||'').trim()){toast('반려 사유를 입력하세요.');return;}
  const res=await run('saveRecord',{rec:{workerId:r.workerId,date:r.date,checkIn:r.checkIn?{time:r.checkIn.time,date:r.checkIn.date}:null,checkOut:r.checkOut?{time:r.checkOut.time,date:r.checkOut.date}:null,entries:r.entries,rejectReason:r.rejectReason||''},origId:draftOrig||'',newStatus:newStatus||null},null,true);
  if(res){closeModal();ui.sel.delete(draftOrig);render();}
};
bulkApprove=async function(){
  const ids=[...ui.sel];if(!ids.length)return;
  if(!(await confirmBox(`선택한 ${ids.length}건을 승인할까요?`,'승인')))return;
  const r=await run('bulkApprove',{ids});if(!r)return;ui.sel.clear();render();
  if(r.skip&&r.skip.length)alertBox(`${r.n}건 승인 · ${r.skip.length}건 제외 (입력 오류)`,r.skip);else toast(`${r.n}건 승인 완료`);
};
aDelete=async function(){
  const o=S.records.find(x=>x.id===draftOrig);if(!o)return;
  if(!(await confirmBox(`<b>${esc(W(o.workerId).name)} · ${fmtDay(o.date)}</b> 기록을 삭제할까요?\n\n삭제하면 복구할 수 없으며, 변경 이력에 삭제 사실과 내용이 남습니다.`,'삭제'))){renderAdminModal();return;}
  await run('deleteRecord',{id:o.id},'삭제했습니다.');ui.sel.delete(o.id);
};
/* 지난 기간 기록 불러오기 (월간 출근부·승인 관리) */
var loadingFrom={};
function ensureFrom(from){
  if(!from||!S.recFrom||from>=S.recFrom||loadingFrom[from])return false;
  loadingFrom[from]=1;
  call('records',{from,to:S.recFrom}).then(r=>{const have=new Set(S.records.map(x=>x.id));r.records.forEach(x=>{if(!have.has(x.id))S.records.push(x);});S.recFrom=from;delete loadingFrom[from];render();}).catch(e=>{delete loadingFrom[from];failMsg(e);});
  return true;
}
var _aMonth=aMonth,_aAppr=aAppr;
aMonth=function(){if(ensureFrom(ui.month+'-01'))return '<div class="card"><div class="spin"></div><p class="mute" style="text-align:center">지난 기록을 불러오는 중…</p></div>';return _aMonth();};
aAppr=function(){if(ensureFrom(ui.f.from))return '<div class="card"><div class="spin"></div><p class="mute" style="text-align:center">지난 기록을 불러오는 중…</p></div>';return _aAppr();};

  if(on){const pend=S.records.filter(r=>(r.status==='pending'||r.status==='draft')&&r.entries.some(e=>e.projectId===id)).length;
    if(!(await confirmBox(`<b>${esc(p.name)}</b> 공사를 완료 처리할까요?\n\n완료하면 근로자 드롭다운에서 사라지고, 지금까지의 기록은 그대로 보존됩니다.${pend?`\n\n※ 이 공사가 포함된 미승인 기록이 ${pend}건 있습니다. 승인 관리에서 확인하세요.`:''}`,'완료 처리')))return;}
  run('projectDone',{id,on});};
aProjDel=async function(id){const p=P(id);const has=(S.gisung||[]).some(g=>g.projectId===id&&(g.prev!==''||(g.m||[]).some(v=>v!==''&&v!=null)))||(S.safety||[]).some(x=>x.projectId===id&&(x.budget!==''||x.carry!==''||(x.m||[]).some(v=>v!==''&&v!=null)));if(!(await confirmBox(`${esc(p.name)} 공사를 삭제할까요?${has?'<br><b style="color:var(--bad)">기성준공·안전관리비 대장에 입력된 금액도 함께 지워지며 되돌릴 수 없습니다.</b>':''}`,'삭제')))return;run('deleteProject',{id});};

/* ----- 파일 저장: 인쇄용은 새 창, CSV는 구글 드라이브에 저장 ----- */
saveFile=async function(filename,data){
  if(filename.endsWith('.html')){
    let w=null;try{w=window.open('','_blank');}catch(e){}
    if(w){w.document.open();w.document.write(data);w.document.close();toast('새 창에서 열었습니다. 인쇄(Ctrl+P)하세요.');return;}
  }
  busy(true);
  try{const r=await call('exportFile',{name:filename,data});
    openModal(`<div class="mbox" style="max-width:460px"><h3>파일을 만들었습니다</h3><p class="mute">구글 드라이브 "전자출근부_내보내기" 폴더에 저장했습니다.</p><div class="row"><a class="btn pri" href="${esc(r.download)}" target="_blank" rel="noopener">내려받기</a><a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">드라이브에서 열기</a><span class="sp"></span><button class="btn" onclick="closeModal()">닫기</button></div></div>`);
  }catch(e){failMsg(e);}finally{busy(false);}
};
}
