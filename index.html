<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e1e5eb;--pri:#8d2d30;--pri2:#1b786e;--brand-r:#8d2d30;--brand-g:#1b786e;--ok:#1f8a4c;--warn:#b86e00;--bad:#c23b3b;--chip:#eef2f7}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.demo-banner{background:#fff4d6;color:#6d4a00;font-size:13px;padding:6px 16px;border-bottom:1px solid #f0dca0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:none;color:var(--pri2);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.top{background:#fff;color:var(--ink);padding:9px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--brand-r) 0 62%,var(--brand-g) 62% 100%) 1;box-shadow:0 1px 6px rgba(0,0,0,.06)}
@media(max-width:480px){.top{flex-wrap:wrap;row-gap:6px;padding:8px 10px;gap:6px}.top .btn.sm{padding:5px 8px;font-size:12.5px}.top select.lang-top{max-width:118px;font-size:12.5px}}   /* 휴대폰: 위쪽 버튼이 옆으로 넘치지 않게 */
.top .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.top .brand .logo{height:22px}
.top .brand .bt{padding-left:10px;border-left:1px solid var(--line)}
.top .btn{background:#fff;border-color:var(--line);color:var(--ink)}

.loginlogo{display:block;height:auto;width:min(260px,72%);margin:4px auto 14px}
@media(max-width:420px){.top .brand .bt{display:none}}
.sp{flex:1}
.wrap{max-width:1440px;margin:0 auto;padding:16px}
.wrap.narrow{max-width:560px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.big{width:100%;padding:22px;font-size:21px;font-weight:700;border-radius:14px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;background:#fff;border-radius:10px 10px 0 0}
.tab{padding:11px 14px;border:none;background:none;font:inherit;color:#374151;font-weight:500;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--pri);border-color:var(--pri);font-weight:700}
.tab .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{background:#f7f9fb;font-weight:500;color:var(--mute);white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.nw th,.nw td{white-space:nowrap;vertical-align:middle;padding:7px 5px;font-size:13.5px}
.nw .chip{font-size:11.5px;padding:1px 6px}
.nw td .btn{margin:1px 0}
.roster .rline{display:flex;gap:10px;margin-top:5px;font-size:14px}.roster .rline>span:first-child{flex:0 0 78px;color:var(--mute)}.roster .rline.sub>span:first-child{padding-left:14px}
.roster.mine{border-left:4px solid var(--pri2);background:#f5fbfa}.mename{background:#d9efe9;border-radius:4px;padding:0 3px;font-weight:700}
.rboard{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}.rpool{position:sticky;top:64px}.rcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.rcols .card{margin-bottom:0}
@media(max-width:820px){.rboard{grid-template-columns:1fr}.rpool{position:static}}
.rcard.draft{border:2px dashed #e0b25a;background:#fffdf6}.rzl i{display:block;font-style:normal;font-size:10px;color:var(--pri2)}.dchip .qs{margin-left:4px;font-size:10px;color:var(--pri2);font-weight:700}.qchip{background:#e3f2ee;color:#155e55;font-size:11px}
.dchip.ext{background:#fff7e8;border-color:#f0d3a8;cursor:default}.dchip.ext small{margin-left:4px;font-size:10px;color:#9a6a12}.dchip.ext button{border:none;background:none;color:var(--bad);cursor:pointer;padding:0 0 0 4px}
.qtog{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}.qtog button{font-size:11px;padding:1px 6px;border-radius:999px;border:1px solid #d6dbe3;background:#fff;color:#9aa3ad;cursor:pointer}.qtog button.q-ok{background:#1b786e;border-color:#1b786e;color:#fff}.qtog button.q-soon{background:#e8a33d;border-color:#e8a33d;color:#fff}.qtog button.q-expired{background:#c23b3b;border-color:#c23b3b;color:#fff;text-decoration:line-through}
.dchip.also{background:#eef5f3;border-style:dashed;cursor:default}.dchip.also small{margin-left:3px;font-size:10px;color:var(--pri2)}.dchip.also button{border:none;background:none;color:var(--bad);cursor:pointer;padding:0 0 0 3px}.alsobtn{font-size:11px;padding:1px 6px;border:1px dashed var(--pri2);border-radius:999px;background:#fff;color:var(--pri2);cursor:pointer}
.dzone{display:flex;flex-wrap:wrap;gap:5px;min-height:26px}.dchip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:13px;background:#fff;border:1px solid #cfd6df;cursor:grab;user-select:none;-webkit-user-select:none}
.dchip.v{background:#eef5f3;border-color:#bfe0d6}.dchip.warn{border-color:var(--bad);color:var(--bad)}.dchip.sel{outline:2px solid var(--pri);background:#fbeeee}.dchip.dragging{opacity:.4}
.rzone.rz{display:flex;gap:8px;align-items:flex-start;border:1px dashed #d6dbe3;border-radius:8px;padding:6px;margin-top:6px}.rzl{flex:0 0 30px;font-size:12px;color:var(--mute);padding-top:4px}
.rzone.over{background:#e9f6f2;border-color:var(--pri2)}.rzone.target{border-color:var(--pri);background:#fff8f8;cursor:pointer}.rpool.target{cursor:pointer}
.rrole{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.rrole>b{flex:0 0 34px}.rrole select{width:auto;min-width:140px}.rchips{display:flex;flex-wrap:wrap;gap:4px}
.rchip{background:#eef5f3;border:1px solid #cfe6df;font-size:13px}.rchip button{border:none;background:none;color:var(--bad);cursor:pointer;padding:0 0 0 4px;font-size:12px}
.reply{background:#f6f8fa;border-left:3px solid var(--pri2);padding:6px 10px;margin-top:6px;border-radius:4px;font-size:14px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--chip);white-space:nowrap;margin:1px 2px 1px 0}
.st-draft{background:#eef0f3;color:#55606e}.st-pend{background:#e6effb;color:var(--pri2)}.st-ok{background:#e3f4ea;color:var(--ok)}.st-bad{background:#fbe7e7;color:var(--bad)}
.c-in{background:#e3f4ea;color:var(--ok)}.c-out{background:#fff0dc;color:var(--warn)}.c-man{background:#eef0f3;color:#55606e}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd6df;border-radius:8px;width:100%;background:#fff;color:var(--ink)}
input:disabled,select:disabled,textarea:disabled{background:#f3f5f8}
input[type=checkbox]{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2fixed{grid-template-columns:1fr 1fr!important}
.codocs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.codoc{border:1px solid var(--line);border-radius:12px;padding:12px}.codoc.sel{border-color:var(--bad);background:#fff5f5}
label.f{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
label.f>span{display:block;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fafbfc}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:28px 10px}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:14px;max-width:820px;width:100%;padding:18px}

    return `QR 촬영: ${sn} · GPS ${c.inside?'일치':'불일치 (QR 장소에서 '+fmtDist(c.dist)+' 떨어짐)'}${c.inside?' ('+fmtDist(c.dist)+')':''}${c.method==='sim'?' [데모 위치]':''}`;}
  if(c.lat==null)return c.method==='admin'?'관리자 입력':c.method==='manual'?'수기 입력(위치정보 없음)':'위치 없음';
  return '위치 기록 '+c.lat+','+c.lng+(c.nearId?' · 가까운 현장: '+pname(c.nearId)+' ('+fmtDist(c.dist)+')':'');
}
function validate(r,isAdmin){
  const errors=[],warns=[];const es=r.entries||[];
  if(!es.length)errors.push('작업 내역을 1건 이상 입력하세요.');
  es.forEach((e,i)=>{
    const n=`작업 ${i+1}`;
    if(!e.projectId)errors.push(`${n}: 공사를 선택하세요.`);
    if(!(e.desc||'').trim()||(e.desc||'').trim().length<2)errors.push(`${n}: 작업내용을 입력하세요.`);
    const g=entryG(e);if(!g)errors.push(`${n}: 공수를 고르세요.`);else if(Math.round(g*2)!==g*2)errors.push(`${n}: 공수는 0.5 단위로 입력하세요.`);
  });
  if(totalG(r)>5)warns.push(`하루 공수 합계가 5를 넘습니다 (${fmtG(totalG(r))}). 확인하세요.`);
  if(!r.checkIn)(isAdmin?warns:errors).push('출근 기록이 없습니다.');
  if(!r.checkOut)(isAdmin?warns:errors).push(isAdmin?'퇴근 기록이 없습니다.':'퇴근 기록 후 승인 요청할 수 있습니다.');
  if(!isAdmin&&r.manual&&!(r.manualReason||'').trim())errors.push('사후 신청 사유를 입력하세요.');
  return{errors,warns};
}

/* ---------- GPS (실제 → 실패 시 데모 위치 선택) ---------- */
function getPos(spot){return new Promise(res=>{
  let done=false;const fb=()=>{if(done)return;done=true;simPos(spot).then(res);};
  if(!navigator.geolocation){fb();return;}
  const tmr=setTimeout(fb,7000);
  try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(tmr);res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),method:'gps'});},()=>{clearTimeout(tmr);fb();},{enableHighAccuracy:true,timeout:6000,maximumAge:0});}catch(e){clearTimeout(tmr);fb();}
});}
let simResolve=null;
let simTargets=[];
function simPos(spot){return new Promise(res=>{simResolve=res;
  simTargets=spot?[spot]:S.projects.filter(p=>p.active);
  openModal(`<div class="mbox" style="max-width:480px"><h3>📍 위치 선택 (데모 전용)</h3>
  <div class="infobox">이 미리보기 화면은 보안상 휴대폰 GPS를 쓸 수 없어 위치를 직접 고릅니다.<br>실제 운영 시스템에서는 버튼을 누르는 순간 휴대폰 GPS 좌표가 자동 기록됩니다.</div>
  ${simTargets.map((p,i)=>`<button class="btn" style="width:100%;margin-bottom:6px;text-align:left" onclick="simPick(${i})">${spot?'QR 장소에 실제로 있음':'현장 안'} — ${esc(p.name)}</button>`).join('')}
  <button class="btn bad" style="width:100%;margin-bottom:6px;text-align:left" onclick="simPick(-1)">${spot?'다른 곳에 있음 — QR 사진을 찍어 가서 쓴 경우':'현장 밖 — 등록된 현장에서 떨어진 곳'}</button>
  ${spot?'<button class="btn" style="width:100%;margin-bottom:6px;text-align:left" onclick="simPick(-2)">GPS 꺼짐·권한 거부</button>':''}
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="simPick(null)">취소</button></div></div>`);
});}
function simPick(i){const f=simResolve;simResolve=null;closeModal();if(i===null){f(null);return;}
  if(i===-2){f({lat:null,lng:null,acc:null,method:'nogps'});return;}
  const act=simTargets;let lat,lng;
  if(i<0){const p=act[0]||{lat:36.95,lng:126.7};lat=p.lat+0.035;lng=p.lng+0.02;}else{lat=act[i].lat+(Math.random()-0.5)*0.002;lng=act[i].lng+(Math.random()-0.5)*0.002;}
  f({lat,lng,acc:15,method:'sim'});}

async function saveFile(filename,data){
  let dl=null;
  try{if(typeof claude!=='undefined'&&claude.use)dl=await claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename,data});toast('파일을 저장했습니다: '+filename);return;}catch(e){if(e&&e.code==='declined'){toast('저장을 취소했습니다');return;}}}
  if(typeof claude==='undefined'){try{const u=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.csv')?'text/csv':'text/html'}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('파일을 저장했습니다');return;}catch(e){}}
  openModal(`<div class="mbox"><h3>파일 저장을 사용할 수 없는 화면입니다</h3><p class="mute">아래 내용을 복사해 메모장에 붙여넣고 ${esc(filename)} 으로 저장하세요.</p><textarea id="cpy" rows="12">${esc(data)}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('cpy').value).then(()=>toast('복사했습니다'),()=>toast('복사 실패 — 직접 선택해 복사하세요'))">복사</button><button class="btn pri" onclick="closeModal()">닫기</button></div></div>`);
}

function vLogin(){
  const demo=S.workers.slice().sort((a,b)=>(a.role==='admin'?-1:0)-(b.role==='admin'?-1:0));
  return `<div class="wrap narrow">${qr&&qr.spot?`<div class="infobox" style="margin-top:16px">📍 <b>${esc(qr.spot.name)}</b> QR로 접속했습니다.<br>로그인하면 바로 출퇴근 화면으로 이동합니다. ("로그인 유지"를 체크하면 다음부터는 QR 촬영만으로 바로 열립니다.)</div>`:''}<div class="card" style="margin-top:${qr&&qr.spot?'8':'20'}px"><span class="logo loginlogo" role="img" aria-label="GOSHEN ENG"></span><h2 style="text-align:center;margin-top:0">주식회사 고센이엔지 · 전자시스템</h2>
  ${(()=>{const e=brEnv();return e.good?'':`<div class="${e.inapp?'badbox':'warnbox'}" style="margin:10px 0">⚠ ${e.inapp?'앱 안의 브라우저(카카오톡 등)로 열려 있습니다. ⋮ 메뉴 → 「다른 브라우저로 열기」로 ':'이 사이트는 '}<b>${e.ios?'아이폰은 사파리':'안드로이드는 크롬'}</b>${e.inapp?'에서 여세요.':'에서 써야 위치·알림이 제대로 됩니다.'} <button class="linkbtn" onclick="appGuideModal()">설치 방법 보기</button></div>`;})()}
  <label class="f"><span>연락처 (휴대폰 번호 = 아이디, 숫자만)</span><input id="lg_phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01012345678" oninput="this.value=this.value.replace(/\\D/g,'')"></label>
  <label class="f"><span>비밀번호</span><input id="lg_pw" type="password" maxlength="20" placeholder="처음 로그인이면 비워 두고 로그인을 누르세요" onkeydown="if(event.key==='Enter')doLogin()"></label>
  <label class="row" style="margin-bottom:12px"><input type="checkbox" id="lg_keep" checked> 이 휴대폰에서 로그인 유지 (QR 촬영 시 바로 출퇴근)</label>
  <button type="button" class="btn pri" style="width:100%;padding:12px;touch-action:manipulation" onclick="doLogin()">로그인</button>
  <div class="row" style="margin-top:12px;justify-content:center"><span class="mute">처음 사용하시나요?</span><button class="btn" onclick="ses.signup=true;render()">가입 신청</button></div></div>${inAppBox()}
  ${qr||LIVE?'':`<div class="card"><h3>📷 QR 촬영 체험 (데모)</h3><p class="mute">실제로는 휴게쉼터의 QR을 휴대폰 카메라로 촬영하면 이 화면이 열립니다. 아래에서 촬영할 QR 장소를 고르세요.</p>${qrDemoBtns()}</div>`}
  ${LIVE?'':`<div class="card"><h3>데모 계정으로 바로 들어가기</h3><p class="mute">누르면 해당 계정으로 로그인합니다. (관리자 비밀번호 0000 / 근로자 1234 · <b>최정훈</b>은 최초 로그인 체험용)</p>
  <div class="demo-acc">${demo.map(w=>`<button onclick="quickLogin('${w.id}')"><b>${esc(w.name)}</b> ${w.role==='admin'?'<span class="chip st-pend">관리자</span>':''}${w.status==='퇴사'?'<span class="chip st-bad">퇴사</span>':''}${!w.pw?'<span class="chip c-out">첫 로그인 전</span>':(!w.consent?'<span class="chip">동의 전</span>':'')}<small>${esc(affLabel(w))} · ${w.type} · ${w.phone}</small></button>`).join('')}</div></div>`}</div>`;
}
/* 카카오톡·네이버 등 앱 안 브라우저: 문제 시 기본 브라우저로 열기 */
function inAppName(){const u=navigator.userAgent||'';return /KAKAOTALK/i.test(u)?'카카오톡':/NAVER\(inapp/i.test(u)?'네이버':/Instagram|FBAN|FBAV|Line\//i.test(u)?'앱':'';}
function inAppBox(){const n=inAppName();const ver=`<p class="mute" style="text-align:center;font-size:11px;margin:6px 0 0">화면 버전 ${APP_VER}</p>`;if(!n)return ver;
  const u=location.href,k='kakaotalk://web/openExternal?url='+encodeURIComponent(u);
  return `<div class="infobox" style="margin-top:10px">ℹ️ <b>${n} 안의 브라우저</b>로 열려 있습니다. 로그인 버튼이 반응하지 않으면 <b>기본 브라우저(사파리·크롬)</b>로 열어 주세요.<div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">${n==='카카오톡'?`<a class="btn pri" href="${k}">기본 브라우저로 열기</a>`:''}<button type="button" class="btn" onclick="copyUrl()">주소 복사</button></div></div>`+ver;}
function copyUrl(){const u=location.href;try{navigator.clipboard.writeText(u).then(()=>toast('주소를 복사했습니다. 사파리에 붙여넣으세요.'),()=>prompt('주소를 복사하세요',u));}catch(e){prompt('주소를 복사하세요',u);}}
function quickLogin(id){const w=W(id);document.getElementById('lg_phone').value=w.phone.replace(/\D/g,'');document.getElementById('lg_pw').value=w.pw||'';doLogin();}
function doLogin(){
  const ph=(document.getElementById('lg_phone').value||'').replace(/\D/g,''),pw=document.getElementById('lg_pw').value||'';
  const w=S.workers.find(x=>x.phone.replace(/\D/g,'')===ph);
  if(!w){toast('등록되지 않은 연락처입니다. 처음이면 아래 [가입 신청]을 눌러 주세요.');return;}
  if(w.status==='가입대기'){alertBox('가입 승인 대기 중입니다',['관리자가 승인하면 로그인할 수 있습니다.']);return;}
  if(w.status==='가입반려'){alertBox('가입 신청이 반려되었습니다',[(w.rejectReason?'사유: '+w.rejectReason:'관리자에게 문의하세요.'),'정보를 고쳐 다시 신청하려면 [가입 신청]을 눌러 주세요.']);return;}
  if(w.status==='퇴사'){alertBox('퇴사 처리된 계정입니다',['로그인할 수 없습니다. 과거 기록은 회사에 보존되어 있으며, 확인이 필요하면 관리자에게 문의하세요.']);return;}
  if(!w.pw){const kp=document.getElementById('lg_keep');ses.keep=!!(kp&&kp.checked);ses.setup=w.id;render();return;}
  if(w.pw!==pw){toast('비밀번호가 일치하지 않습니다.');return;}
  const kp=document.getElementById('lg_keep');keepSet(kp&&kp.checked?w.id:'');
  ses.uid=w.id;ui.wTab='today';ui.aTab='dash';ui.asWorker=false;render();
}
function logout(){if(typeof ST_K!=='undefined'){ST_K={};ST_H=null;}closeModal();ses.uid=null;ses.setup=null;keepSet('');render();}
function qrDemoBtns(){const ss=S.spots.filter(s=>s.active);if(!ss.length)return '<p class="mute">등록된 QR 장소가 없습니다.</p>';
  return ss.map(s=>`<button class="btn" style="width:100%;margin-bottom:6px;text-align:left" onclick="qrScan('${s.id}')">📷 ${esc(s.name)} QR 촬영</button>`).join('');}
function qrScan(id){qr={spot:SP(id)};render();window.scrollTo(0,0);}
function openRecs(wid){const from=daysAgo(2);return S.records.filter(r=>r.workerId===wid&&r.date>=from&&r.checkIn&&!r.checkOut&&editable(r)).sort((a,b)=>b.date.localeCompare(a.date));}
const wdBox=(d,lb)=>`<div class="workday">${lb||'근무일'} <b>${fmtDay(d)}</b></div>`;
function vQR(me){
  const s=qr.spot,td=today(),y=daysAgo(1),r=recOf(me.id,td),opens=openRecs(me.id);
  if(ui.qrOut&&!opens.find(o=>o.date===ui.qrOut))ui.qrOut=null;
  const outDate=ui.qrOut||(r&&r.checkIn&&!r.checkOut?td:null);
  let h=`<div class="top"><div class="brand"><span class="logo" role="img" aria-label="GOSHEN ENG"></span><span class="bt">전자시스템</span></div><span class="sp"></span><button class="btn sm" onclick="qr=null;ui.qrOut=null;render()">닫기</button></div><div class="wrap narrow">
  <div class="card" style="margin-top:6px;text-align:center"><div class="mute">📍 QR 촬영 장소</div><h2 style="margin:4px 0">${esc(s.name)}</h2>
  <div class="mute">${esc(me.name)} 님 · ${esc(affLabel(me))}</div><div style="font-size:34px;font-weight:700;margin:10px 0" id="clock">${hm(new Date())}</div><div class="mute">${fmtDay(td)}</div>`;
  if(outDate){

function liveOnly(op,p,msg){if(!LIVE){toast('시제품에서는 저장되지 않습니다.');return Promise.resolve(null);}return window.liveRun(op,p,msg);}
const nextWork=d=>{let x=addDaysC(d,1);while(dow(x)===0)x=addDaysC(x,1);return x;};
const ddays=ds=>{if(!ds)return null;const a=new Date(ds+'T12:00:00'),b=new Date(today()+'T12:00:00');return Math.round((a-b)/864e5);};
function ddChip(ds){const n=ddays(ds);if(n===null)return '<span class="mute">-</span>';const cls=n<0?'st-bad':n<=30?'st-pend':'st-ok';return `${ds} <span class="chip ${cls}">${n<0?'만료 '+(-n)+'일':n===0?'오늘':'D-'+n}</span>`;}
const carOf=id=>(S.cars||[]).find(c=>c.id===id);
const carLabel=c=>c?`${c.model||''} ${c.plate}`.trim():'';
/* 밀폐는 자주 안 써서 필요할 때만 칸을 펼침 (현장 상황에 맞게) */
const OPT_ROLES=['밀폐'];
const rolesFor=(r,open)=>ROLES.filter(ro=>OPT_ROLES.indexOf(ro)<0||open||(r.members||[]).some(m=>m.role===ro));
const qExpOf=(w,q)=>((w&&w.qualExp)||{})[q]||'';
const hasQ=(w,q,date)=>String((w&&w.quals)||'').split(',').indexOf(q)>=0&&!(date&&qExpOf(w,q)&&qExpOf(w,q)<date);
/* 자격 상태: none / ok / soon(2주 이내) / expired */
function qState(w,q){if(!hasQ(w,q))return 'none';const e=qExpOf(w,q);if(!e)return 'ok';const n=ddays(e);return n<0?'expired':n<=QWARN?'soon':'ok';}
/* 근로자에게 보여줄 알림 목록 */
function qualAlerts(w){const L=[];QUALS.forEach(q=>{const st=qState(w,q),e=qExpOf(w,q);if(st==='soon')L.push({q,lv:'soon',t:`${QNAME[q]} 만료 ${ddays(e)===0?'오늘':ddays(e)+'일 전'} (${e})`});else if(st==='expired')L.push({q,lv:'exp',t:`${QNAME[q]} 만료됨 (${e})`});});
  if(!hasQ(w,'기초'))L.unshift({q:'기초',lv:'none',t:'기초안전교육 이수 기록이 없습니다'});return L.concat(hAlerts(w));}
/* 건강검진: 받은 날짜만 기록 (결과는 넣지 않음). 일반=6개월마다 권장·12개월 넘으면 기한 초과, 특수=12개월, 배치전=주기 없음. 기한 3주 전부터 알림 */
const HK=[['gen','일반건강검진',6,12],['spc','특수건강검진',0,12],['pre','배치전 건강검진',0,0]],HNAME={gen:'일반건강검진',spc:'특수건강검진',pre:'배치전 건강검진'},HWARN=21;
const addMon=(ds,n)=>{if(!ds||!n)return '';const [y,m,d]=ds.split('-').map(Number);const t=new Date(y,m-1+n,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`;};
const hDate=(w,k)=>((w&&w.health)||{})[k]||'';
const hExp=(w,k)=>{const h=HK.find(x=>x[0]===k);return h&&h[3]?addMon(hDate(w,k),h[3]):'';};
const hDue=(w,k)=>{const h=HK.find(x=>x[0]===k);return h&&h[2]?addMon(hDate(w,k),h[2]):'';};
function hState(w,k){if(!hDate(w,k))return 'none';const e=hExp(w,k);if(!e)return 'ok';const n=ddays(e);return n<0?'expired':n<=HWARN?'soon':'ok';}
function hAlerts(w){const L=[];HK.forEach(([k,nm])=>{const st=hState(w,k),e=hExp(w,k);if(st==='soon')L.push({h:k,lv:'soon',t:`${nm} 기한 ${ddays(e)===0?'오늘':ddays(e)+'일 전'} (${e}까지)`});else if(st==='expired')L.push({h:k,lv:'exp',t:`${nm} 기한 지남 (${e})`});});return L;}
const qAlertCount=()=>S.workers.filter(w=>w.status==='재직'&&w.role!=='admin').reduce((a,w)=>a+QUALS.filter(q=>{const st=qState(w,q);return st==='soon'||st==='expired';}).length+hAlerts(w).length,0);
const qualChips=w=>String((w&&w.quals)||'').split(',').filter(Boolean).map(q=>`<span class="chip qchip">${q}</span>`).join('');
const rostersOn=d=>(S.rosters||[]).filter(r=>r.date===d).sort((a,b)=>(a.tStart||'').localeCompare(b.tStart||'')||pnameFull(a.projectId).localeCompare(pnameFull(b.projectId),'ko'));
const rostersPub=d=>rostersOn(d).filter(r=>r.status!=='임시');
const myRoster=(uid,d)=>rostersPub(d).find(r=>r.members.some(m=>m.wid===uid));

/* 명단 카드 (카톡 양식과 같은 순서) */
function rosterCard(r,opt){opt=opt||{};const p=P(r.projectId)||{name:r.projectId?'(삭제된 공사)':'(공사 미정)'};const me=ses.uid,mine=r.members.some(m=>m.wid===me);
  const by=ro=>r.members.filter(m=>m.role===ro||m.also===ro);
  const nm=m=>m.ext?`<span>${esc(m.name)}<small class="mute">(외부${m.co?'·'+esc(m.co):''})</small></span>`:`<span class="${m.wid===me?'mename':''}">${esc(m.name)}${m.also?'<small class="mute">·겸</small>':''}</span>`;
  const veh=r.vehicles.length?r.vehicles.map(v=>`<div>${esc(v.dname||'-')} · ${esc(v.model||'')} <b>${esc(v.plate||'')}</b>${v.xv?` <small class="mute">(외부${v.co?'·'+esc(v.co):''})</small>`:''}</div>`).join(''):'<span class="mute">없음</span>';
  return `<div class="card roster${mine?' mine':''}">
  <div class="row" style="gap:8px;flex-wrap:wrap"><b style="font-size:15px">${fmtDay(r.date)}</b><span class="chip">${esc(r.tStart)}~${esc(r.tEnd)}</span>${mine?'<span class="chip st-ok">내 투입</span>':''}<span class="sp"></span>${r.permit?`<button class="btn sm ${mine?'pri':''}" onclick="event.stopPropagation();rPermitView('${r.id}')">📋 안전작업허가서</button>`:''}
  ${opt.admin?`<button class="btn sm" onclick="rForm('${r.id}')">수정</button><button class="btn sm bad" onclick="rDel('${r.id}')">삭제</button>`:''}</div>
  <div class="rline"><span>■ 공사명</span><b>${esc(p.name)}</b></div>
  ${p.client||p.plant?`<div class="rline"><span>발주처·공장</span>${esc([p.client,p.plant].filter(Boolean).join(' · '))}</div>`:''}
  <div class="rline"><span>■ 업체명</span>${esc(r.company||DEF_CO)}</div>
  <div class="rline"><span>■ 작업위치</span>${esc(r.location)||'<span class="mute">-</span>'}</div>
  <div class="rline"><span>■ 투입인원</span><b>${r.members.length}명</b></div>
  ${ROLES.map(ro=>by(ro).length?`<div class="rline sub"><span>${ro}</span>${by(ro).map(nm).join(' ')}</div>`:'').join('')}
  <div class="rline"><span>■ 차량</span><div>${veh}</div></div>
  ${r.note?`<div class="rline"><span>■ 전달내용</span><div style="white-space:pre-wrap">${esc(r.note)}</div></div>`:''}
  ${p.mgrName?mgrLine(p.id,true):''}</div>`;}

/* ---------- 근로자: 투입현황 ---------- */
function qualBanner(w){const L=qualAlerts(w);if(!L.length)return '';
  return `<div class="card" style="border-left:4px solid ${L.some(x=>x.lv!=='soon')?'var(--bad)':'var(--warn)'}"><h3 style="margin:0 0 6px">🔔 자격·교육·검진 알림</h3>${L.map(x=>`<div style="margin:3px 0">${x.lv==='soon'?'⏰':'⚠'} ${esc(x.t)}</div>`).join('')}<p class="mute" style="margin:6px 0 0;font-size:12.5px">${L.some(x=>!x.h)?'갱신 교육을 받고 이수증을 관리자에게 제출하세요. ':''}${L.some(x=>x.h)?'기한 안에 건강검진을 받고, 받은 날짜를 관리자에게 알려 주세요.':''}</p>${L.some(x=>x.h)&&LIVE&&w.id===ses.uid?`<button class="btn sm pri" style="margin-top:6px" onclick="myHealthUp()">📷 건강검진표 올리기</button>`:''}</div>`;}
function myRosterBanner(){const me=ses.uid,t=today(),n=nextWork(t);const a=myRoster(me,t),b=myRoster(me,n);if(!a&&!b)return '';
  const line=(r,lab)=>{const p=P(r.projectId)||{};const v=r.vehicles.filter(x=>x.driver===me);const mates=r.members.filter(m=>m.wid!==me).map(m=>m.name);
    return `<div style="margin:4px 0"><b>${lab}</b> ${esc(p.name||'')} <span class="mute">${esc(r.tStart)}~${esc(r.tEnd)}${r.location?' · '+esc(r.location):''}</span>${mates.length?`<div class="mute" style="font-size:12.5px">함께: ${esc(mates.join(', '))}</div>`:''}${v.length?`<div style="font-size:12.5px">🚚 운전: ${esc(v.map(x=>(x.model||'')+' '+x.plate).join(', '))}</div>`:''}${r.note?`<div style="font-size:12.5px">📌 ${esc(r.note.split('\n')[0])}${r.note.indexOf('\n')>0?' …':''}</div>`:''}${r.permit?`<button class="btn sm pri" style="margin-top:4px" onclick="event.stopPropagation();rPermitView('${r.id}')">📋 안전작업허가서 보기</button>`:''}</div>`;};
  return `<div class="card" style="border-left:4px solid var(--pri2);cursor:pointer" onclick="wTab('crew')"><div class="row"><h3 style="margin:0">🗓 내 투입</h3><span class="sp"></span><span class="mute" style="font-size:12px">전체 보기 ›</span></div>${a?line(a,'오늘'):''}${b?line(b,fmtDayS(n)):''}</div>`;}
function vCrew(){const t=today();const d=ui.crewDate||nextWork(t);const rs=rostersPub(d);
  let h=`<div class="card"><div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn sm" onclick="ui.crewDate=addDaysC('${d}',-1);render()">◀</button><input type="date" value="${d}" style="width:auto" onchange="ui.crewDate=this.value;render()"><button class="btn sm" onclick="ui.crewDate=addDaysC('${d}',1);render()">▶</button><span class="sp"></span><button class="btn sm" onclick="ui.crewDate='${t}';render()">오늘</button><button class="btn sm" onclick="ui.crewDate='${nextWork(t)}';render()">다음 근무일</button></div>
  <p class="mute" style="margin:8px 0 0">${fmtDay(d)} · 공사 ${rs.length}건 · ${rs.reduce((a,r)=>a+r.members.length,0)}명 투입. 서로 어디서 일하는지 보고 필요하면 도와주세요.</p></div>`;
  const mine=rs.filter(r=>r.members.some(m=>m.wid===ses.uid)),others=rs.filter(r=>!r.members.some(m=>m.wid===ses.uid));
  if(!rs.length)h+=`<div class="card"><p class="mute" style="margin:0">이 날짜에 등록된 투입명단이 없습니다.</p></div>`;
  return h+mine.concat(others).map(r=>rosterCard(r)).join('');}

/* ---------- 관리자: 투입명단 (끌어서 놓기 보드) ---------- */
function rChipM(m,rid,q,extra){rid=rid||'';const sel=ui.rSel&&ui.rSel.k==='m'&&ui.rSel.id===m.wid&&(ui.rSel.from||'')===rid;const qs=String(q||'').split(',').filter(Boolean);return `<span class="dchip m${sel?' sel':''}" draggable="true" data-k="m" data-id="${m.wid}" data-from="${rid}" onclick="rTap(event,'m','${m.wid}','${rid}')">${extra||''}${esc(m.name)}${qs.length?`<small class="qs">${qs.map(x=>x[0]).join('')}</small>`:''}</span>`;}
function rChipV(v,rid){rid=rid||'';const sel=ui.rSel&&ui.rSel.k==='v'&&ui.rSel.id===v.cid;const c=carOf(v.cid);return `<span class="dchip v${sel?' sel':''}${c&&c.repair?' warn':''}" draggable="true" data-k="v" data-id="${v.cid}" data-from="${rid}" onclick="rTap(event,'v','${v.cid}','${rid}')">🚚 ${esc(v.plate||(c&&c.plate)||'')}${v.dname?` · ${esc(v.dname)}`:''}${c&&c.repair?' ⚠':''}</span>`;}
function aRoster(){const t=today();const d=ui.rDate||nextWork(t);ui.rDate=d;const rs=rostersOn(d);
  const used={},usedC={};rs.forEach(r=>{r.members.forEach(m=>{(used[m.wid]=used[m.wid]||[]).push(m.role);});r.vehicles.forEach(v=>usedC[v.cid]=1);});
  const mgrOnly=w=>used[w.id]&&used[w.id].every(x=>x==='관리');
  const act=S.workers.filter(w=>w.status==='재직').sort((a,b)=>(a.role==='admin')-(b.role==='admin')||a.name.localeCompare(b.name,'ko'));
  const off=act.filter(w=>!used[w.id]),mg=act.filter(mgrOnly),cars=(S.cars||[]).filter(c=>c.active!==false&&!usedC[c.id]);
  const isLv=w=>typeof leaveOn==='function'&&leaveOn(w.id,d);
  const sel=ui.rSel;const tgt=k=>sel&&(k==='any'||sel.k===k)?' target':'';
  let h=`<div class="card"><div class="row" style="gap:6px;flex-wrap:wrap"><h3 style="margin:0">투입명단</h3><button class="btn sm" onclick="ui.rDate=addDaysC('${d}',-1);ui.rSel=null;render()">◀</button><input type="date" value="${d}" style="width:auto" onchange="ui.rDate=this.value;ui.rSel=null;render()"><button class="btn sm" onclick="ui.rDate=addDaysC('${d}',1);ui.rSel=null;render()">▶</button><span class="sp"></span>
  ${rs.some(r=>r.status==='임시')?`<button class="btn ok" onclick="rPublish('${d}')">임시 ${rs.filter(r=>r.status==='임시').length}건 모두 공개</button>`:''}<button class="btn" onclick="rCopy('${d}')">이전 명단 복사</button><button class="btn pri" onclick="rForm('','${d}')">+ 공사 투입 추가</button></div>
  <p class="mute" style="margin:8px 0 0">${fmtDay(d)} · 공사 ${rs.length}건 · ${Object.keys(used).length}명 투입 · 미배치 ${off.length}명. <b>사람·차량을 끌어서</b> 공사의 역할 칸(관리·안전·신호·화기·밀폐·작업)에 놓으세요. 안전·신호·화기·밀폐는 근로자관리에서 자격을 체크한 사람만 들어가고, <b>신호·화기는 「+겸직」으로 한 사람이 함께</b> 맡을 수 있습니다 (휴대폰은 <b>눌러서 고른 뒤 놓을 칸을 누르기</b>). 한 사람은 하루에 한 공사에만 들어가며(<b>관리는 여러 공사 중복 가능</b>), 다른 공사로 옮기면 원래 공사에서 자동으로 빠집니다.</p>
  ${sel?`<div class="infobox" style="margin-bottom:0">선택됨: <b>${esc(sel.k==='m'?W(sel.id).name:carLabel(carOf(sel.id)))}</b> — 놓을 칸을 누르세요. <button class="btn sm" onclick="ui.rSel=null;render()">선택 취소</button></div>`:''}</div>
  <div class="rboard"><div class="card rpool rzone${tgt('any')}" data-to="" data-role="" onclick="rZone(event,'','','any')"><h4 style="margin:0 0 6px">미배치 인원 (${off.length})</h4><div class="dzone">${off.map(w=>rChipM({wid:w.id,name:w.name+(isLv(w)?' (휴가)':'')},'',w.quals)).join('')||'<span class="mute" style="font-size:13px">모두 배치됨</span>'}</div>
  ${mg.length?`<h4 style="margin:12px 0 6px">관리 중복 배치 가능 (${mg.length})</h4><div class="dzone">${mg.map(w=>rChipM({wid:w.id,name:w.name},'',w.quals,`<small class="mute">관리 ${used[w.id].length}곳 · </small>`)).join('')}</div><p class="mute" style="font-size:12px;margin:4px 0 0">관리는 여러 공사에 함께 넣을 수 있습니다. 여기서 끌어 다른 공사의 「관리」 칸에 놓으세요.</p>`:''}
  <h4 style="margin:12px 0 6px">미배치 차량 (${cars.length})</h4><div class="dzone">${cars.map(c=>rChipV({cid:c.id,plate:c.plate,dname:''})).join('')||`<span class="mute" style="font-size:13px">${(S.cars||[]).length?'모두 배치됨':'「차량관리」에서 차량을 등록하세요'}</span>`}</div>
  <p class="mute" style="font-size:12px;margin:10px 0 0">여기로 끌어 놓으면 명단에서 빠집니다.</p></div><div class="rcols">`;
  if(!rs.length)h+=`<div class="card"><p class="mute" style="margin:0">이 날짜의 명단이 없습니다. 「+ 공사 투입 추가」로 공사를 먼저 만들거나 「이전 명단 복사」를 누르세요.</p></div>`;
  rs.forEach(r=>{const p=P(r.projectId)||{name:r.projectId?'(삭제된 공사)':'(공사 미정)'};const dr=r.status==='임시';
    h+=`<div class="card rcard${dr?' draft':''}">${dr?`<div class="row" style="gap:6px;margin:-4px 0 6px"><span class="chip st-pend">임시저장 · 근로자에게 안 보임</span><span class="sp"></span><button class="btn sm ok" onclick="rPublish('${d}','${r.id}')">공개</button></div>`:''}<div class="row" style="gap:6px;align-items:flex-start"><div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="mute" style="font-size:12px">${esc([p.client,p.plant].filter(Boolean).join(' · '))}${r.company&&r.company!==DEF_CO?' · 업체 '+esc(r.company):''}</div></div><button class="btn sm" onclick="rForm('${r.id}')">수정</button><button class="btn sm bad" onclick="rDel('${r.id}')">✕</button></div>

function rfPermitFile(f){if(!f||!/^image\//.test(f.type)){toast('이미지만 붙여넣을 수 있습니다.');return;}

    const url=c.toDataURL('image/jpeg',0.9);RF.permitNew={b64:url.split(',')[1],mime:'image/jpeg',url};RF.permitDel=0;rfPermitRender();toast('허가서 이미지를 붙였습니다. 저장해야 등록됩니다.');};

function cFileUp(id){const f=(document.getElementById('cf_file').files||[])[0];if(!f){toast('파일을 고르세요.');return;}if(f.size>8*1024*1024){toast('8MB 이하 파일만 올릴 수 있습니다.');return;}
  const rd=new FileReader();rd.onload=()=>{const b64=String(rd.result).split(',')[1]||'';liveOnly('car_fileUp',{id,name:f.name,mime:f.type,b64},null).then(r=>{if(r)cForm(id);});};rd.readAsDataURL(f);}
async function cFileGet(id){if(!LIVE){toast('시제품에서는 파일이 없습니다.');return;}window.liveBusy(true);
  try{const r=await window.liveCall('car_fileGet',{id});const bin=atob(r.b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:r.mime||'application/octet-stream'}));
    alertBox('보험증권 파일',[]);document.querySelector('#modal .mbox').insertAdjacentHTML('beforeend',`<p><a class="btn pri" href="${url}" target="_blank" rel="noopener" download="${esc(r.name)}">📄 ${esc(r.name)} 열기</a></p>`);}
  catch(e){window.liveFail(e);}finally{window.liveBusy(false);}}

function menuSearchCard(){return `<div class="card" style="padding:12px 16px"><div class="row" style="gap:8px;flex-wrap:wrap"><b style="white-space:nowrap">🔎 메뉴 찾기</b><input id="msq" style="flex:1;min-width:180px" placeholder="예: 연차, 투입, 기성, 카드, 세금계산서" autocomplete="off" oninput="menuSearch(this.value)" onkeydown="if(event.key==='Enter'){const b=document.querySelector('#msr button');if(b)b.click();}"></div><div id="msr" class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px">${menuHits('')}</div></div>`;}

  const gb=v=>(v/1073741824).toFixed(v<10737418240?2:1)+'GB',pct=d.limit>0?Math.round(d.used/d.limit*1000)/10:0,warn=pct>=70,col=pct>=90?'var(--bad)':warn?'var(--warn)':'var(--ok,#2e7d32)';

const entStr=e=>`${pname(e.projectId)} ${entryG(e)?fmtG(entryG(e))+'공수':''} ${e.desc}`;
function diffText(o,n){const d=[];

const ADM_MANUAL=[["🚀", "시작하기", "Getting started", [["로그인: 휴대폰 번호와 비밀번호로 로그인합니다. 관리자·메뉴 담당자는 자동으로 관리자 화면이 열립니다.", "Log in with your phone number and password. Admins and menu managers open the admin screen automatically."], ["화면 전환: 오른쪽 위 「근로자 화면」을 누르면 본인 출퇴근 화면으로, 로고를 누르면 「오늘 업무」로 돌아옵니다.", "Switch views: tap “Worker view” (top right) for your own clock-in screen; tap the logo to return to “Today”."], ["메뉴 찾기: 「오늘 업무」의 🔎 메뉴 찾기 칸에 하는 일(예: 연차, 세금계산서)을 치면 바로 갈 메뉴가 나옵니다.", "Find a menu: type a task (e.g. leave, tax invoice) in 🔎 Find menu on “Today”."], ["언어: 오른쪽 위 🌐 에서 한국어/English를 고릅니다. (근로자는 베트남어도 가능)", "Language: choose Korean/English with 🌐 at the top right (workers also have Vietnamese)."], ["PC 앱 설치: 크롬 주소창 오른쪽 설치 아이콘 또는 ⋮ → 「설치 및 바로가기」로 바탕화면 앱처럼 쓸 수 있습니다.", "Install on PC: use the install icon in Chrome’s address bar or ⋮ → “Install & shortcuts”."], ["권한: 전체 관리자는 모든 메뉴, 메뉴 담당자는 받은 메뉴만 보입니다. 권한은 「근로자 관리 › 권한」에서 전체 관리자가 정합니다.", "Permissions: the super admin sees all menus; menu managers see only granted menus (set in Workers › Permissions)."]]], ["🏠", "오늘 업무", "Today", [["회사 일정(오늘·내일), 승인 대기, 세금계산서·결재 요청, 차량·자격 만료, 건강검진표 제출, 부상·생일, 공지 확인 현황 등 할 일이 카드로 모여 나옵니다.", "Cards show today’s to-dos: company calendar, pending approvals, tax/purchase requests, vehicle and certificate expiry, checkup submissions, birthdays and notice read status."], ["카드의 「› 」 버튼으로 해당 메뉴로 바로 갑니다.", "Use the “›” button on a card to jump to that menu."], ["맨 아래 💾 저장공간 카드: 구글 저장공간이 70% 넘으면 노란색, 90% 넘으면 빨간색 경고가 나옵니다.", "The 💾 storage card at the bottom warns at 70% (yellow) and 90% (red)."]]], ["🗓", "현장 운영 › 투입명단", "Site operations › Crew list", [["「+ 공사 투입 추가」로 날짜·공사·시간·작업위치를 정하고, 근로자를 역할 칸(관리·안전·신호·화기 등)에 끌어다 놓습니다. 휴대폰은 사람을 누른 뒤 칸을 누릅니다.", "Use “+ Add project crew” to set date, project, hours and location, then drag workers into role slots (on phones: tap a person, then a slot)."], ["자격이 없거나 만료된 사람은 안전·신호·화기·밀폐 칸에 넣을 수 없습니다.", "People without a valid certificate can’t be placed in safety/signal/fire/confined-space slots."], ["회사 근로자가 아닌 사람은 「+ 외부 인원」으로 이름·업체를 적어 넣습니다. 월간 출근표에 「일용」으로 함께 집계됩니다.", "For non-employees use “+ External person” (name, company). They appear as day labourers in the monthly sheet."], ["「임시저장」은 관리자만 보고, 「공개」하면 근로자에게 알림이 가고 근로자 화면에 보입니다.", "“Save draft” is visible to managers only; “Publish” notifies workers and shows the list to them."], ["「이전 명단 복사」로 전날 명단을 그대로 가져와 고칠 수 있습니다. 안전작업허가서는 「📋 허가서」로 첨부합니다.", "“Copy previous list” reuses an earlier list. Attach the work permit with “📋 Permit”."]]], ["🚚", "현장 운영 › 차량관리", "Site operations › Vehicles", [["「+ 차량 등록」으로 차량·보험·검사 정보를 넣습니다. 보험·검사 만료가 가까워지거나 수리 필요 차량은 「오늘 업무」에 알림이 나옵니다.", "Register vehicles with “+ Register vehicle”. Insurance/inspection expiry and repair needs appear on “Today”."]]], ["✅", "근태 관리 › 출퇴근 승인", "Attendance › Attendance approval", [["근로자가 퇴근하면 공수가 자동으로 승인 요청됩니다. 내용을 확인하고 승인 또는 반려(사유 입력)합니다.", "When a worker clocks out, their man-days are sent for approval. Check and approve, or reject with a reason."], ["여러 건은 체크해서 「선택 일괄 승인」합니다. 반려하면 근로자에게 알림이 가고, 근로자가 고쳐서 다시 요청합니다.", "Tick several and use “Approve selected”. Rejected workers are notified and resubmit."], ["다쳐서 직접 퇴근하지 못한 근로자는 관리자가 그날 기록을 열어 퇴근 시각을 넣어 줍니다.", "For an injured worker who can’t clock out, open that day’s record and enter the clock-out time."]]], ["📊", "근태 관리 › 월간 출근표", "Attendance › Monthly attendance sheet", [["기준 월·소속을 고르면 직원 공수와 투입명단의 외부 인원이 한 표로 나옵니다.", "Choose month and company to see employee man-days and roster external workers in one sheet."], ["외부 인원 칸을 누르면 공수를 고칠 수 있고, 오지 않은 날은 0(불참)으로 바꿉니다.", "Click an external worker’s cell to change man-days; set 0 for days they didn’t come."], ["업체가 비어 있는 외부 인원은 체크 → 「✏ 선택 인원 소속 입력」으로 한 번에 업체명을 넣습니다.", "For external workers without a company, tick them → “✏ Set company” to fill it in at once."], ["「출근부 CSV」, 「작업상세 CSV」, 「인쇄용 파일」로 내려받습니다. 아래 「업체·공사별 집계」는 협력업체 대금 확인용입니다.", "Download with “Attendance CSV”, “Work detail CSV” or “Print file”. “By company & project” below is for payment checks."]]], ["🌴", "근태 관리 › 연차 관리", "Attendance › Leave", [["근로자가 신청한 연차·반차를 승인·반려합니다. 「+ 연차 직접 등록」으로 관리자가 대신 등록할 수도 있습니다.", "Approve or reject leave requests. Use “+ Register leave” to add leave on someone’s behalf."]]], ["🔲", "근태 관리 › 출근 QR", "Attendance › Clock-in QR", [["출근은 지정 QR을 촬영해야만 기록되고, 퇴근은 어디서나 버튼으로 합니다.", "Clock-in requires scanning a designated QR code; clock-out works anywhere with the button."], ["「+ 장소 추가」로 쉼터를 등록하고 QR 포스터를 인쇄해 붙입니다. 쉼터 현장에서 「📍 현재 위치로 입력」을 누르면 좌표가 정확해집니다.", "Add rest areas with “+ Add location” and print the QR poster. Press “📍 Use current location” on site for accurate coordinates."], ["QR이 외부로 퍼졌으면 「QR 재발급」을 누르세요. 예전 포스터는 바로 못 쓰게 됩니다.", "If a QR code leaks, press “Reissue QR”; old posters stop working immediately."]]], ["👷", "인사·노무 › 근로자 관리", "HR & labor › Workers", [["「+ 신규 입사자 등록」으로 이름·연락처·주민번호 앞자리·소속·근로형태·직군·직급·1공수 단가를 넣습니다. 근로자는 처음 로그인할 때 비밀번호를 직접 정합니다.", "Add new hires with “+ Register new hire” (name, phone, ID prefix, company, type, job type, position, day rate). Workers set their own password at first login."], ["표는 직군 › 직급 › 이름 › 입사일 순으로 정렬되고, 검색 칸에 이름·전화·직급을 치면 바로 걸러집니다.", "The list sorts by job type › position › name › join date; the search box filters instantly."], ["가입 신청은 위쪽에서 승인·반려합니다. 퇴사 처리해도 기록은 3년 보존됩니다.", "Approve or reject sign-ups at the top. Leavers’ records are kept for 3 years."]]], ["🎓", "인사·노무 › 자격·교육·검진", "HR & labor › Certs · Training · Checkups", [["이름이나 「수정」을 눌러 자격 만료일과 건강검진 날짜를 고칩니다. 「📷 이수증 사진으로 자동 입력」, 「📷 검진표 사진으로 날짜 자동 입력」을 쓰면 사진에서 날짜를 읽습니다.", "Click a name or “Edit” to change expiry and checkup dates. Use the 📷 photo buttons to read dates from certificates and checkup sheets."], ["근로자가 직접 낸 건강검진표는 「오늘 업무」와 이 메뉴 위쪽 「🩺 건강검진표 제출 확인」에서 날짜를 확인해 승인·반려합니다.", "Checkup sheets submitted by workers appear in “🩺 Checkup sheets to review” on Today and here; approve or reject."], ["검진 결과표 사진은 민감정보라 전체 관리자만 보고 내려받을 수 있습니다.", "Checkup photos are sensitive: only the super admin can view or d r password, reset it in Workers."]]]];

const payNum=v=>{const t=String(v||'').replace(/[,\s원₩]/g,'');return /^-?\d+(\.\d+)?$/.test(t)?Number(t):null;};
const payFmt=v=>{const n=payNum(v);return n===null?String(v):n.toLocaleString('ko-KR');};
const payK=(x,k)=>{const t=((x.tr||{})[LANG]||{})[k];return t&&LANG!=='ko'?t:k;};
function myPayCard(me){const L=(S.payslips||[]).filter(x=>x.wid===me.id).sort((a,b)=>b.month.localeCompare(a.month));

function paySlip(id){const x=(S.payslips||[]).find(o=>o.id===id);if(!x)return;const w=W(x.wid)||{name:x.name};
  if(LIVE&&x.wid===ses.uid&&!x.seen){x.seen=stamp();window.liveCall('pay_seen',{id}).catch(()=>{});}

/* 관리자: 엑셀 올리기 → 머리글·이름 열 자동 찾기 → 근로자 연결 확인 → 올리기 */
var PAY_P=null;
function aPay(){const can=isSuper(),L=S.payslips||[],mos=[...new Set(L.map(x=>x.month))].sort().reverse();

  <div id="pay_prev">${PAY_P?payPrev():''}</div></div>`;

    ${ui.payOpen===m?`<div style="margin-top:6px">${X.sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(x=>`<button class="btn sm" style="margin:2px" onclick="paySlip('${x.id}')">${esc(x.name)} ${x.net?payFmt(x.net):''}${x.seen?' ✔':''}</button>`).join('')}</div>`:''}</div>`;}).join(''):'<p class="mute" style="margin:0">아직 올린 명세서가 없습니다.</p>'}</div>`;
  return h;}
const addMonthsYM=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
async function payPick(inp){const f=(inp.files||[])[0];inp.value='';if(!f)return;if(f.size>10*1024*1024){toast('10MB 이하 파일만 됩니다.');return;}
  window.liveBusy(true);try{const b64=await new Promise((ok,no)=>{const rd=new FileReader();rd.onload=()=>ok(String(rd.result).split(',')[1]||'');rd.onerror=no;rd.readAsDataURL(f);});

/* 머리글 줄·이름 열·실지급액 열 자동 찾기 */
function payAuto(){const P=PAY_P,v=(P.sheets[P.si]||{}).v||[];let hr=-1,nc=-1;
  for(let i=0;i<Math.min(v.length,20)&&hr<0;i++)v[i].forEach((c,j)=>{if(hr<0&&/^(성\s*명|이\s*름|사원명|근로자명|성명\(한글\))$/.test(String(c).trim())){hr=i;nc=j;}});
  P.hr=hr;P.nc=nc;if(hr<0){P.rows=[];return;}
  const H=v[hr].map((c,j)=>{let t=String(c).trim();if(!t&&hr>0)t=String(v[hr-1][j]||'').trim();return t;});
  P.H=H;P.show=H.map((t,j)=>!!t&&j!==nc&&!/주민|외국인등록|계좌|은행|비고|번호$|^no\.?$|^순번$/i.test(t));
  P.net=H.findIndex(t=>/실\s*지급|차인\s*지급|실\s*수령|실지급액/.test(t));
  const ws=S.workers.filter(w=>w.status!=='가입반려');
  P.rows=v.slice(hr+1).filter(r=>{const n=String(r[nc]||'').trim();return n&&!/^(합\s*계|계|소\s*계|총\s*계)$/.test(n);}).map(r=>{const n=String(r[nc]).trim().replace(/\s+/g,'');const m=ws.filter(w=>w.name.replace(/\s+/g,'')===n);return {r,name:n,wid:m.length===1?m[0].id:''};});}

var MH_FILES=[];
function myHealthUp(){MH_FILES=[];openModal(`<div class="mbox" style="max-width:440px"><div class="row"><h3 style="margin:0">🩺 건강검진표 올리기</h3><span class="sp"></span><button class="btn sm" onclick="closeModal()">닫기 ✕</button></div>

async function myHealthOcr(inp){let fs=[...(inp.files||[])];inp.value='';if(!fs.length)return;const msg=document.getElementById('mh_msg');

  try{for(const f of fs){try{if(f.size>15*1024*1024)throw new Error('15MB 이하 파일만 됩니다.');const d=await qImg(f);const r=await window.liveCall('my_health_ocr',{name:f.name,mime:d.mime,b64:d.b64});if(r&&r.error)throw new Error(r.error);
      MH_FILES.push({id:r.fileId,name:f.name});const ke=document.getElementById('mh_k'),de=document.getElementById('mh_d');
      if(r.k&&!ke.value){ke.value=r.k;ke.style.background='#fff8d6';}if(r.date&&!de.value){de.value=r.date;de.style.background='#fff8d6';}

async function qOcr(id,inp){const fs=[...(inp.files||[])];inp.value='';if(!fs.length)return;if(!LIVE){toast('시제품에서는 사진 읽기가 되지 않습니다.');return;}

function aRoleForm(id){const w=W(id);const P=permsOf(w);
  openModal(`<div class="mbox" style="max-width:560px"><div class="row"><h2 style="margin:0">권한 설정 — ${esc(w.name)}</h2><span class="sp"></span><button class="btn sm" onclick="closeModal()">닫기 ✕</button></div>
  <div style="margin:12px 0">${[['worker','근로자','출퇴근·작업 기록만 합니다.'],['manager','메뉴 담당자','아래에서 고른 메뉴만 관리합니다. (본인 출퇴근도 그대로 함)'],['admin','전체 관리자','모든 메뉴 + 권한 부여까지 할 수 있습니다.']].map(([v,l,d])=>`<label style="display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;cursor:pointer"><input type="radio" style="width:auto;margin-top:4px" name="rl" value="${v}" ${w.role===v||(v==='worker'&&!['admin','manager'].includes(w.role))?'checked':''} onchange="document.getElementById('rl_m').style.display=this.value==='manager'?'block':'none'"> <span><b>${l}</b><br><span class="mute">${d}</span></span></label>`).join('')}</div>
  <div id="rl_m" style="display:${w.role==='manager'?'block':'none'}"><h4 style="margin:6px 0">담당 메뉴</h4><div class="grid2">${MENUS.map(([k,l])=>`<label class="row"><input type="checkbox" class="rl_k" value="${k}" ${w.role==='manager'&&P.indexOf(k)>=0?'checked':''}> ${l}</label>`).join('')}</div>
  <p class="mute">· 근로자 관리 권한이 있으면 주민등록번호·단가가 보입니다.<br>· 메뉴 담당자는 관리자·다른 담당자 계정을 고칠 수 없고, 권한도 줄 수 없습니다.</p></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" onclick="aRoleSave('${id}')">저장</button></div></div>`);}
function aRoleSave(id){const role=(document.querySelector('input[name=rl]:checked')||{}).value||'worker';const perms=[...document.querySelectorAll('.rl_k:checked')].map(e=>e.value);
  if(role==='manager'&&!perms.length){toast('담당할 메뉴를 하나 이상 고르세요.');return;}
  if(id===ses.uid&&role!=='admin'){toast('본인의 전체 관리자 권한은 해제할 수 없습니다.');return;}
  const w=W(id);w.role=role;w.perms=role==='manager'?perms.join(','):'';logG(ses.uid,'권한 변경',`${w.name} — ${role==='admin'?'전체 관리자':role==='manager'?'메뉴 담당('+w.perms+')':'근로자'}`);save();closeModal();render();toast('권한을 저장했습니다.');}
function aWorkerSave(id){
  const g=k=>document.getElementById(k).value.trim();
  const name=g('fw_name'),phoneRaw=g('fw_phone'),aff=g('fw_aff'),partner=g('fw_partner'),type=g('fw_type'),rank=g('fw_rank'),jobType=g('fw_job'),join=g('fw_join'),rrnIn=g('fw_rrn').replace(/\s/g,''),rateIn=g('fw_rate').replace(/[,\s원]/g,'');
  const digits=phoneRaw.replace(/\D/g,'');
  if(!name){toast('이름을 입력하세요.');return;}
  if(!/^01\d{8,9}$/.test(digits)){toast('휴대폰 번호를 정확히 입력하세요.');return;}
  if(S.workers.some(x=>x.id!==id&&x.phone.replace(/\D/g,'')===digits)){toast('이미 등록된 휴대폰 번호입니다.');return;}
  if(aff==='협력업체'&&!partner){toast('협력업체명을 입력하세요.');return;}
  if(!join){toast('입사일을 입력하세요.');return;}
  const rm=/^(\d{6})-?([1-8])(\d{6})?$/.exec(rrnIn);if(!rm){toast('주민등록번호를 "앞 6자리-뒷자리 첫 1자리" 또는 전체 13자리로 입력하세요.');return;}
  if(rateIn&&!/^\d+$/.test(rateIn)){toast('1공수 단가는 숫자로 입력하세요.');return;}
  const rrn=rm[1]+'-'+rm[2]+(rm[3]||''),rate=rateIn===''?'':Number(rateIn);
  const phone=digits.length===11?`${digits.slice(0,3)}-${digits.slice(3,7)}-${digits.slice(7)}`:`${digits.slice(0,3)}-${digits.slice(3,6)}-${digits.slice(6)}`;
  if(id){const w=W(id);const ch=[];[['name','이름',name],['phone','휴대폰',phone],['aff','소속',aff],['partner','협력업체',aff==='협력업체'?partner:''],['type','근로형태',type],['jobType','직군',jobType],['rank','직급',rank],['join','입사일',join],['rrn','주민등록번호',rrn],['rate','1공수 단가',rate]].forEach(([k,l,v])=>{if(String(w[k]??'')!==String(v)){ch.push(k==='rrn'?'주민등록번호 변경':(k==='rate'?`${l}: ${rateShow(w[k])} → ${rateShow(v)}`:`${l}: ${w[k]||'-'} → ${v||'-'}`));w[k]=v;}});
    if(ch.length)logG(ses.uid,'근로자 수정',`${w.name} — ${ch.join(', ')}`);toast('저장했습니다.');}
  else{
    const w={id:uid(),name,phone,pw:'',rank,jobType,aff,partner:aff==='협력업체'?partner:'',type,join,leave:'',status:'재직',role:'worker',perms:'',consent:null,rrn,rate};
    S.workers.push(w);logG(ses.uid,"입사 등록",`${name} (${affLabel(w)}, ${type}, 입사 ${join})`);toast('등록했습니다. 근로자가 연락처로 처음 로그인할 때 비밀번호를 직접 정합니다.');}
  save();closeModal();render();
}
function aLeave(id){const w=W(id);const pend=S.records.filter(r=>r.workerId===id&&(r.status==='pending'||r.status==='draft')).length;
  openModal(`<div class="mbox" style="max-width:460px"><h3>${esc(w.name)} 퇴사 처리</h3><label class="f"><span>퇴사일</span><input type="date" id="lv_date" value="${today()}"></label>
  <div class="infobox">퇴사 처리하면 로그인만 차단되고 출근 기록은 그대로 보존됩니다. 재입사 시 다시 활성화할 수 있습니다.</div>${pend?`<div class="warnbox">처리되지 않은 기록(작성중·승인대기)이 ${pend}건 있습니다. 승인 관리에서 먼저 정리하세요.</div>`:''}
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">취소</button><button class="btn bad" onclick="aLeaveDo('${id}')">퇴사 처리</button></div></div>`);}
function aLeaveDo(id){const d=document.getElementById('lv_date').value;if(!d){toast('퇴사일을 입력하세요.');return;}const w=W(id);w.status='퇴사';w.leave=d;logG(ses.uid,'퇴사',`${w.name} 퇴사일 ${d}`);save();closeModal();render();toast('퇴사 처리했습니다.');}
function aRejoin(id){const w=W(id);openModal(`<div class="mbox" style="max-width:460px"><h3>${esc(w.name)} 재입사</h3><label class="f"><span>재입사일</span><input type="date" id="rj_date" value="${today()}"></label><p class="mute">이전 근무 기간(${w.join} ~ ${w.leave})은 변경 이력에 남습니다.</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" onclick="aRejoinDo('${id}')">재입사 처리</button></div></div>`);}
function aRejoinDo(id){const d=document.getElementById('rj_date').value;if(!d)return;const w=W(id);logG(ses.uid,'재입사',`${w.name} 이전 근무 ${w.join}~${w.leave}, 재입사 ${d}`);w.status='재직';w.join=d;w.leave='';save();closeModal();render();toast('재입사 처리했습니다.');}
async function aPin(id){const w=W(id);if(!(await confirmBox(`<b>${esc(w.name)}</b>의 비밀번호를 초기화할까요?\n\n다음 로그인 때 주민등록번호로 본인 확인 후 새 비밀번호를 직접 정하게 됩니다.`,'초기화')))return;w.pw='';logG(ses.uid,'비밀번호 초기화',w.name);save();render();toast('비밀번호를 초기화했습니다.');}

/* ---------- 공사정보등록 ---------- */
/* 담당자 이름 → 연락처 자동 (근로자관리 재직자 우선, 없으면 다른 공사에 적힌 번호) */
function mgrDirC(){const d={};const add=(nm,ph,k)=>{nm=String(nm||'').replace(/\s/g,'');ph=String(ph||'').replace(/\D/g,'');if(!nm||ph.length<9)return;const e=d[nm]=d[nm]||{w:[],p:[],show:String(nm)};if(e[k].indexOf(ph)<0)e[k].push(ph);};
  (S.workers||[]).filter(w=>w.status!=='퇴사').forEach(w=>add(w.name,w.phone,'w'));(S.projects||[]).forEach(p=>add(p.mgrName,p.mgrPhone,'p'));return d;}
function mgrPhoneC(dir,nm){const e=dir[String(nm||'').replace(/\s/g,'')];if(!e)return '';if(e.w.length===1)return e.w[0];if(!e.w.length&&e.p.length===1)return e.p[0];return '';}
function mgrDatalist(){if(document.getElementById('mgr_dl'))return '';const d=mgrDirC();return `<datalist id="mgr_dl">${Object.keys(d).sort((a,b)=>a.localeCompare(b,'ko')).map(k=>{const e=d[k],ph=mgrPhoneC(d,k);return `<option value="${esc(k)}">${ph?fmtPhone(ph):'같은 이름 여러 명'}</option>`;}).join('')}</datalist>`;}
function mgrAuto(nameId,phId){const nm=document.getElementById(nameId).value.trim();const hint=document.getElementById(nameId==='fp_mgr'?'fp_mgr_hint':'lg_mgr_hint');const d=mgrDirC();const e=d[nm.replace(/\s/g,'')];const ph=mgrPhoneC(d,nm);
  if(phId){const pe=document.getElementById(phId);if(ph&&(!pe.value||pe.dataset.auto==='1')){pe.value=ph;pe.dataset.auto='1';}else if(!ph&&pe.dataset.auto==='1'){pe.value='';pe.dataset.auto='';}}
  if(!hint)return;
  if(ph)hint.innerHTML=`📞 ${fmtPhone(ph)} <span style="color:var(--ok)">자동 입력</span> (${e.w.length?'근로자관리':'다른 공사'} 정보)`;
  else if(e&&(e.w.length>1||e.p.length>1))hint.innerHTML=`같은 이름이 여러 명입니다: ${[...e.w,...e.p].filter((v,i,a)=>a.indexOf(v)===i).map(v=>phId?`<button type="button" class="btn sm" onclick="document.getElementById('${phId}').value='${v}';document.getElementById('${phId}').dataset.auto=''">${fmtPhone(v)}</button>`:fmtPhone(v)).join(' ')}${phId?'':' — 저장 후 「공사 정보 수정」에서 연락처를 고르세요'}`;
  else hint.textContent=nm?'등록된 연락처가 없습니다. 직접 입력하세요.':'';}
async function aFillMgr(){const d=mgrDirC();const c=S.projects.filter(p=>p.mgrName&&!p.mgrPhone&&mgrPhoneC(d,p.mgrName)).length;
  if(!(await confirmBox(`담당자 이름은 있는데 연락처가 비어 있는 공사 <b>${c}건</b>에 연락처를 자동으로 채울까요?\n(근로자관리에 등록된 번호를 우선 사용합니다)`,'채우기')))return;
  if(LIVE){await fillMgrLive();return;}
  let n=0;S.projects.forEach(p=>{if(p.mgrName&&!p.mgrPhone){const ph=mgrPhoneC(d,p.mgrName);if(ph){p.mgrPhone=ph;n++;}}});save();render();toast(n+'건의 담당자 연락처를 채웠습니다.');}
function aProjects(){
  let h=`<div class="card"><div class="row"><h3 style="margin:0">공사 목록 · 사용 상태</h3><span class="sp"></span>${(()=>{const d=mgrDirC();const c=S.projects.filter(p=>p.mgrName&&!p.mgrPhone&&mgrPhoneC(d,p.mgrName)).length;return c?`<button class="btn" onclick="aFillMgr()">📞 담당자 연락처 자동 채우기 (${c}건)</button>`:'';})()}<button class="btn pri" onclick="aProjForm('')">+ 공사 등록</button></div>
  <div class="row" style="margin:8px 0"><select style="width:auto" onchange="ui.pf=this.value;render()">${[['','진행 중 (사용·중지)'],['done','완료'],['all','전체']].map(([v,l])=>`<option value="${v}" ${(ui.pf||'')===v?'selected':''}>${l}</option>`).join('')}</select><span class="mute">"사용"인 공사만 근로자 드롭다운에 나타납니다. <b>완료</b>하거나 사용중지한 공사는 드롭다운에서 사라지고, 기존 기록은 그대로 남습니다.</span></div><div class="tbl-wrap"><table class="nw"><tr><th>발주번호</th><th>발주처</th><th>공장명</th><th>공사명</th><th>공사금액</th><th>담당자</th><th>담당자 연락처</th><th>기록</th><th>사용</th><th>관리</th></tr>`;
  const pl=S.projects.filter(p=>ui.pf==='all'?true:ui.pf==='done'?p.done:!p.done);
  if(!pl.length)h+=`<tr><td colspan="10" class="mute">해당하는 공사가 없습니다.</td></tr>`;
  pl.forEach(p=>{const n=S.records.filter(r=>r.entries.some(e=>e.projectId===p.id)).length;
    const st=p.done?'<span class="chip st-pend">완료</span>':`<span class="chip ${p.active?'st-ok':'st-draft'}">${p.active?'사용':'중지'}</span>`;
    h+=`<tr><td>${esc(p.code)||'-'}</td><td>${esc(p.client)||'-'}</td><td>${esc(p.plant)||'-'}</td><td><b>${esc(p.name)}</b>${p.noSafety?' <span class="chip st-draft" title="안전관리비 대장 제외">안전관리비 제외</span>':''}${p.done&&p.doneAt?` <span class="mute">(${esc(p.doneAt.slice(0,10))} 완료)</span>`:''}</td><td style="text-align:right">${rateShow(p.amount)}</td><td>${esc(p.mgrName)||'-'}</td><td>${p.mgrPhone?`<a href="tel:${esc(p.mgrPhone)}">${esc(fmtPhone(p.mgrPhone))}</a>`:'-'}</td><td>${n}건</td><td>${st}</td><td><button class="btn sm" onclick="aProjForm('${p.id}')">수정</button> ${p.done?`<button class="btn sm" onclick="aProjDone('${p.id}',false)">완료 취소</button>`:`<button class="btn sm ok" onclick="aProjDone('${p.id}',true)">완료</button> <button class="btn sm" onclick="aProjToggle('${p.id}')">${p.active?'사용중지':'다시 사용'}</button>`} <button class="btn sm bad" onclick="aProjDel('${p.id}')">삭제</button></td></tr>`;});
  return h+'</table></div></div>';
}
function aProjForm(id){const p=id?P(id):{code:'',name:'',client:'',addr:'',lat:'',lng:'',radius:500,start:today(),end:'',active:true};
  openModal(`<div class="mbox" style="max-width:640px"><div class="row"><h2 style="margin:0">${id?'공사 수정':'공사 등록'}</h2><span class="sp"></span><button class="btn sm" onclick="closeModal()">닫기 ✕</button></div>
  <div class="grid2" style="margin-top:12px"><label class="f"><span>수주처 (일을 받은 회사)</span><select id="fp_ctr" onchange="ctrPick(this)">${ctrOpts(p.contractor||'고센이엔지')}</select></label><label class="f"><span>발주처</span><input id="fp_client" value="${esc(p.client)}"></label></div>
  <div class="grid2"><label class="f"><span>발주번호</span><input id="fp_code" value="${esc(p.code)}" placeholder="발주처에서 받은 발주번호"></label><span></span></div>
  <div class="grid2"><label class="f"><span>공장명</span><input id="fp_plant" value="${esc(p.plant)}" placeholder="예: 당진제철소 C열연공장"></label><label class="f"><span>공사명 * (근로자 드롭다운에 표시)</span><input id="fp_name" value="${esc(p.name)}"></label></div>
  <div class="grid2"><label class="f"><span>공사금액 (원)</span><input id="fp_amount" inputmode="numeric" value="${p.amount===''||p.amount==null?'':Number(p.amount).toLocaleString('ko-KR')}" placeholder="예: 15,000,000" oninput="const d=this.value.replace(/\\D/g,'');this.value=d?Number(d).toLocaleString('ko-KR'):''"></label><label class="f"><span>계약 시작일</span><input id="fp_start" type="date" value="${esc(p.contractStart||'')}"></label></div>
  <div class="grid2"><label class="f"><span>담당자 이름</span><input id="fp_mgr" list="mgr_dl" autocomplete="off" value="${esc(p.mgrName)}" oninput="mgrAuto('fp_mgr','fp_mgrph')"></label><label class="f"><span>담당자 연락처 (숫자만)</span><input id="fp_mgrph" inputmode="numeric" value="${esc(p.mgrPhone)}" placeholder="이름을 입력하면 자동으로 채워집니다" oninput="this.value=this.value.replace(/\\D/g,'');this.dataset.auto=''"></label></div>${mgrDatalist()}<div id="fp_mgr_hint" class="mute" style="margin:-6px 0 10px;font-size:12px"></div>
  <label class="row" style="margin:4px 0 10px;gap:8px"><input type="checkbox" id="fp_nosafe" style="width:auto" ${p.noSafety?'checked':''}> <span><b>안전관리비 대상 아님</b> <span class="mute">— 체크하면 안전관리비 대장에 올라가지 않습니다 (기성준공 대장에는 그대로 올라감)</span></span></label>
  <p class="mute" style="margin-top:0">출퇴근 위치는 공사가 아니라 <b>출근 QR</b> 탭의 휴게쉼터(QR 장소)로 확인합니다.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" onclick="aProjSave('${id}')">저장</button></div></div>`);}
function aProjSave(id){const g=k=>document.getElementById(k).value.trim();
  const name=g('fp_name');
  if(!name){toast('공사명을 입력하세요.');return;}
  const amt=g('fp_amount').replace(/[,\s원]/g,'');
  const data={code:g('fp_code'),contractStart:g('fp_start'),name,client:g('fp_client'),plant:g('fp_plant'),amount:amt===''?'':Number(amt),mgrName:g('fp_mgr'),mgrPhone:g('fp_mgrph').replace(/\D/g,''),noSafety:document.getElementById('fp_nosafe').checked};if(data.mgrName&&!data.mgrPhone)data.mgrPhone=mgrPhoneC(mgrDirC(),data.mgrName);
  if(id){Object.assign(P(id),data);logG(ses.uid,'공사 수정',name);}
  else{S.projects.push(Object.assign({id:uid(),active:true,done:false},data));logG(ses.uid,'공사 등록',`${data.code?data.code+' ':''}${name}`);}
  save();closeModal();render();toast('저장했습니다.');}
async function aProjDone(id,on){const p=P(id);
  if(on){const pend=S.records.filter(r=>(r.status==='pending'||r.status==='draft')&&r.entries.some(e=>e.projectId===id)).length;
    if(!(await confirmBox(`<b>${esc(p.name)}</b> 공사를 완료 처리할까요?\n\n완료하면 근로자 드롭다운에서 사라지고, 지금까지의 기록은 그대로 보존됩니다.${pend?`\n\n※ 이 공사가 포함된 미승인 기록이 ${pend}건 있습니다. 승인 관리에서 확인하세요.`:''}`,'완료 처리')))return;
    p.done=true;p.doneAt=stamp();p.active=false;logG(ses.uid,'공사 완료',`${p.code?p.code+' ':''}${p.name}`);}
  else{p.done=false;p.doneAt='';p.active=true;logG(ses.uid,'공사 완료 취소',`${p.code?p.code+' ':''}${p.name}`);}
  save();render();toast(on?'완료 처리했습니다. 근로자 드롭다운에서 제외됩니다.':'완료를 취소했습니다. 다시 드롭다운에 나타납니다.');}

/* ---------- 연차 관리 ---------- */
const LV_KINDS=['연차','반차','병가','기타'];
const LV_ADMIN_KINDS=['연차','반차','병가','기타','기존사용(이관)','발생조정'];
const LSTATUS={pending:'승인대기',approved:'승인',rejected:'반려',cancelled:'취소'};
const LSTCLS={pending:'st-pend',approved:'st-ok',rejected:'st-bad',cancelled:'st-draft'};
const lvChip=s=>`<span class="chip ${LSTCLS[s]}">${LSTATUS[s]}</span>`;
function ymdAdd(ds,y,m,d){const[a,b,c]=ds.split('-').map(Number);const t=new Date(Date.UTC(a+(y||0),b-1+(m||0),c+(d||0)));return t.toISOString().slice(0,10);}
function weekdays(s,e){if(!s||!e||e<s)return 0;let n=0,d=s;while(d<=e){const w=new Date(d+'T12:00:00Z').getUTCDay();if(w!==0&&w!==6)n++;d=ymdAdd(d,0,0,1);}return n;}
/** 입사일 기준 현재 연차 기간·발생일수 (근로기준법 제60조: 1년 미만 매월 1일(최대 11일), 1년 이상 15일, 3년 이상 2년마다 1일 가산, 최대 25일) */
function leavePeriod(w,asOf){
  if(!w||!w.join)return null;
  let n=0;while(ymdAdd(w.join,n+1)<=asOf)n++;
  const start=ymdAdd(w.join,n),end=ymdAdd(w.join,n+1);
  let accr;
  if(n===0){let m=0;while(m<11&&ymdAdd(w.join,0,m+1)<=asOf)m++;accr=m;}
  else accr=Math.min(25,15+Math.floor((n-1)/2));
  return{n,start,end,base:accr};
}
function leaveSum(w,asOf,list){
  const p=leavePeriod(w,asOf);if(!p)return null;
  const mine=(list||[]).filter(l=>l.workerId===w.id&&l.start>=p.start&&l.start<p.end);
  const sum=f=>mine.filter(f).reduce((a,l)=>a+Number(l.days||0),0);
  const adj=sum(l=>l.status==='approved'&&l.kind==='발생조정');
  const used=sum(l=>l.status==='approved'&&l.kind!=='발생조정');
  const pend=sum(l=>l.status==='pending');
  return Object.assign(p,{adj,accr:p.base+adj,used,pend,remain:p.base+adj-used,list:mine});
}
const asOfW=w=>(w.status==='퇴사'&&w.leave&&w.leave<today())?w.leave:today();
const fmtD=v=>{v=Math.round(Number(v||0)*10)/10;return (v%1===0?String(v):v.toFixed(1));};
const HALF_DEF={am:'08:00~12:00',pm:'13:00~17:00'},HALF_KO={am:'오전',pm:'오후'};
const halfTxt=l=>HALF_KO[l.half]?HALF_KO[l.half]+' 반차'+(l.hTime?' ('+l.hTime+')':''):'반차';
function lvLabel(l){return l.kind==='반차'?l.start+(HALF_KO[l.half]?' '+halfTxt(l):' (반차)'):(l.start===l.end?l.start:l.start+' ~ '+l.end);}
/* 반차 오전/오후 + 시간 입력칸 (pre: lv 또는 al) */
function halfBox(pre,l){const h=l.half||'am',t=l.hTime||HALF_DEF[h];const[a,b]=t.split('~');
  return `<div id="${pre}_hw" style="display:${l.kind==='반차'?'':'none'}"><div class="grid2"><label class="f"><span>오전 / 오후</span><select id="${pre}_half" onchange="halfPick('${pre}')"><option value="am" ${h==='am'?'selected':''}>오전 반차</option><option value="pm" ${h==='pm'?'selected':''}>오후 반차</option></select></label>
  <label class="f"><span>반차 시간</span><div class="row" style="gap:4px;flex-wrap:nowrap"><input id="${pre}_hs" type="time" value="${a||''}"><span>~</span><input id="${pre}_he" type="time" value="${b||''}"></div></label></div></div>`;}
function halfPick(pre){const h=document.getElementById(pre+'_half').value;const[a,b]=HALF_DEF[h].split('~');document.getElementById(pre+'_hs').value=a;document.getElementById(pre+'_he').value=b;}
function halfVal(pre,kind){if(kind!=='반차')return {half:'',hTime:''};const g=k=>document.getElementById(pre+k).value;return {half:g('_half'),hTime:g('_hs')+'~'+g('_he')};}
/* 날짜에 걸린 승인 휴가 (월간 출근부 표시용) */
function leaveOn(wid,ds){return (S.leaves||[]).find(l=>l.workerId===wid&&l.status==='approved'&&l.kind!=='발생조정'&&l.kind!=='기존사용(이관)'&&l.start<=ds&&(l.end||l.start)>=ds);}
const lvShort=k=>({연차:'연',반차:'반',병가:'병',기타:'기'}[k]||'휴');

/* 검증 (시제품·운영판 공통 규칙) */
function lvCheck(p,admin){
  const kinds=admin?LV_ADMIN_KINDS:LV_KINDS;
  if(kinds.indexOf(p.kind)<0)return '사용 구분을 선택하세요.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(p.start||''))return '사용 시작일을 입력하세요.';
  if(p.kind==='반차'&&!HALF_KO[p.half]&&admin){p.end=p.start;p.days=0.5;p.half='';p.hTime='';}else if(p.kind==='반차'){p.end=p.start;p.days=0.5;if(!HALF_KO[p.half])return '반차는 오전/오후를 선택하세요.';const t=String(p.hTime||HALF_DEF[p.half]),m=t.match(/^(\d{2}):(\d{2})~(\d{2}):(\d{2})$/);if(!m||m[1]+m[2]>=m[3]+m[4])return '반차 시간을 확인하세요 (예: 08:00~12:00).';p.hTime=t;}else{p.half='';p.hTime='';}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(p.end||''))p.end=p.start;
  if(p.end<p.start)return '종료일이 시작일보다 빠릅니다.';
  const d=Number(p.days);
  if(!isFinite(d)||Math.round(d*2)!==d*2)return '사용일수는 0.5일 단위 숫자로 입력하세요.';
  if(p.kind==='발생조정'){if(d===0)return '조정일수를 입력하세요 (가산은 +, 차감은 −).';}
  else{if(d<=0)return '사용일수를 확인하세요.';
    const cal=Math.round((new Date(p.end+'T12:00:00Z')-new Date(p.start+'T12:00:00Z'))/864e5)+1;
    if(p.kind!=='기존사용(이관)'&&d>cal)return '사용일수가 기간(달력 '+cal+'일)보다 많습니다.';}
  return null;
}
function lvOverlap(list,wid,s,e,exceptId,half){return (list||[]).find(l=>l.workerId===wid&&l.id!==exceptId&&(l.status==='pending'||l.status==='approved')&&LV_KINDS.indexOf(l.kind)>=0&&l.start<=e&&(l.end||l.start)>=s&&!(half&&l.kind==='반차'&&l.half&&l.half!==half));}

/* 시제품용 처리 — 운영판에서는 lvDo가 서버 호출로 바뀝니다 */
const LV={
  apply(p){const me=W(ses.uid);const er=lvCheck(p,false);if(er)return er;

    S.leaves.push({id:uid(),workerId:me.id,kind:p.kind,start:p.start,end:p.end,days:Number(p.days),half:p.half||'',hTime:p.hTime||'',reason:String(p.reason||''),status:'pending',createdAt:stamp(),decidedBy:'',decidedAt:'',rejectReason:'',history:[{at:stamp(),by:me.id,action:'신청',detail:''}]});
    logG(me.id,'연차 신청',`${me.name} ${p.kind} ${lvLabel(p)} (${fmtD(p.days)}일)`);return null;},
  cancel(p){const l=S.leaves.find(x=>x.id===p.id&&x.workerId===ses.uid);if(!l||l.status!=='pending')return '승인 대기 중인 신청만 취소할 수 있습니다.';

  decide(p){const l=S.leaves.find(x=>x.id===p.id);if(!l||l.status!=='pending')return '승인 대기 중인 신청이 아닙니다.';
    if(p.status==='rejected'&&!(p.reason||'').trim())return '반려 사유를 입력하세요.';
    l.status=p.status;l.decidedBy=ses.uid;l.decidedAt=stamp();l.rejectReason=p.status==='rejected'?p.reason:'';

    logG(ses.uid,'연차 '+LSTATUS[p.status],`${W(l.workerId).name} ${l.kind} ${lvLabel(l)}${l.rejectReason?' — '+l.rejectReason:''}`);return null;},
  save(p){const d=p.data;if(!W(d.workerId).id)return '근로자를 선택하세요.';const er=lvCheck(d,true);if(er)return er;
    if(LV_KINDS.indexOf(d.kind)>=0){const o=lvOverlap(S.leaves,d.workerId,d.start,d.end,p.id,d.kind==='반차'?d.half:'');if(o)return '같은 날짜에 이미 휴가가 있습니다 ('+lvLabel(o)+').';}
    if(p.id){const l=S.leaves.find(x=>x.id===p.id);if(!l)return '기록을 찾을 수 없습니다.';const before=`${l.kind} ${lvLabel(l)} ${fmtD(l.days)}일`;
      Object.assign(l,{workerId:d.workerId,kind:d.kind,start:d.start,end:d.end,days:Number(d.days),half:d.half||'',hTime:d.hTime||'',reason:d.reason||''});
      l.history.push({at:stamp(),by:ses.uid,action:'관리자 수정',detail:before+' → '+`${l.kind} ${lvLabel(l)} ${fmtD(l.days)}일`});logG(ses.uid,'연차 수정',`${W(l.workerId).name} ${before} → ${l.kind} ${lvLabel(l)} ${fmtD(l.days)}일`);}
    else{S.leaves.push({id:uid(),workerId:d.workerId,kind:d.kind,start:d.start,end:d.end,days:Number(d.days),half:d.half||'',hTime:d.hTime||'',reason:d.reason||'',status:'approved',createdAt:stamp(),decidedBy:ses.uid,decidedAt:stamp(),rejectReason:'',history:[{at:stamp(),by:ses.uid,action:'관리자 등록',detail:''}]});
      logG(ses.uid,'연차 등록',`${W(d.workerId).name} ${d.kind} ${lvLabel(d)} ${fmtD(d.days)}일`);}
    return null;},
  del(p){const l=S.leaves.find(x=>x.id===p.id);if(!l)return '기록을 찾을 수 없습니다.';S.leaves=S.leaves.filter(x=>x.id!==p.id);logG(ses.uid,'연차 삭제',`${W(l.workerId).name} ${l.kind} ${lvLabel(l)} ${fmtD(l.days)}일 (${LSTATUS[l.status]})`);return null;},
  import(p){let n=0;(p.rows||[]).forEach(r=>{if(S.leaves.some(l=>l.workerId===r.workerId&&l.start===r.start&&l.kind===r.kind&&l.status!=='cancelled'))return;

    logG(ses.uid,'연차 이관',`구글 폼 기록 ${n}건 가져오기`);return{n};}
};

function aLvSave(id){const g=k=>document.getElementById(k).value.trim();lvDo('save',{id,data:Object.assign({workerId:g('al_w'),kind:g('al_k'),start:g('al_s'),end:g('al_e'),days:g('al_d').replace(/[+\s일]/g,''),reason:g('al_r')},halfVal('al',g('al_k')))},'저장했습니다.');}

function parseDateK(v){v=String(v||'').trim();let m;
  if((m=/^(\d{4})[-./\s]+(\d{1,2})[-./\s]+(\d{1,2})/.exec(v)))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(v)))return m[3]+'-'+pad(m[1])+'-'+pad(m[2]);return '';}
function lvPreview(){
  const lines=document.getElementById('li_t').value.split(/\r?\n/).filter(x=>x.trim());
  const box=document.getElementById('li_p');if(lines.length<2){box.innerHTML='<div class="warnbox">제목 행과 내용 행을 함께 붙여넣어 주세요.</div>';return;}
  const H=lines[0].split('\t').map(x=>x.trim());const col=(...ks)=>H.findIndex(h=>ks.some(k=>h.replace(/\s/g,'').includes(k)));
  const ci={name:col('이름','성명'),kind:col('사용구분','구분'),days:col('사용일수','일수'),s:col('시작일','시작'),e:col('종료일','종료'),r:col('사유'),st:col('결재상태','결재','상태')};
  if(ci.name<0||ci.s<0){box.innerHTML='<div class="badbox">제목 행에서 "이름"과 "사용 시작일" 칸을 찾지 못했습니다. 제목 행까지 함께 복사했는지 확인하세요.</div>';return;}
  const skipRej=document.getElementById('li_rej').checked;
  lvImp=lines.slice(1).map(L=>{const c=L.split('\t');const g=i=>i>=0?(c[i]||'').trim():'';
    const name=g(ci.name),ws=S.workers.filter(w=>w.name===name);let kind=g(ci.kind)||'연차';kind=LV_KINDS.find(k=>kind.includes(k))||'기타';
    const s=parseDateK(g(ci.s)),e=parseDateK(g(ci.e))||s;let days=parseFloat(String(g(ci.days)).replace(/[^\d.]/g,''));
    if(!isFinite(days)||days<=0)days=kind==='반차'?0.5:weekdays(s,e);
    const st=g(ci.st);let note='',ok=true;
    if(!ws.length){ok=false;note='근로자 없음';}else if(ws.length>1){ok=false;note='동명이인 '+ws.length+'명';}
    else if(!s){ok=false;note='날짜 형식 확인';}else if(skipRej&&st.includes('반려')){ok=false;note='반려 건 제외';}
    else if(S.leaves.some(l=>l.workerId===ws[0].id&&l.start===s&&l.kind===kind&&l.status!=='cancelled')){ok=false;note='이미 있음';}
    return{ok,note,name,workerId:ws.length===1?ws[0].id:'',kind,start:s,end:e<s?s:e,days:kind==='반차'?0.5:days,reason:g(ci.r),st};});
  const okN=lvImp.filter(x=>x.ok).length;
  box.innerHTML=`<div class="tbl-wrap" style="margin-top:10px;max-height:300px;overflow:auto"><table class="nw"><tr><th>가져오기</th><th>이름</th><th>구분</th><th>사용일</th><th>일수</th><th>결재상태</th><th>비고</th></tr>${lvImp.map(x=>`<tr><td>${x.ok?'<span class="chip st-ok">가져옴</span>':'<span class="chip c-out">제외</span>'}</td><td>${esc(x.name)}</td><td>${esc(x.kind)}</td><td>${esc(x.start===x.end?x.start:x.start+' ~ '+x.end)}</td><td>${fmtD(x.days)}</td><td>${esc(x.st)||'-'}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div>
  <div class="row" style="margin-top:10px"><span class="mute">${okN}건을 "승인" 상태로 가져옵니다. 근로자 이름이 출근부에 먼저 등록되어 있어야 합니다.</span><span class="sp"></span><button class="btn pri" ${okN?'':'disabled'} onclick="lvImportDo()">${okN}건 가져오기</button></div>`;}
function lvImportDo(){const rows=lvImp.filter(x=>x.ok).map(x=>({workerId:x.workerId,kind:x.kind,start:x.start,end:x.end,days:x.days,reason:x.reason}));lvDo('import',{rows}).then(r=>{if(r)toast(`${r.n}건을 가져왔습니다.`);});}
function expLeaveCsv(){const rows=[['소속','형태','이름','입사일','근속(년)','연차기간 시작','연차기간 끝','발생','조정','사용','승인대기','잔여']];
  S.workers.forEach(w=>{const L=leaveSum(w,asOfW(w),S.leaves);if(!L)return;rows.push([affLabel(w),w.type,w.name,w.join,L.n,L.start,ymdAdd(L.end,0,0,-1),L.base,L.adj,L.used,L.pend,L.remain]);});
  saveFile(`연차대장_${today()}.csv`,csv(rows));}

["✅ 오늘 다친 곳 없이 안전하게 작업을 마쳤습니다", "✅ Hôm nay tôi đã làm việc an toàn, không bị thương", "✅ I finished today's work safely with no injuries"],["다친 곳이 있으면 관리자에게 바로 연락하세요.", "Nếu bị thương, hãy liên hệ ngay với quản lý.", "If you are injured, contact your manager right away."],["다친 곳 없이 마쳤으면 「✅ 오늘 다친 곳 없이 안전하게 작업을 마쳤습니다」에 체크합니다. 다친 곳이 있으면 관리자에게 바로 연락하세요.", "Nếu không bị thương, hãy đánh dấu \"✅ Hôm nay tôi đã làm việc an toàn\". Nếu bị thương, hãy liên hệ ngay với quản lý.", "If you were not injured, tick \"✅ I finished today's work safely\". If you are injured, contact your manager right away."],
["현장(쉼터)에 붙어 있는 지정 QR 코드를 휴대폰 카메라로 촬영합니다.", "Dùng camera điện thoại quét mã QR được dán tại công trường (nhà nghỉ).", "Scan the designated QR code posted at the site (rest area) with your phone camera."],["「퇴근하기」를 누릅니다. 퇴근은 어디서나 할 수 있습니다.", "Bấm \"Chấm công ra\". Có thể chấm công ra ở bất cứ đâu.", "Tap \"Clock out\". You can clock out anywhere."],["💰 급여명세서: 매달 올라오면 알림이 오고, 「내 서류」에서 월별로 봅니다.", "💰 Phiếu lương: mỗi tháng khi có sẽ nhận thông báo; xem theo tháng trong \"Giấy tờ của tôi\".", "💰 Payslips: you get a notification each month; view them by month in \"My documents\"."],["🩺 건강검진: 검진을 받으면 결과표를 사진으로 찍어(최대 4장) 「📷 건강검진표 올리기」로 제출합니다. 날짜를 확인하고 제출하면 관리자가 승인합니다.", "🩺 Khám sức khỏe: sau khi khám, chụp phiếu kết quả (tối đa 4 ảnh) và nộp bằng \"📷 Tải phiếu khám sức khỏe\". Kiểm tra ngày rồi nộp, quản lý sẽ duyệt.", "🩺 Health checkups: after your checkup, photograph the result sheet (up to 4 photos) and submit with \"📷 Upload checkup sheet\". Check the date and submit; your manager approves it."],["안드로이드는 크롬, 아이폰은 사파리로 쓰세요. 카카오톡에서 받은 링크는 「다른 브라우저로 열기」로 여세요.", "Android dùng Chrome, iPhone dùng Safari. Link nhận qua KakaoTalk hãy chọn \"Mở bằng trình duyệt khác\".", "Use Chrome on Android and Safari on iPhone. For links from KakaoTalk, use \"Open in another browser\"."],
["투입명단", "Danh sách điều động", "Crew list"],["근무기록", "Lịch sử làm việc", "Work records"],["연차·휴가", "Nghỉ phép", "Leave"],["내 서류", "Giấy tờ của tôi", "My documents"],["사용방법", "Hướng dẫn", "Guide"],["건의함", "Góp ý", "Suggestions"],["사용방법 전체 보기 ›", "Xem toàn bộ hướng dẫn ›", "View full guide ›"],["📖 사용방법", "📖 Hướng dẫn sử dụng", "📖 How to use"],["궁금한 항목을 누르면 펼쳐집니다. 언어는 오른쪽 위 🌐 에서 바꿀 수 있습니다.", "Bấm vào mục muốn xem để mở ra. Đổi ngôn ngữ bằng nút 🌐 ở góc trên bên phải.", "Tap a topic to open it. Change the language with 🌐 at the top right."],["📲 앱 설치 (처음 한 번)", "📲 Cài ứng dụng (lần đầu)", "📲 Install the app (first time)"],["🔔 휴대폰 알림 켜기", "🔔 Bật thông báo điện thoại", "🔔 Turn on phone notifications"],["🕗 출근하기", "🕗 Chấm công vào", "🕗 Clocking in"],["🏁 퇴근하기", "🏁 Chấm công ra", "🏁 Clocking out"],["🔁 잘못 눌렀거나 반려됐을 때", "🔁 Khi bấm nhầm hoặc bị từ chối", "🔁 Mistakes or rejected records"],["📢 공지·긴급알림", "📢 Thông báo · Cảnh báo khẩn", "📢 Notices & urgent alerts"],["🗓 투입명단", "🗓 Danh sách điều động", "🗓 Crew list"],["🌴 연차·휴가 신청", "🌴 Xin nghỉ phép", "🌴 Requesting leave"],["📁 내 서류 (급여명세서·건강검진)", "📁 Giấy tờ (phiếu lương · khám sức khỏe)", "📁 My documents (payslips · checkups)"],["💬 건의함", "💬 Góp ý", "💬 Suggestions"],["❓ 잘 안 될 때", "❓ Khi gặp sự cố", "❓ Troubleshooting"],["「출퇴근」 화면의 「📱 휴대폰 알림」 카드에서 「알림 켜기」를 누릅니다.", "Trong màn hình \"Chấm công\", ở thẻ \"📱 Thông báo điện thoại\" bấm \"Bật thông báo\".", "On the \"Attendance\" screen, tap \"Turn on\" in the \"📱 Phone notifications\" card."],["휴대폰이 묻는 창에서 「허용」을 누릅니다.", "Khi điện thoại hỏi, bấm \"Cho phép\".", "When the phone asks, tap \"Allow\"."],["아이폰은 먼저 홈 화면에 추가한 앱으로 열어야 알림을 켤 수 있습니다.", "iPhone phải mở bằng ứng dụng đã thêm vào màn hình chính thì mới bật được thông báo.", "On iPhone, open it from the home-screen app first to turn on notifications."],["열린 화면에서 「출근하기」를 누릅니다. 시각과 위치가 함께 기록됩니다.", "Ở màn hình hiện ra, bấm \"Chấm công vào\". Giờ và vị trí sẽ được ghi lại.", "On the screen that opens, tap \"Clock in\". Time and location are recorded."],["QR 없이 출근 버튼만으로는 출근이 기록되지 않습니다.", "Không quét QR thì không thể chấm công vào.", "Clock-in is not recorded without scanning the QR code."],["「출퇴근」 화면에서 오늘 한 작업(공사·공수)을 먼저 적습니다.", "Trước tiên ghi công việc hôm nay (công trình · công) trong màn hình \"Chấm công\".", "First enter today's work (project · man-days) on the \"Attendance\" screen."],["「오늘 안전 확인」에서 다친 곳이 있는지 고릅니다. 다쳤으면 내용을 적으면 관리자에게 바로 알려집니다.", "Ở \"Xác nhận an toàn hôm nay\", chọn có bị thương hay không. Nếu bị thương, ghi nội dung và quản lý sẽ được báo ngay.", "In \"Today's safety check\", choose whether you were injured. If so, describe it and your manager is notified at once."],["퇴근하면 공수가 자동으로 승인 요청됩니다.", "Khi chấm công ra, số công sẽ tự động được gửi xin duyệt.", "When you clock out, your man-days are sent for approval automatically."],["「근무기록」에서 해당 날짜를 엽니다.", "Mở ngày đó trong \"Lịch sử làm việc\".", "Open that date in \"Work records\"."],["반려 사유를 확인하고 고친 뒤 다시 승인 요청합니다.", "Xem lý do từ chối, sửa rồi gửi duyệt lại.", "Check the rejection reason, fix it and request approval again."],["퇴근을 잘못 눌렀으면 「🔄 퇴근 시각 다시 기록」으로 실제 시각을 넣습니다.", "Nếu bấm nhầm chấm công ra, dùng \"🔄 Ghi lại giờ tan ca\" để nhập giờ thực tế.", "If you clocked out by mistake, use \"🔄 Re-record clock-out time\" to enter the real time."],["지난 날짜(버튼을 못 누른 날)는 「출퇴근」 화면에서 날짜를 바꿔 직접 입력합니다.", "Ngày đã qua (quên bấm nút) thì đổi ngày trong màn hình \"Chấm công\" và nhập trực tiếp.", "For past days (when you forgot), change the date on the \"Attendance\" screen and enter it."],["공지는 「출퇴근」 화면 맨 위에 나옵니다.", "Thông báo hiện ở trên cùng màn hình \"Chấm công\".", "Notices appear at the top of the \"Attendance\" screen."],["읽은 뒤 「✔ 확인했습니다」를 꼭 누르세요. 관리자가 누가 확인했는지 봅니다.", "Đọc xong nhớ bấm \"✔ Đã xác nhận\". Quản lý sẽ xem ai đã xác nhận.", "After reading, be sure to tap \"✔ I have read it\". Managers see who confirmed."],["🚨 긴급알림은 확인할 때까지 앱을 열 때마다 창으로 뜹니다.", "🚨 Cảnh báo khẩn sẽ hiện lên mỗi lần mở ứng dụng cho đến khi bạn xác nhận.", "🚨 Urgent alerts pop up every time you open the app until you confirm."],["「투입명단」에서 날짜별로 어느 현장에 누구와 투입되는지 봅니다.", "Trong \"Danh sách điều động\", xem theo ngày bạn làm ở công trường nào, với ai.", "In \"Crew list\", see by date which site you work at and with whom."],["관리자가 명단을 공개하면 휴대폰 알림이 옵니다.", "Khi quản lý công bố danh sách, bạn sẽ nhận thông báo.", "You get a notification when the manager publishes the list."],["안전작업허가서가 있으면 「📋 안전작업허가서」로 볼 수 있습니다.", "Nếu có giấy phép làm việc an toàn, xem bằng \"📋 Giấy phép làm việc an toàn\".", "If there is a work permit, open it with \"📋 Safety work permit\"."],["「연차·휴가」에서 종류(연차·반차 등)와 날짜를 골라 신청합니다.", "Trong \"Nghỉ phép\", chọn loại (nghỉ năm, nửa ngày…) và ngày rồi gửi.", "In \"Leave\", choose the type (annual, half-day…) and date, then request."],["관리자가 승인·반려하면 알림이 옵니다.", "Khi quản lý duyệt hoặc từ chối, bạn sẽ nhận thông báo.", "You get a notification when it is approved or rejected."],["근로계약서도 준비되면 여기서 보고 서명합니다.", "Khi hợp đồng lao động sẵn sàng, bạn cũng xem và ký ở đây.", "Employment contracts will also be viewed and signed here when ready."],["회사에 바라는 점이나 불편한 점을 적습니다.", "Viết điều bạn mong muốn hoặc bất tiện với công ty.", "Write your suggestions or concerns for the company."],["익명으로도 쓸 수 있습니다.", "Có thể viết ẩn danh.", "You can also post anonymously."],["위치가 안 잡히면 휴대폰 설정에서 위치(GPS)를 켜고, 브라우저의 위치 권한을 「허용」으로 바꿉니다.", "Nếu không lấy được vị trí, bật vị trí (GPS) trong cài đặt và cho phép quyền vị trí của trình duyệt.", "If location fails, turn on location (GPS) in settings and set the browser's location permission to \"Allow\"."],["화면이 이상하면 아래로 당겨 새로고침하세요.", "Nếu màn hình bất thường, kéo xuống để tải lại.", "If the screen looks wrong, pull down to refresh."],["비밀번호를 잊었으면 관리자에게 「비밀번호 초기화」를 요청하세요.", "Nếu quên mật khẩu, nhờ quản lý \"đặt lại mật khẩu\".", "If you forget your password, ask your manager to reset it."],["그래도 안 되면 화면을 캡처해 관리자에게 보내 주세요.", "Nếu vẫn không được, chụp màn hình gửi cho quản lý.", "If it still doesn't work, send a screenshot to your manager."],["익명으로도 쓸 수 있습니다.", "Có thể viết ẩn danh.", "You can also post anonymously."],
["📲 휴대폰에 앱으로 설치하세요", "📲 Cài đặt như ứng dụng trên điện thoại", "📲 Install it as an app on your phone"],["📲 앱 설치·사용 방법", "📲 Cách cài đặt và sử dụng", "📲 How to install and use"],["닫기", "Đóng", "Close"],["🤖 안드로이드 — 크롬", "🤖 Android — Chrome", "🤖 Android — Chrome"],["🍎 아이폰 — 사파리", "🍎 iPhone — Safari", "🍎 iPhone — Safari"],["크롬 앱으로 이 사이트를 엽니다.", "Mở trang này bằng ứng dụng Chrome.", "Open this site in the Chrome app."],["오른쪽 위 ⋮ 메뉴 → 「설치 및 바로가기」를 누르고 안내에 따라 설치합니다.", "Bấm menu ⋮ góc trên bên phải → chọn \"설치 및 바로가기\" (Cài đặt và lối tắt) rồi làm theo hướng dẫn.", "Tap the ⋮ menu (top right) → \"설치 및 바로가기\" (Install & shortcuts) and follow the prompts."],["다음부터는 홈 화면의 「고센이엔지」 아이콘으로 엽니다.", "Từ lần sau, mở bằng biểu tượng 「고센이엔지」 trên màn hình chính.", "From now on, open it with the 「고센이엔지」 icon on your home screen."],["사파리 앱으로 이 사이트를 엽니다.", "Mở trang này bằng ứng dụng Safari.", "Open this site in the Safari app."],["아래쪽 공유 버튼(네모 위 화살표)을 누릅니다.", "Bấm nút Chia sẻ ở dưới (hình vuông có mũi tên lên).", "Tap the Share button at the bottom (square with an up arrow)."],["「홈 화면에 추가」 → 오른쪽 위 「추가」를 누릅니다.", "Chọn \"Thêm vào MH chính\" → bấm \"Thêm\" ở góc trên bên phải.", "Choose \"Add to Home Screen\" → tap \"Add\" (top right)."],["다음부터는 홈 화면의 「고센이엔지」 아이콘으로 엽니다. (아이폰은 이렇게 해야 휴대폰 알림을 받을 수 있습니다. iOS 16.4 이상)", "Từ lần sau, mở bằng biểu tượng 「고센이엔지」 trên màn hình chính. (iPhone phải làm như vậy mới nhận được thông báo. iOS 16.4 trở lên)", "From now on, open it with the 「고센이엔지」 icon. (On iPhone this is required to receive notifications. iOS 16.4 or later)"],["안드로이드는 크롬, 아이폰은 사파리로 쓰세요. 처음 한 번 설치해 두면 앱처럼 아이콘으로 바로 열립니다.", "Android dùng Chrome, iPhone dùng Safari. Cài một lần là mở ngay bằng biểu tượng như ứng dụng.", "Use Chrome on Android and Safari on iPhone. Install once and it opens from an icon like an app."],["안드로이드는 크롬, 아이폰은 사파리로 쓰세요. 카카오톡에서 받은 링크는 「다른 브라우저로 열기」로 여세요.", "Android dùng Chrome, iPhone dùng Safari. Link nhận qua KakaoTalk hãy chọn \"Mở bằng trình duyệt khác\".", "Use Chrome on Android and Safari on iPhone. For links from KakaoTalk, use \"Open in another browser\"."],["설치 방법 보기", "Xem cách cài đặt", "How to install"],
